name: CI

# WHAT THIS RUNS, AND WHAT IT DOES NOT.
#
# CI runs some of this repo's suites and not others. Read this before adding a
# green badge anywhere: a CI that looks like it tests everything while testing
# part of it is worse than one that says which part.
#
#   RUNS HERE (offline, no credentials, no database):
#     test_gh_app_token.sh              the credential-minter regression suite
#     omniroute_combo_cli.sh selftest   containment logic, fixture catalogue
#     test_responsible_leader.sh        who may approve a provisioning request
#     syntax + secret scan              see the steps below
#     plugins/gh-token-broker           see the `broker-suite` job below
#     mcp/                              see the `mcp-suite` job below
#
#   CANNOT RUN HERE:
#     test_privilege_ceilings.sh
#     test_request_queue.sh
#   Both require COMPANY_ID and a live PaperclipAI Postgres reached through
#   `podman exec paperclip-db`, and both CREATE AND DELETE REAL AGENTS in that
#   company as their method. There is no fixture database to point them at, and
#   giving a GitHub runner credentials to the production company database to run
#   tests would be a far worse trade than the coverage is worth. They stay
#   operator-run, on the VPS, before a release. `bash -n` below at least proves
#   they still parse, which catches the most common way a shell suite rots.
#     Making them CI-able means giving them a disposable database. That is real
#   work, it is not this task, and it is filed rather than hidden here.
#
#   NOT A SUITE: org_access_review.sh is cron/CI-able in principle but also
#   needs the live database, so it is excluded for the same reason.
#
# This list deliberately carries no test counts. CI asserts EXIT STATUS and
# never a count: counts drift as suites grow, and a gate that pins one turns
# ordinary growth into a red build. Do not add them back.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-suites:
    name: Offline suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Every tool here is a script; there is no build. A parse error is the
      # most common regression and the cheapest to catch, so catch it first —
      # including in the two suites CI cannot execute.
      - name: Syntax check every script
        run: |
          set -euo pipefail
          rc=0
          for f in *.sh; do bash -n "$f" || { echo "::error file=$f::bash parse error"; rc=1; }; done
          for f in *.js; do node --check "$f" || { echo "::error file=$f::node parse error"; rc=1; }; done
          # mcp/ is ES modules, so --check needs to be told; without the flag
          # node parses them as CommonJS and every `export` is a syntax error.
          for f in mcp/*.mjs mcp/test/*.mjs; do
            node --check --input-type=module < "$f" || { echo "::error file=$f::node parse error"; rc=1; }
          done
          exit $rc

      # The reason this repo exists. Offline: a stub API on 127.0.0.1, a
      # generated throwaway RSA key, and fabricated token-shaped canaries.
      - name: gh-app-token.js regression suite
        run: ./test_gh_app_token.sh

      - name: omniroute containment selftest
        run: ./omniroute_combo_cli.sh selftest

      # The authorization change from TOG-194: who may approve a provisioning
      # request. Runs here because it fabricates its whole world — a TSV org
      # fixture through ORG_SNAPSHOT, a stub provisioner through PROV — so it
      # needs neither the database nor a company. It is the ONLY automated
      # coverage of that logic that CI can execute; test_request_queue.sh is
      # better evidence and stays operator-run for the reasons above.
      - name: responsible-leader authorization suite
        run: ./test_responsible_leader.sh

      # "No secrets in this repo, ever" is a stated non-negotiable, so it gets
      # an assertion rather than a promise. Scans TRACKED files only: anything
      # .gitignore covers is by definition not in the repo, and scanning the
      # working tree would fail on an operator's local scratch files.
      #   test_gh_app_token.sh assembles its canaries from fragments at runtime
      # precisely so the suite does not trip this step.
      - name: Secret scan
        run: |
          set -uo pipefail
          rc=0
          # git grep searches tracked files only, which is the scope we want.
          # Live GitHub credentials of every prefix, and private key material.
          if git grep -nIE '(gh[pousr]_[A-Za-z0-9]{16,}|github_pat_[A-Za-z0-9_]{16,})'; then
            echo "::error::a GitHub-token-shaped string is committed"; rc=1
          fi
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY'; then
            echo "::error::private key material is committed"; rc=1
          fi
          # The .gitignore entries other steps and the tools depend on. Losing
          # one is silent until the day something lands in a commit.
          for pat in '*.env' '*.pem' '*.key' '*.jsonl' '.gh-app-token.json'; do
            grep -qxF "$pat" .gitignore || { echo "::error::.gitignore no longer covers $pat"; rc=1; }
          done
          [ $rc -eq 0 ] && echo "secret scan: clean"
          exit $rc

      # A suite that cannot fail is decoration. This reintroduces the exact
      # 2026-08-23 bug into a THROWAWAY COPY — never the tracked file — and
      # requires the suite to reject it. If someone weakens the assertions
      # later, this step goes red before the regression can ship behind them.
      # Same discipline for the authorization suite. A green suite that cannot
      # fail is worse than no suite, and this one guards a privilege boundary.
      # Mutation: let a dormant leader be SKIPPED instead of woken. That is the
      # single most tempting future "fix" to this design and it silently turns
      # waiting into approver-shopping, so the suite must reject it.
      - name: Prove the authorization suite still detects a widened rule
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp org_request_queue.sh org_provisioner.sh test_responsible_leader.sh "$mut/"
          sed -i 's/if \[\[ "$a_status" == "terminated" \]\]; then/if [[ "$a_status" == "terminated" || "$a_status" == "paused" ]]; then/' \
            "$mut/org_request_queue.sh"
          if (cd "$mut" && ./test_responsible_leader.sh >/dev/null 2>&1); then
            echo "::error::the authorization suite passed against a skipped-dormant-leader mutation"
            exit 1
          fi
          echo "authorization suite correctly rejects the mutation"

      - name: Prove the regression suite still detects the bug
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp gh-app-token.js test_gh_app_token.sh "$mut/"
          # Delete the help branch and the refusal, restoring the unconditional
          # trailing mint that leaked a live org-admin token. Written with no
          # single quotes inside so the shell quoting stays legible.
          node -e '
            var fs = require("fs");
            var p = process.argv[1];
            var s = fs.readFileSync(p, "utf8");
            var i = s.indexOf("if (mode === undefined");
            var j = s.indexOf("main().catch");
            if (i < 0 || j < 0) {
              console.error("::error::could not find the dispatch tail of main() to mutate; this guard is now blind, fix it");
              process.exit(2);
            }
            fs.writeFileSync(p, s.slice(0, i) + "process.stdout.write(await token())\n}\n\n" + s.slice(j));
          ' "$mut/gh-app-token.js"
          node --check "$mut/gh-app-token.js"
          if "$mut/test_gh_app_token.sh" > "$mut/out.txt" 2>&1; then
            echo "::error::the regression suite PASSED against a deliberately reintroduced bug"
            cat "$mut/out.txt"
            exit 1
          fi
          grep -c 'FAIL' "$mut/out.txt" | xargs -I{} echo "suite correctly reported {} failures against the mutant"

  # ---------------------------------------------------------------------------
  # The gh-token-broker plugin suite (TOG-213 / TOG-174).
  #
  # Separate job, not a step on `offline-suites`, for two reasons that are not
  # stylistic: it needs a different Node major (see below), and it is the only
  # thing in this repo with npm dependencies. Keeping it apart means a registry
  # hiccup cannot turn the shell suites red, and the two failures read
  # differently in the checks list instead of as one opaque "CI failed".
  #
  # Like every other suite here, this one is gated on EXIT STATUS and never on a
  # test count. See the header.
  broker-suite:
    name: gh-token-broker suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/gh-token-broker
    steps:
      - uses: actions/checkout@v4

      # Node 24, deliberately, while the job above pins 20. This suite is written
      # against the runtime the Paperclip instance actually executes the plugin
      # on, and `node --test` semantics have moved between those majors. Testing
      # the broker on a Node the host does not run would be testing the wrong
      # thing.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/gh-token-broker/package-lock.json

      # --ignore-scripts: nothing in this dependency tree should be running
      # lifecycle scripts on a runner that has a checkout of credential tooling
      # sitting next to it. It is three packages with no build step; if this flag
      # ever starts breaking the install, that is a fact worth stopping on rather
      # than a flag worth removing.
      #
      # --include=dev is NOT redundant, however much it looks it. Both packages
      # are devDependencies (the host supplies plugin-sdk at runtime; shared is
      # test-only), and npm silently implies --omit=dev whenever NODE_ENV is
      # `production`. The Paperclip instance sets exactly that, so `npm ci` there
      # installs NOTHING, exits 0, prints "up to date", and every test then fails
      # ERR_MODULE_NOT_FOUND. A green install step followed by an unexplained
      # module error is a bad afternoon; the flag makes it impossible.
      - name: Install pinned host packages
        run: npm ci --include=dev --ignore-scripts

      # Guard the above rather than trusting it. If the install silently no-ops
      # again, fail HERE with the reason, not 40 lines later as a module error.
      - name: Verify the install actually landed
        run: |
          set -euo pipefail
          for p in @paperclipai/shared @paperclipai/plugin-sdk; do
            [ -d "node_modules/$p" ] || {
              echo "::error::$p is missing after npm ci — dev dependencies were omitted (NODE_ENV=${NODE_ENV:-unset})"
              exit 1
            }
          done
          echo "install ok: both host packages present"

      # Pass the FILE, not the directory. `node --test test/` resolves `test` as
      # a module specifier on Node 24 and dies with one MODULE_NOT_FOUND before
      # running anything — which looks precisely like a broken suite and is not.
      # `npm test` in package.json passes the file for this reason; it is invoked
      # here rather than open-coded so the two cannot drift apart.
      - name: Broker suite
        run: npm test

      # No credential, no network, no host: the suite fabricates its own RSA key
      # and stubs every outbound call. Anything that starts reaching the real
      # GitHub API from CI is a regression in the suite's isolation, not a
      # networking problem to be fixed by opening the runner up.
      #   This asserts that property instead of trusting it: the private key the
      # broker signs with must never appear in the suite's own output, and the
      # run must not need GH_APP_* to pass.
      - name: Prove the suite needs no credential and leaks no key
        env:
          GH_APP_ID: ''
          GH_APP_ORG: ''
          GH_APP_PRIVATE_KEY: ''
          GH_APP_REPOS: ''
          GH_APP_PERMISSIONS: ''
        run: |
          set -uo pipefail
          npm test > out.txt 2>&1; rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::the broker suite requires a credential to pass; it must not"
            cat out.txt; exit 1
          fi
          if grep -qE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' out.txt; then
            echo "::error::private key material reached the suite's stdout"
            exit 1
          fi
          echo "broker suite: passes with GH_APP_* empty, no key in output"
          rm -f out.txt

  # ---------------------------------------------------------------------------
  # The host-side MCP transport (TOG-196 / TOG-194).
  #
  # Separate job, and pinned to Node 24 rather than the 20 the shell job uses,
  # for the same reason as broker-suite: this code runs on the HOST under the
  # node the operator actually has, and `node --test` semantics have moved
  # between those majors. Testing the transport on a Node the host does not run
  # would be testing the wrong thing.
  #
  # Zero dependencies by design — no npm install step here, and there should
  # never be one. This process runs as the operator user with podman access;
  # an npm tree next to that is a supply-chain surface the server is small
  # enough not to need.
  #
  # Gated on EXIT STATUS, never a test count. See the header.
  mcp-suite:
    name: org-request-mcp suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: org-request-mcp regression suite
        run: node --test mcp/test/org-request-mcp.test.mjs

      # A suite that cannot fail is decoration, and this one guards an IDENTITY
      # boundary — the property the whole epic rests on. Both mutations below
      # are real, tempting simplifications rather than invented nonsense, and
      # the suite must reject each of them. Written with node -e and no single
      # quotes inside, matching the style of the offline-suites mutations above.
      #
      # MUTATION 1: silently ignore a forged identity argument instead of
      # refusing it. This is the most likely future "cleanup" — buildQueueArgs
      # never reads a `requester` key anyway, so the denylist looks redundant.
      # It is not. A silent drop lets a caller believe it acted as someone else
      # right up until it reads the audit log; the refusal has to be loud.
      - name: Prove the suite rejects a silently-ignored identity argument
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp -r mcp "$mut/"
          node -e '
            var fs = require("fs");
            var p = process.argv[1];
            var s = fs.readFileSync(p, "utf8");
            var needle = "const bad = Object.keys(args).find((key) => FORBIDDEN_ARGUMENT_NAMES.has(key));";
            if (s.indexOf(needle) < 0) {
              console.error("::error::could not find the identity-argument guard to mutate; this check is now blind, fix it");
              process.exit(2);
            }
            fs.writeFileSync(p, s.replace(needle, "const bad = undefined;"));
          ' "$mut/mcp/org-request-mcp.mjs"
          if node --test "$mut/mcp/test/org-request-mcp.test.mjs" >/dev/null 2>&1; then
            echo "::error::the suite PASSED against a silently-dropped identity argument"
            exit 1
          fi
          echo "suite correctly rejects the silent-drop mutation"

      # MUTATION 2: let an unreachable database fail OPEN. The tempting version
      # is "do not take the transport down just because podman hiccuped" — which
      # converts a database outage into an authentication bypass, because the
      # agent header is then trusted on its own.
      - name: Prove the suite rejects a fail-open run check
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp -r mcp "$mut/"
          node -e '
            var fs = require("fs");
            var p = process.argv[1];
            var s = fs.readFileSync(p, "utf8");
            var needle = "    if (failure) {";
            if (s.indexOf(needle) < 0) {
              console.error("::error::could not find the run-check failure branch to mutate; this check is now blind, fix it");
              process.exit(2);
            }
            fs.writeFileSync(p, s.replace(needle, "    if (failure) { return; }\n    if (false) {"));
          ' "$mut/mcp/org-request-mcp.mjs"
          if node --test "$mut/mcp/test/org-request-mcp.test.mjs" >/dev/null 2>&1; then
            echo "::error::the suite PASSED against a fail-open run corroboration check"
            exit 1
          fi
          echo "suite correctly rejects the fail-open mutation"

      # The transport must never grow a path to the provisioner. This is a
      # source-level assertion because it is cheaper than any test and the
      # constraint is absolute: the queue is the only entry point.
      - name: Prove the transport cannot reach the provisioner
        run: |
          set -uo pipefail
          rc=0
          if grep -n "org_provisioner" mcp/org-request-mcp.mjs | grep -qv "never the provisioner"; then
            echo "::error::org-request-mcp.mjs references the provisioner"; rc=1
          fi
          # execFile only, and only with an argv array. A shell would make every
          # argument-hygiene test in the suite meaningless.
          for bad in "execSync" "spawnSync" "shell: true" "eval("; do
            if grep -nF "$bad" mcp/org-request-mcp.mjs; then
              echo "::error::mcp/org-request-mcp.mjs uses $bad; this transport shells out only via execFile with an argv array"; rc=1
            fi
          done
          [ $rc -eq 0 ] && echo "transport surface: clean"
          exit $rc
