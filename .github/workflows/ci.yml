name: CI

# WHAT THIS RUNS, AND WHAT IT DOES NOT.
#
# CI runs some of this repo's suites and not others. Read this before adding a
# green badge anywhere: a CI that looks like it tests everything while testing
# part of it is worse than one that says which part.
#
#   RUNS HERE (offline, no credentials, no database):
#     test_gh_app_token.sh              the credential-minter regression suite
#     test_gh_token_argv.sh             gh_token.sh: no credential on argv
#     omniroute_combo_cli.sh selftest   containment logic, fixture catalogue
#     test_responsible_leader.sh        who may approve a provisioning request
#     test_request_record_integrity.sh  whether the RECORD of a decision can
#                                       still say what was approved and why
#     test_decision_notify.sh           whether the REQUESTER ever learns a
#                                       request was decided, and that delivery
#                                       cannot influence a decision — TOG-254
#     test_sql_backend.sh               lib/pcsql.sh dispatch, against fake
#                                       podman/psql binaries — see TOG-202
#     syntax + secret scan              see the steps below
#     plugins/gh-token-broker           see the `broker-suite` job below
#     gh-event-capture                  see the `capture-suite` job below
#
#   CANNOT RUN HERE:
#     test_privilege_ceilings.sh
#     test_request_queue.sh
#   Both CREATE AND DELETE REAL AGENTS in a company as their method, and giving
#   a GitHub runner credentials to the production company database would be a
#   far worse trade than the coverage is worth. They stay operator-run, on the
#   VPS, before a release. `bash -n` below at least proves they still parse,
#   which catches the most common way a shell suite rots.
#
#   WHAT IS STILL MISSING, precisely (TOG-202). The first blocker is gone: as of
#   lib/pcsql.sh the tools no longer hard-wire `podman exec paperclip-db`, so
#   they CAN be pointed at a throwaway database with PAPERCLIP_SQL_BACKEND=psql.
#   Three things still stand between that and a green run here, and the third
#   was not obvious until someone read the provisioner:
#     1. a schema dump, so a service container has tables to talk to;
#     2. an org fixture — the suites reference P0/P1/O*/T*/F* rows by
#        `metadata->>'orgRoleId'` and assume they already exist;
#     3. A LIVE PAPERCLIP API SERVER. The suites drive org_provisioner.sh, which
#        creates and terminates agents through `paperclipai agent create` /
#        `terminate` against PAPERCLIP_API_URL, not through SQL. A Postgres
#        service container alone does not make these suites run; it makes them
#        fail later, at the first `pc agent create`, which is a worse failure
#        mode than today's honest exclusion.
#   Do not wire these two into CI until 3 is answered. A suite that is present
#   and failing for an environmental reason gets muted, and a muted suite is
#   indistinguishable from a deleted one.
#
#   NOT A SUITE: org_access_review.sh is read-only and needs no API server, so
#   it clears blocker 3 — but it still needs 1 and 2, so it is excluded too.
#
# This list deliberately carries no test counts. CI asserts EXIT STATUS and
# never a count: counts drift as suites grow, and a gate that pins one turns
# ordinary growth into a red build. Do not add them back.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-suites:
    name: Offline suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Every tool here is a script; there is no build. A parse error is the
      # most common regression and the cheapest to catch, so catch it first —
      # including in the two suites CI cannot execute.
      - name: Syntax check every script
        run: |
          set -euo pipefail
          rc=0
          # lib/*.sh is included explicitly. It is sourced by five tools, so a
          # parse error there breaks all of them, and a bare `*.sh` glob does
          # not descend into it.
          for f in *.sh lib/*.sh; do bash -n "$f" || { echo "::error file=$f::bash parse error"; rc=1; }; done
          for f in *.js; do node --check "$f" || { echo "::error file=$f::node parse error"; rc=1; }; done
          exit $rc

      # The reason this repo exists. Offline: a stub API on 127.0.0.1, a
      # generated throwaway RSA key, and fabricated token-shaped canaries.
      - name: gh-app-token.js regression suite
        run: ./test_gh_app_token.sh

      # TOG-222: the credential-source half. test_gh_app_token.sh owns the leak
      # traps and the cache fixtures; this suite owns broker-vs-PEM selection,
      # which needs a stub broker on loopback and is far easier to express here.
      #
      # Pass the FILE, not the directory — same Node 24 gotcha the broker-suite
      # job documents. It bites on 20 too, so do not "fix" this to `test/`.
      #
      # Offline by construction: GH_API_URL and GH_APP_BROKER_URL both point at
      # stubs the suite starts itself, and the RSA key is generated per-run.
      - name: gh-app-token.js broker/credential-source suite
        run: node --test test/gh-app-token.test.mjs

      # Same reasoning as the broker suite's equivalent step: assert the
      # isolation rather than trust it. If this ever needs a real GH_APP_*, the
      # suite has started reaching for a live credential.
      - name: Prove the credential-source suite needs no credential
        env:
          GH_APP_ID: ''
          GH_APP_PRIVATE_KEY: ''
          PAPERCLIP_API_URL: ''
          PAPERCLIP_API_KEY: ''
          PAPERCLIP_TASK_ID: ''
        run: |
          set -uo pipefail
          node --test test/gh-app-token.test.mjs > out.txt 2>&1; rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::the credential-source suite requires a credential to pass; it must not"
            cat out.txt; exit 1
          fi
          if grep -qE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' out.txt; then
            echo "::error::private key material reached the suite's stdout"; exit 1
          fi
          echo "credential-source suite: passes with GH_APP_*/PAPERCLIP_* empty"
          rm -f out.txt

      - name: omniroute containment selftest
        run: ./omniroute_combo_cli.sh selftest

      # The TOG-226 standing gate. Offline: the board and GitHub reads are
      # redirected to fixtures, and the argv assertions use a stub curl that
      # never opens a socket. It covers the two ways this check can be wrong
      # in the direction that matters — reporting a clean board when residue
      # exists (which is what authorises a PEM unbind), including the ARG_MAX
      # failure-open that only appeared at production board size.
      - name: scope-residue gate regression suite
        run: ./test_gh_scope_residue.sh

      # TOG-310. Audits every link in git's credential-helper chain for
      # substitutability by the shared agent uid — the helper program, its
      # directory, and every config file that can name a helper, including ones
      # that do not exist yet but can be created.
      #
      # Portable by construction: the analysis is pure permission arithmetic, so
      # the suite builds its fixtures from real root-owned paths (/usr/bin/git,
      # /etc) that exist on a runner too, and skips only the handful of
      # assertions about /paperclip itself. It pins both bugs found by checking
      # the audit's output against live write probes rather than by reading it:
      # symlinked /bin reported as a world-writable hole, and an absent config
      # under a creatable parent reported clean.
      - name: credential-chain audit regression suite
        run: ./test_credential_chain_audit.sh

      # The authorization change from TOG-194: who may approve a provisioning
      # request. Runs here because it fabricates its whole world — a TSV org
      # fixture through ORG_SNAPSHOT, a stub provisioner through PROV — so it
      # needs neither the database nor a company. It is the ONLY automated
      # coverage of that logic that CI can execute; test_request_queue.sh is
      # better evidence and stays operator-run for the reasons above.
      - name: responsible-leader authorization suite
        run: ./test_responsible_leader.sh

      # TOG-253. The sibling suite asks "who may decide?"; this one asks the
      # question an audit actually asks — can the RECORD still say what was
      # approved and why, six months later. Different question, different
      # failure modes, so it is a separate suite rather than more sections
      # bolted onto the one above. Same two offline seams (ORG_SNAPSHOT and a
      # stub PROV), so it needs no database and no credential either.
      - name: request-record integrity suite
        run: ./test_request_record_integrity.sh

      # TOG-254. A third question again: the first two ask who may decide and
      # whether the record survives, this one asks whether the REQUESTER ever
      # finds out. It also carries the containment half — that a failed or
      # hostile notifier cannot block, alter or re-target a decision — which is
      # the part that turns a convenience feature into an authorization
      # concern. Third offline seam: REQUEST_NOTIFY_CMD, a stub transport, so
      # "delivery failed" is a case the suite CAUSES rather than waits for.
      - name: decision-notification suite
        run: ./test_decision_notify.sh

      # lib/pcsql.sh decides how every DB-touching tool reaches PostgreSQL. It
      # is a dispatcher, so it is testable without a database: the suite puts
      # recording fakes for `podman` and `psql` on PATH and asserts the exact
      # argv, stdin and environment each backend produces. No database, no
      # credential, no network.
      - name: SQL backend seam suite
        run: ./test_sql_backend.sh
      # TOG-247: the CI status reader that must never report a denial or an
      # empty result set as green. Offline — a stub GitHub API on 127.0.0.1
      # serves a different permission/result case off each ref, so this needs no
      # credential and no network.
      - name: fail-closed CI status suite
        run: ./test_gh_ci_status.sh

      # "No secrets in this repo, ever" is a stated non-negotiable, so it gets
      # an assertion rather than a promise. Scans TRACKED files only: anything
      # .gitignore covers is by definition not in the repo, and scanning the
      # working tree would fail on an operator's local scratch files.
      #   test_gh_app_token.sh assembles its canaries from fragments at runtime
      # precisely so the suite does not trip this step.
      - name: Secret scan
        run: |
          set -uo pipefail
          rc=0
          # git grep searches tracked files only, which is the scope we want.
          # Live GitHub credentials of every prefix, and private key material.
          if git grep -nIE '(gh[pousr]_[A-Za-z0-9]{16,}|github_pat_[A-Za-z0-9_]{16,})'; then
            echo "::error::a GitHub-token-shaped string is committed"; rc=1
          fi
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY'; then
            echo "::error::private key material is committed"; rc=1
          fi
          # The .gitignore entries other steps and the tools depend on. Losing
          # one is silent until the day something lands in a commit.
          for pat in '*.env' '*.pem' '*.key' '*.jsonl' '.gh-app-token.json'; do
            grep -qxF "$pat" .gitignore || { echo "::error::.gitignore no longer covers $pat"; rc=1; }
          done
          [ $rc -eq 0 ] && echo "secret scan: clean"
          exit $rc

      # A suite that cannot fail is decoration. Each mutation step below
      # reintroduces a REAL past defect into a THROWAWAY COPY — never a tracked
      # file — and requires the suite to reject it.
      #
      # WHY THERE IS A BASELINE ASSERTION IN HERE (TOG-253). Until this commit
      # these steps copied the suites into a temp directory WITHOUT lib/, which
      # org_request_queue.sh sources and exits 1 without. The copied suite
      # therefore failed in that directory no matter what the sed did, and
      # "the mutated suite failed" was true for a reason that had nothing to do
      # with the mutation. Both gates passed while proving nothing.
      #
      # The fix is not merely `cp -r lib` — it is asserting that the UNMUTATED
      # copy passes in the same directory first. That single check is what makes
      # a red result attributable to the mutation, and it is what would have
      # caught the original hole. mutation_check below does both, and every
      # mutation step goes through it.
      - name: Mutation gates — the suites must reject reintroduced defects
        run: |
          set -uo pipefail

          # stage <dir> — a runnable copy of the tools, lib/ included.
          stage() {
            cp org_request_queue.sh org_provisioner.sh org_access_review.sh \
               test_responsible_leader.sh test_request_record_integrity.sh \
               test_decision_notify.sh "$1/"
            mkdir -p "$1/lib" && cp lib/*.sh "$1/lib/"
          }

          # mutation_check <label> <suite> <expect-sibling: yes|no|skip> <sed-expr>...
          #   1. the unmutated copy must PASS      (else the gate is vacuous)
          #   2. the mutated copy must still PARSE (else it fails for the wrong reason)
          #   3. the mutated copy must FAIL        (the actual assertion)
          mutation_check() {
            local label="$1" suite="$2" sibling="$3"; shift 3
            local mut; mut="$(mktemp -d)"; stage "$mut"

            if ! (cd "$mut" && "./$suite" >/dev/null 2>&1); then
              echo "::error::$label: the UNMUTATED copy of $suite already fails — this gate proves nothing"
              (cd "$mut" && "./$suite" 2>&1 | tail -20)
              rm -rf "$mut"; return 1
            fi

            local e
            for e in "$@"; do sed -i "$e" "$mut/org_request_queue.sh"; done
            if ! bash -n "$mut/org_request_queue.sh"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            if ! cmp -s org_request_queue.sh "$mut/org_request_queue.sh"; then :; else
              echo "::error::$label: the sed changed nothing — the code moved and the mutation missed"
              rm -rf "$mut"; return 1
            fi

            if (cd "$mut" && "./$suite" >/dev/null 2>&1); then
              echo "::error::$label: $suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi

            # Cross-check: is this defect visible to the OTHER suite? Pins which
            # suite is actually carrying the weight, so the two cannot quietly
            # collapse into one.
            if [ "$sibling" != "skip" ]; then
              local other=test_responsible_leader.sh
              [ "$suite" = "$other" ] && other=test_request_record_integrity.sh
              if (cd "$mut" && "./$other" >/dev/null 2>&1); then
                [ "$sibling" = "yes" ] && {
                  echo "::error::$label: expected $other to catch this too, and it did not"; rm -rf "$mut"; return 1; }
              else
                [ "$sibling" = "no" ] && {
                  echo "::error::$label: $other also catches this, so it does not show $suite carries its own weight"
                  rm -rf "$mut"; return 1; }
              fi
            fi
            rm -rf "$mut"
            echo "  ok  $label"
          }

          rc=0

          # Let a dormant leader be SKIPPED instead of woken. The single most
          # tempting future "fix" to this design, and it silently turns waiting
          # into approver-shopping.
          mutation_check "skipped-dormant-leader" test_responsible_leader.sh skip \
            's/if \[\[ "$a_status" == "terminated" \]\]; then/if [[ "$a_status" == "terminated" || "$a_status" == "paused" ]]; then/' || rc=1

          # An auditor may not clear an override it took itself. Drop that one
          # comparison and the open-item list becomes self-service: the bypasser
          # writes the entry AND retires it, a write-only log in audit clothing.
          mutation_check "self-clearable-override" test_responsible_leader.sh skip \
            's/rv_id" == "$a_id"/rv_id" == "never-matches"/' || rc=1

          # TOG-253 defect 4, exactly as found: the reason guard back on the
          # denial path only, leaving approvals unreasoned. Expected to be
          # INVISIBLE to the authorization suite — a denial still needs a
          # reason — which is what shows the record suite earns its place.
          mutation_check "unreasoned-approval" test_request_record_integrity.sh no \
            's/\[\[ -n "$reason" \]\] || die "every decision/[[ -n "$reason" || "$decision" == "approved" ]] || die "every decision/' || rc=1

          # TOG-253 defect 3: expiry back to being a side effect of an attempted
          # review. Both halves go together — the reaper and the derivation in
          # request_state — because either alone still gives the right answer,
          # which is the point of having both.
          mutation_check "never-expires" test_request_record_integrity.sh skip \
            's/^reap_expired() {/reap_expired() { return 0;/' \
            's/expired "$exp" \&\& rec=/false \&\& rec=/' || rc=1

          # TOG-253 defect 1: the invariant, not the lock. An ambiguous id gets
          # resolved by tail -1 again instead of being refused.
          mutation_check "ambiguous-request-id" test_request_record_integrity.sh skip \
            's/\[\[ "$n" -le 1 \]\]/[[ "$n" -le 99 ]]/' || rc=1

          # --- TOG-254: the requester learns ---------------------------------
          # All four use sibling=skip. The cross-check picks "the other suite"
          # from a hard-coded pair, so it cannot express a third suite; using it
          # here would compare against an arbitrary one of the two and prove
          # nothing. The gates below still assert the full three-step contract.

          # THE headline defect this issue was filed about: "nothing wakes on an
          # expiry today at all". Expiry is the quietest of the terminal states
          # because no human action produces it, so it is the one that silently
          # reverts to notifying nobody.
          mutation_check "expiry-notifies-nobody" test_decision_notify.sh skip \
            's/emit_notification "$rid" expired/true "$rid" expired/' || rc=1

          # Expiry re-notifying on EVERY read, because reap_expired runs from
          # read paths. A notifier that pages on every `list` gets muted, and a
          # muted notifier is the dead end this issue exists to close, reached
          # by a different road.
          #
          # BOTH halves go together, for the same reason the never-expires gate
          # above mutates two lines: single-shot delivery is held by the
          # idempotency guard in emit_notification AND by reap_expired only
          # reaping requests whose last status is pending. Either alone gives
          # the right answer, so mutating one proves nothing — the first draft
          # of this gate mutated only the guard and the suite passed, which is
          # how the redundancy was found rather than assumed.
          mutation_check "notification-repeats-forever" test_decision_notify.sh skip \
            's/^  notify_already "$rid" && { NOTIFY_RESULT="already"; return 0; }/  false \&\& { NOTIFY_RESULT="already"; return 0; }/' \
            's/| map(select(.last == "pending" and .exp != ""))/| map(select(.exp != ""))/' || rc=1

          # Put the notification row back to carrying `status`, so it is shaped
          # like a decision. This is not hypothetical — it is the regression
          # this feature actually caused while being written, and it made
          # notified requests vanish from every filtered listing.
          mutation_check "notification-shaped-like-a-decision" test_decision_notify.sh skip \
            's/{event:"notify.queued",requestId:$id,decision:$s,/{event:"notify.queued",requestId:$id,status:$s,/' || rc=1

          # The undelivered-notification gate going green. Same failure mode as
          # a muted alarm: the feature still "works", and nobody learns that
          # nobody is learning.
          mutation_check "undelivered-gate-always-green" test_decision_notify.sh skip \
            's/\[\[ "$bad" -eq 0 \]\] ||/[[ "$bad" -ge 0 ]] ||/' || rc=1

          exit $rc

      - name: Prove the regression suite still detects the bug
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp gh-app-token.js test_gh_app_token.sh "$mut/"
          # Delete the help branch and the refusal, restoring the unconditional
          # trailing mint that leaked a live org-admin token. Written with no
          # single quotes inside so the shell quoting stays legible.
          node -e '
            var fs = require("fs");
            var p = process.argv[1];
            var s = fs.readFileSync(p, "utf8");
            var i = s.indexOf("if (mode === undefined");
            var j = s.indexOf("main().catch");
            if (i < 0 || j < 0) {
              console.error("::error::could not find the dispatch tail of main() to mutate; this guard is now blind, fix it");
              process.exit(2);
            }
            fs.writeFileSync(p, s.slice(0, i) + "process.stdout.write(await token())\n}\n\n" + s.slice(j));
          ' "$mut/gh-app-token.js"
          node --check "$mut/gh-app-token.js"
          if "$mut/test_gh_app_token.sh" > "$mut/out.txt" 2>&1; then
            echo "::error::the regression suite PASSED against a deliberately reintroduced bug"
            cat "$mut/out.txt"
            exit 1
          fi
          grep -c 'FAIL' "$mut/out.txt" | xargs -I{} echo "suite correctly reported {} failures against the mutant"

      # TOG-200. Asserts on the kernel's record — a stub curl on PATH reading
      # its own /proc/<pid>/cmdline — rather than on the source text, so a
      # future rewrite of how gh_token.sh calls curl cannot pass by accident.
      - name: gh_token.sh argv-leak suite
        run: ./test_gh_token_argv.sh

      # The matching mutation guard. This one is surgical: it leaves the config
      # file exactly as it is and ADDS the header back on argv, so every other
      # assertion in the suite still passes and only the /proc check can go red.
      # That is the point — it proves the /proc detector is what carries this
      # suite, not the config-file bookkeeping around it.
      - name: Prove the argv-leak suite still detects a credential on argv
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp gh_token.sh test_gh_token_argv.sh "$mut/"
          chmod +x "$mut/gh_token.sh" "$mut/test_gh_token_argv.sh"
          # TOG-253's rule, applied here too: the UNMUTATED copy must pass in
          # this same staging directory FIRST. Without it, "the mutated suite
          # failed" is not attributable to the mutation — the staged copy could
          # be failing for any reason at all (a missing sibling file, a change
          # in how GH_TOKEN_SH is resolved) and this gate would still go green
          # while proving nothing. It passes today; this keeps it honest.
          if ! GH_TOKEN_SH="$mut/gh_token.sh" "$mut/test_gh_token_argv.sh" > "$mut/base.txt" 2>&1; then
            echo "::error::the UNMUTATED copy of test_gh_token_argv.sh already fails in the staging dir — this gate proves nothing"
            tail -25 "$mut/base.txt"
            exit 1
          fi
          before='  curl --config "$cfg" "$@"'
          after='  curl --config "$cfg" -H "Authorization: Bearer $bearer" "$@"'
          if ! grep -qxF "$before" "$mut/gh_token.sh"; then
            echo "::error::could not find the curl invocation in curl_authed() to mutate; this guard is now blind, fix it"
            exit 2
          fi
          # awk, not sed: the replacement is full of characters sed would treat
          # as syntax, and a mutation that silently does nothing is the one
          # failure mode this step exists to avoid.
          awk -v b="$before" -v a="$after" '$0 == b { print a; next } { print }' \
            "$mut/gh_token.sh" > "$mut/gh_token.mut" && mv "$mut/gh_token.mut" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          bash -n "$mut/gh_token.sh"
          if GH_TOKEN_SH="$mut/gh_token.sh" "$mut/test_gh_token_argv.sh" > "$mut/out.txt" 2>&1; then
            echo "::error::the argv-leak suite PASSED against a credential deliberately put back on argv"
            cat "$mut/out.txt"
            exit 1
          fi
          grep -c 'FAIL' "$mut/out.txt" | xargs -I{} echo "suite correctly reported {} failures against the mutant"

      # Same discipline for the SQL backend seam. Both mutations below are
      # things a reasonable person would actually write; neither is a strawman.
      #
      # 1. Hand the URI to psql instead of decomposing it. This is the obvious
      #    one-liner, and it publishes the database password through
      #    /proc/*/cmdline on a host every company on the box shares.
      # 2. Auto-select the psql backend when DATABASE_URL happens to be set.
      #    This reads as a convenience and silently retargets the PROVISIONER —
      #    which creates and deletes real agents — at whatever that variable
      #    points to.
      - name: Prove the SQL backend suite still detects both unsafe shortcuts
        run: |
          set -uo pipefail
          rc=0
          for m in uri-on-argv sniff-database-url; do
            mut="$(mktemp -d)"
            cp -r lib "$mut/"
            cp test_sql_backend.sh org_provisioner.sh org_request_queue.sh \
               org_access_review.sh test_privilege_ceilings.sh test_request_queue.sh "$mut/"
            node -e '
              var fs = require("fs");
              var p = process.argv[1], which = process.argv[2];
              var s = fs.readFileSync(p, "utf8");
              var anchor = which === "uri-on-argv"
                ? "\n  psql \\\n"
                : "  local b=\"${PAPERCLIP_SQL_BACKEND:-podman}\"";
              if (s.indexOf(anchor) < 0) {
                console.error("::error::could not find the " + which + " anchor in lib/pcsql.sh; this guard is now blind, fix it");
                process.exit(2);
              }
              var repl = which === "uri-on-argv"
                ? "\n  psql \"$DATABASE_URL\" \\\n"
                : "  local b=\"${PAPERCLIP_SQL_BACKEND:-${DATABASE_URL:+psql}}\"; b=\"${b:-podman}\"";
              fs.writeFileSync(p, s.replace(anchor, repl));
            ' "$mut/lib/pcsql.sh" "$m" || exit 2
            bash -n "$mut/lib/pcsql.sh"
            if "$mut/test_sql_backend.sh" > "$mut/out.txt" 2>&1; then
              echo "::error::the SQL backend suite PASSED against the '$m' mutant"
              cat "$mut/out.txt"; rc=1
            else
              echo "$m: suite correctly reported $(grep -c 'FAIL' "$mut/out.txt") failures"
            fi
          done
      # Same discipline for the CI status reader (TOG-247). Its entire value is
      # the refusal to call an unobserved CI green, so a suite that cannot
      # detect that refusal being weakened is decoration. Both mutations below
      # are the tempting ones, not invented nonsense:
      #
      #   1. Make `unknown` exit 0. This is what someone reaches for the first
      #      time exit 3 breaks a pipeline — and it silently restores the exact
      #      false green, because `if gh_ci_status.sh; then merge` goes green on
      #      a token that was denied.
      #   2. Drop the no-signal guard, so zero results from a readable source
      #      falls through to pass. That is the naive "all runs concluded
      #      success" predicate, which is vacuously true for an empty list.
      - name: Prove the CI status suite still detects a weakened refusal
        run: |
          set -uo pipefail
          rc=0
          run_mutation() {
            mut="$(mktemp -d)"
            cp gh_ci_status.sh test_gh_ci_status.sh "$mut/"
            sed -i "$2" "$mut/gh_ci_status.sh"
            if ! bash -n "$mut/gh_ci_status.sh"; then
              echo "::error::the $1 mutation no longer parses; this guard is now blind, fix it"
              rc=1; return
            fi
            if diff -q gh_ci_status.sh "$mut/gh_ci_status.sh" >/dev/null; then
              echo "::error::the $1 mutation changed nothing; the sed no longer matches, so this guard is blind"
              rc=1; return
            fi
            if (cd "$mut" && ./test_gh_ci_status.sh >/dev/null 2>&1); then
              echo "::error::the CI status suite PASSED against the $1 mutation"
              rc=1; return
            fi
            echo "suite correctly rejects the $1 mutation"
          }
          run_mutation "unknown-exits-zero" 's/EXIT=3/EXIT=0/g'
          run_mutation "no-signal-is-a-pass" 's/^elif \[\[ "\$SIGNALS" -eq 0 \]\]; then/elif false; then/'
          exit $rc

      # Mutation: restore the pre-TOG-238 OR, where ANY non-empty scope satisfied
      # strict mode. That is the tempting simplification here — it reads as
      # "something was requested, so this is scoped" — and it silently reinstates
      # a token spanning every repo in the installation while GH_APP_SCOPE_STRICT=1
      # keeps reporting least-privilege. Mutating strictGaps() rather than its
      # callers reproduces the original semantics at every call site at once.
      - name: Prove the suite still detects a permissions-only scope passing strict mode
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp gh-app-token.js test_gh_app_token.sh "$mut/"
          node -e '
            var fs = require("fs");
            var p = process.argv[1];
            var s = fs.readFileSync(p, "utf8");
            var anchor = "function strictGaps(scope) {";
            if (s.indexOf(anchor) < 0) {
              console.error("::error::could not find strictGaps() to mutate; this guard is now blind, fix it");
              process.exit(2);
            }
            fs.writeFileSync(p, s.replace(anchor, anchor + "\n  if (Object.keys(scope).length > 0) return [];"));
          ' "$mut/gh-app-token.js"
          node --check "$mut/gh-app-token.js"
          if "$mut/test_gh_app_token.sh" > "$mut/out.txt" 2>&1; then
            echo "::error::the suite PASSED with strict mode satisfied by permissions alone (TOG-238 regression)"
            cat "$mut/out.txt"
            exit 1
          fi
          grep -c 'FAIL' "$mut/out.txt" | xargs -I{} echo "suite correctly reported {} failures against the strict-mode mutant"

      # The second TOG-238 mutation, and the subtler one. Strict mode gates the
      # PEM path, so `SOURCE === 'pem'` reads as a correct, even careful,
      # narrowing — the broker bounds scope server-side, why gate it? Because
      # the DEFAULT is `auto`, which falls back to the PEM on a retryable broker
      # failure. Under that spelling a broker outage silently turns the control
      # off on the one path that mints a ceiling token. This is not a strawman:
      # it is the exact line the TOG-226 merge produced, caught by this suite.
      - name: Prove the suite still detects strict mode gated on the wrong source
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp gh-app-token.js test_gh_app_token.sh "$mut/"
          before="  if (enforce && SOURCE !== 'broker') assertStrictForPem(scope)"
          after="  if (enforce && SOURCE === 'pem') assertStrictForPem(scope)"
          if ! grep -qxF "$before" "$mut/gh-app-token.js"; then
            echo "::error::could not find the strict-mode source gate to mutate; this guard is now blind, fix it"
            exit 2
          fi
          awk -v b="$before" -v a="$after" '$0 == b { print a; next } { print }' \
            "$mut/gh-app-token.js" > "$mut/mut.js" && mv "$mut/mut.js" "$mut/gh-app-token.js"
          chmod +x "$mut/gh-app-token.js"
          node --check "$mut/gh-app-token.js"
          if "$mut/test_gh_app_token.sh" > "$mut/out.txt" 2>&1; then
            echo "::error::the suite PASSED with strict mode gated on GH_APP_TOKEN_SOURCE === 'pem', which exempts the auto fallback (TOG-238)"
            cat "$mut/out.txt"
            exit 1
          fi
          grep -c 'FAIL' "$mut/out.txt" | xargs -I{} echo "suite correctly reported {} failures against the source-gate mutant"

  # ---------------------------------------------------------------------------
  # The gh-token-broker plugin suite (TOG-213 / TOG-174).
  #
  # Separate job, not a step on `offline-suites`, for two reasons that are not
  # stylistic: it needs a different Node major (see below), and it is the only
  # thing in this repo with npm dependencies. Keeping it apart means a registry
  # hiccup cannot turn the shell suites red, and the two failures read
  # differently in the checks list instead of as one opaque "CI failed".
  #
  # Like every other suite here, this one is gated on EXIT STATUS and never on a
  # test count. See the header.
  broker-suite:
    name: gh-token-broker suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/gh-token-broker
    steps:
      - uses: actions/checkout@v4

      # Node 24, deliberately, while the job above pins 20. This suite is written
      # against the runtime the Paperclip instance actually executes the plugin
      # on, and `node --test` semantics have moved between those majors. Testing
      # the broker on a Node the host does not run would be testing the wrong
      # thing.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/gh-token-broker/package-lock.json

      # --ignore-scripts: nothing in this dependency tree should be running
      # lifecycle scripts on a runner that has a checkout of credential tooling
      # sitting next to it. It is three packages with no build step; if this flag
      # ever starts breaking the install, that is a fact worth stopping on rather
      # than a flag worth removing.
      #
      # --include=dev is NOT redundant, however much it looks it. Both packages
      # are devDependencies (the host supplies plugin-sdk at runtime; shared is
      # test-only), and npm silently implies --omit=dev whenever NODE_ENV is
      # `production`. The Paperclip instance sets exactly that, so `npm ci` there
      # installs NOTHING, exits 0, prints "up to date", and every test then fails
      # ERR_MODULE_NOT_FOUND. A green install step followed by an unexplained
      # module error is a bad afternoon; the flag makes it impossible.
      - name: Install pinned host packages
        run: npm ci --include=dev --ignore-scripts

      # Guard the above rather than trusting it. If the install silently no-ops
      # again, fail HERE with the reason, not 40 lines later as a module error.
      - name: Verify the install actually landed
        run: |
          set -euo pipefail
          for p in @paperclipai/shared @paperclipai/plugin-sdk; do
            [ -d "node_modules/$p" ] || {
              echo "::error::$p is missing after npm ci — dev dependencies were omitted (NODE_ENV=${NODE_ENV:-unset})"
              exit 1
            }
          done
          echo "install ok: both host packages present"

      # Pass the FILE, not the directory. `node --test test/` resolves `test` as
      # a module specifier on Node 24 and dies with one MODULE_NOT_FOUND before
      # running anything — which looks precisely like a broken suite and is not.
      # `npm test` in package.json passes the file for this reason; it is invoked
      # here rather than open-coded so the two cannot drift apart.
      - name: Broker suite
        run: npm test

      # No credential, no network, no host: the suite fabricates its own RSA key
      # and stubs every outbound call. Anything that starts reaching the real
      # GitHub API from CI is a regression in the suite's isolation, not a
      # networking problem to be fixed by opening the runner up.
      #   This asserts that property instead of trusting it: the private key the
      # broker signs with must never appear in the suite's own output, and the
      # run must not need GH_APP_* to pass.
      - name: Prove the suite needs no credential and leaks no key
        env:
          GH_APP_ID: ''
          GH_APP_ORG: ''
          GH_APP_PRIVATE_KEY: ''
          GH_APP_REPOS: ''
          GH_APP_PERMISSIONS: ''
        run: |
          set -uo pipefail
          npm test > out.txt 2>&1; rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::the broker suite requires a credential to pass; it must not"
            cat out.txt; exit 1
          fi
          if grep -qE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' out.txt; then
            echo "::error::private key material reached the suite's stdout"
            exit 1
          fi
          echo "broker suite: passes with GH_APP_* empty, no key in output"
          rm -f out.txt

  # ---------------------------------------------------------------------------
  # gh-event-capture (TOG-289 / TOG-244).
  #
  # The self-hosted GitHub webhook store that stands in — partially, and the
  # README is emphatic about which parts — for the org audit log GitHub Free
  # does not give us.
  #
  # Its own job for the same reason as `broker-suite`: a different runtime
  # concern from the shell suites, and a failure here should read as "the
  # capture suite went red", not as one opaque "CI failed".
  #
  # NO INSTALL STEP, and that is not an omission. This directory has zero
  # runtime and zero dev dependencies: `node --test` on the sources, an
  # in-memory store standing in for D1, and a stub HTTP server for the shell
  # tools. Nothing here reaches npm, Cloudflare or GitHub. If a dependency ever
  # becomes necessary, the `--include=dev --ignore-scripts` install and the
  # did-it-actually-land guard from `broker-suite` are the pattern to copy.
  #
  # Gated on EXIT STATUS, never on a test count. See the header.
  capture-suite:
    name: gh-event-capture suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gh-event-capture
    steps:
      - uses: actions/checkout@v4

      # Node 24: the suite uses the global Request/Response/Headers and the
      # WebCrypto that the Workers runtime provides, so testing on a Node that
      # lacks them would be testing a different program than the one deployed.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check
        run: |
          set -euo pipefail
          npm run check
          for f in scripts/*.sh test/*.sh; do bash -n "$f"; done

      - name: Receiver suite
        run: npm test

      - name: Shell tool suite
        run: ./test/test_scripts.sh

      # The assertion behind every other step here. Reintroduce the exact bug
      # this module exists to prevent — a receiver that accepts without
      # verifying the signature — into a THROWAWAY COPY, never the tracked
      # file, and require the suite to reject it.
      #
      # The URL is public by construction, so "we verify signatures" is the
      # whole security model. A suite that would stay green without the
      # verification is decoration, and it would be believed.
      - name: Prove the suite detects a receiver that skips verification
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp -r src test package.json "$mut/"
          node -e '
            const fs = require("fs")
            const p = process.argv[1]
            const s = fs.readFileSync(p, "utf8")
            const call = "const verdict = await verifySignature({ secret: webhookSecret, body: bodyBytes, header: signature })"
            if (!s.includes(call)) {
              console.error("::error::could not find the verification call to mutate; this guard is now blind, fix it")
              process.exit(2)
            }
            fs.writeFileSync(p, s.replace(call, "const verdict = { ok: true }"))
          ' "$mut/src/app.js"
          node --check "$mut/src/app.js"
          if (cd "$mut" && node --test test/capture.test.mjs > out.txt 2>&1); then
            echo "::error::the suite PASSED against a receiver that does not verify signatures"
            cat "$mut/out.txt"
            exit 1
          fi
          echo "suite correctly went red against the unverifying mutant"

      # The shell suite fabricates its own RSA key and stubs the GitHub API.
      # Anything that starts needing a real credential is a regression in the
      # suite's isolation, not a networking problem to open the runner up for.
      - name: Prove the shell suite needs no credential and leaks no key
        env:
          GH_APP_ID: ''
          GH_APP_PRIVATE_KEY: ''
        run: |
          set -uo pipefail
          ./test/test_scripts.sh > out.txt 2>&1; rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::the shell suite requires a credential to pass; it must not"
            cat out.txt; exit 1
          fi
          if grep -qE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' out.txt; then
            echo "::error::private key material reached the suite's stdout"
            exit 1
          fi
          echo "shell suite: passes with GH_APP_* empty, no key in output"
          rm -f out.txt
