name: CI

# WHAT THIS RUNS, AND WHAT IT DOES NOT.
#
# CI runs some of this repo's suites and not others. Read this before adding a
# green badge anywhere: a CI that looks like it tests everything while testing
# part of it is worse than one that says which part.
#
#   RUNS HERE (offline, no credentials, no database):
#     test_gh_app_token.sh              the credential-minter regression suite
#     test_gh_token_argv.sh             gh_token.sh: no credential on argv
#     test_gh_token_dispatch.sh         gh_token.sh: refuses unknown subcommands
#     test_gh_token_api_body.sh         gh_token.sh: the request body reaches the
#                                       REQUEST rather than curl's argv, so a
#                                       `sha` head guard is actually sent and a
#                                       guarded write is guarded — TOG-305
#     test/external-disclosure.test.mjs immutable task/run/artifact/principal
#                                       grants, one-shot consumption and redacted
#                                       submission receipts — TOG-576
#     omniroute_combo_cli.sh selftest   containment logic, fixture catalogue
#     test_tog153_artifacts.sh          TOG-153 register/verify artifact contract:
#                                       fail-loud argv, dedicated catch-all,
#                                       .items envelope and verifier B4 — TOG-519
#     test_responsible_leader.sh        who may approve a provisioning request
#     test_provisioning_policy.sh       create-policy gates under widened ceilings
#     test_request_record_integrity.sh  whether the RECORD of a decision can
#                                       still say what was approved and why
#     test_decision_notify.sh           whether the REQUESTER ever learns a
#                                       request was decided, and that delivery
#                                       cannot influence a decision — TOG-254
#     test_leader_notify.sh             whether the derived LEADER is told, and
#                                       all transport invocations are contained
#                                       without disputing honest concurrent
#                                       reviews — TOG-317
#     test_queue_liveness.sh            whether a request is routed at an agent
#                                       that can actually receive it, and
#                                       whether a queue that has stopped
#                                       deciding says so — TOG-390
#     test_capability_gate.sh           who may decide a CAPABILITY request, and
#                                       which four asks stop for the owner
#                                       whatever any agent says — TOG-387
#     test_interaction_route.sh         where an ask belongs — the owner, an
#                                       agent, or an operator runbook; and
#                                       whether it could be answered at all
#                                       once created — TOG-389
#     test_operator_runbook.sh          whether a capability-bound ask was
#                                       filed as a decision, and whether the
#                                       runbook still matches the live owner
#                                       queue — TOG-434
#     test_interaction_envelope_lint.sh whether the envelope you are about to
#                                       POST says what you think it says: the
#                                       server strips unknown keys silently and
#                                       substitutes a default for the field they
#                                       were meant to set — TOG-396
#     test_sql_backend.sh               lib/pcsql.sh dispatch, against fake
#                                       podman/psql binaries — see TOG-202
#     test_suite_preconditions.sh       whether the two suites CI CANNOT run
#                                       refuse to score themselves when they
#                                       cannot reach a database, and whether
#                                       their refusal assertions name the gate
#                                       they claim to test — TOG-402
#     test_tool_drift.sh                tool_drift.sh: whether the copy that RUNS
#                                       is the copy that is REVIEWED — TOG-212
#     test_channel_drift.sh             channel_drift.sh: whether a runnable file
#                                       staged for the operator was ever
#                                       committed at all — TOG-356
#     test_agent_endpoint_preflight.sh  agent_endpoint_preflight.sh: whether the
#                                       model endpoint the agents are about to be
#                                       pointed at can serve them — TOG-358, and
#                                       whether it tells a dead endpoint apart
#                                       from a dead model lane — TOG-361
#     test_quota_rotation_watch.sh      quota_rotation_watch.py: whether teamclaude
#                                       stops sending traffic to a quota-spent
#                                       account, and whether a watcher that
#                                       measured nothing says so — TOG-425
#     test_approval_timeout_probe.sh    approval_timeout_probe.sh: whether the
#                                       deadline stamped on a tool-approval
#                                       request is enforced by anything, or is
#                                       only displayed to the approver — TOG-400
#     test_interaction_triage.sh        interaction_triage.sh: who can actually
#                                       resolve each pending interaction, and
#                                       which are dead on the board — TOG-423
#     test_quota_burn_derive.sh         quota_burn_derive.py: whether quota burn
#                                       is DERIVED from the weekly series rather
#                                       than read from a producer field that was
#                                       absent a third of the time, and whether
#                                       the jq copy of that formula inside
#                                       quota_brake.sh still agrees with it —
#                                       TOG-440
#     test_gh_scope_residue_monitor.sh gh_scope_residue_monitor.sh: whether a
#                                       scheduled text-only zero stays
#                                       inconclusive, and every outcome re-arms
#                                       the native Paperclip issue monitor —
#                                       TOG-398
#     test_gh_permission_pin_audit.sh   gh_permission_pin_audit.sh: whether a
#                                       change to DEFAULT_PERMISSION_PROFILE
#                                       that reaches none of the 7 pinned
#                                       projects can still pass silently — and
#                                       whether permission_pins.txt still
#                                       describes this checkout's default —
#                                       TOG-346
#     test_discord_job_health.sh        scripts/discord_job_health.js: whether a
#                                       time-gated Discord job that throws NO
#                                       error and still posts NOTHING can read
#                                       green — the state the forbidden
#                                       cross-company config workaround
#                                       produces — TOG-676
#     test_cold_start_detector.sh       cold_start_detector.sh: whether the company
#                                       is STOPPED while the quota it was waiting
#                                       for is already back — and whether a null
#                                       five-hour reading is ever scored as
#                                       headroom — TOG-487
#     test_model_lane_probe.sh          model_lane_probe.sh: whether the cheap/
#                                       small-fast lane is dead OR has come
#                                       UNPINNED. A bare model id answers 200 and
#                                       bills a PAYG leg, so status alone cannot
#                                       see it. Covers both drifting surfaces —
#                                       TOG-682
#     syntax + secret scan              see the steps below
#     plugins/gh-token-broker           see the `broker-suite` job below
#     plugins/omniroute-broker          see the `omniroute-broker-suite` job below
#     gh-event-capture                  see the `capture-suite` job below
#     mcp/                              see the `mcp-suite` job below
#
#   RUN IN THE `privilege-suites` JOB BELOW:
#     test_privilege_ceilings.sh
#     test_request_queue.sh
#   They create and delete agents in a throwaway Postgres service through the
#   dumb recording CLI under test/fixtures/orgdb. No production credential is
#   present. This proves the provisioner's POLICY; it does not prove the real
#   Paperclip API contract. The operator's VPS pre-release run therefore stays
#   mandatory, but is now specifically the create/update/terminate contract run.
#
#   AND, since TOG-402, test_suite_preconditions.sh proves rather more than
#   that: it drives both of them through a stub backend and checks they refuse
#   to run when the database is unreachable, and that their refusal assertions
#   fail when the refusal comes from the wrong gate. CI still cannot verify what
#   these two assert about the org; it can now verify that they do not lie when
#   they cannot reach it. That distinction was the whole finding — an operator's
#   pre-release run is the last gate before a provisioning change lands, and a
#   partially-green run is more dangerous than a red one.
#
#   WHAT IS STILL MISSING, precisely (TOG-202). The first blocker is gone: as of
#   lib/pcsql.sh the tools no longer hard-wire `podman exec paperclip-db`, so
#   they CAN be pointed at a throwaway database with PAPERCLIP_SQL_BACKEND=psql.
#   Three things still stand between that and a green run here, and the third
#   was not obvious until someone read the provisioner:
#     1. a schema dump, so a service container has tables to talk to;
#     2. an org fixture — the suites reference P0/P1/O*/T*/F* rows by
#        `metadata->>'orgRoleId'` and assume they already exist;
#     3. A LIVE PAPERCLIP API SERVER. The suites drive org_provisioner.sh, which
#        creates and terminates agents through `paperclipai agent create` /
#        `terminate` against PAPERCLIP_API_URL, not through SQL. A Postgres
#        service container alone does not make these suites run; it makes them
#        fail later, at the first `pc agent create`, which is a worse failure
#        mode than today's honest exclusion.
#
#   BLOCKER 3 IS ANSWERED (TOG-300). The call: a RECORDING STUB behind the
#   CLI seam, not a live server. Three reasons, in order of weight.
#
#   First, the seam is already there and this was not known when the question
#   was framed. org_provisioner.sh:91 honours PAPERCLIP_CLI and every API call
#   goes through pc() at :98, so this is not "a design change to a tool that
#   provisions real agents" — the change is confined to the test fixture. The
#   tool is untouched. test_suite_preconditions.sh:64 already drives it this way.
#
#   Second, the API surface is exactly three calls, all in org_provisioner.sh:
#   `agent create` (:389), `agent permissions:update` (:395), `agent terminate`
#   (:437). Nothing else in the provisioner reaches the API.
#
#   Third, a live server needs the Paperclip image and an ADMIN credential on a
#   GitHub runner. That is the same trade this file rejects eight lines above,
#   arrived at from the other direction, and the image is not ours to publish.
#
#   WHAT THE STUB MUST NOT BECOME, because this is the way it fails. The suites
#   would then assert on rows the stub itself wrote, so a stub that computes
#   anything makes the suite grade the stub instead of the provisioner — the
#   TOG-402 failure again, one level down. Two constraints follow, and they are
#   the whole reason this is safe:
#     * THE STUB IS DUMB. It stores the payload it was handed, verbatim, and
#       derives nothing. Then `dormant()` asserting heartbeat.enabled=false is
#       asserting that THE PROVISIONER SENT false, which is the policy coverage
#       actually wanted here.
#     * EVERY CEILING INVARIANT CARRIES A MUTATION GUARD, so a policy change in
#       the provisioner reddens a NAMED test. Same pattern as the mutation jobs
#       below. Without this, "make the stub agree" is the cheapest way to fix a
#       red build, and it silently deletes the coverage.
#
#   WHAT THIS BUYS AND WHAT IT DOES NOT. It buys the provisioner's POLICY: the
#   ceilings, the grant replacement, the refusals. It does NOT buy the API
#   contract — if the server changes what `agent create` does with reportsTo,
#   CI stays green and only the VPS run catches it. So the operator's
#   pre-release pass does not go away; it stops being the only coverage and
#   becomes specifically the API-contract coverage. Say so when it is wired in.
#
#   AND A FOURTH BLOCKER, found while answering the third: THE SCHEMA ROTS.
#   Blocker 1's dump is platform schema (agents, principal_permission_grants,
#   company_memberships, company_secret_bindings, budget_policies,
#   heartbeat_runs) vendored into this repo. It is a snapshot, and nothing here
#   moves when the platform migrates — so a fixture that has drifted goes green
#   against a schema production no longer has. That is a muted suite again,
#   one level further down. The dump therefore ships with a drift check, the
#   same shape as tool_drift.sh and channel_drift.sh: fingerprint on the VPS,
#   compare in a clone. Do not commit the dump without it.
#
#   The stub and fixture now exist. test_orgdb_fixture.sh tests their offline
#   contract, and `privilege-suites` runs both suites against Postgres. The
#   production comparison still cannot run here: schema_drift.sh fingerprints
#   the VPS database and compares that fingerprint against a clone loaded from
#   this fixture. Green CI proves the detector and fixture work, never that the
#   deployed schema has not drifted.
#
#   NOT YET RUN HERE: org_access_review.sh. It is read-only and the six required
#   tables are now present, but its wider report semantics are outside TOG-480.
#
#   READ THIS BEFORE TRUSTING THE DRIFT SUITE'S GREEN (TOG-212). CI runs
#   test_tool_drift.sh, which proves the DETECTOR works. It does NOT and cannot
#   run the actual comparison, because the thing to compare against is a
#   directory on the VPS that no runner can reach. A green badge here means
#   "tool_drift.sh would notice drift", never "there is no drift". The real
#   check is `tool_drift.sh fingerprint` on the VPS and `compare` in a clone,
#   and it stays operator-initiated for exactly the same reason the two suites
#   above do. Do not let this distinction quietly erode into a green badge that
#   is read as a clean bill of health.
#
# This list deliberately carries no test counts. CI asserts EXIT STATUS and
# never a count: counts drift as suites grow, and a gate that pins one turns
# ordinary growth into a red build. Do not add them back.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privilege-suites:
    name: Privilege ceiling suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: org_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d org_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: org_fixture
      PAPERCLIP_SQL_BACKEND: psql
      COMPANY_ID: 00000000-0000-4000-8000-000000000480
      PAPERCLIP_API_URL: http://recording-stub.invalid
      PAPERCLIP_CLI: ${{ github.workspace }}/test/fixtures/orgdb/paperclipai
      PAPERCLIP_STUB_LOG: ${{ github.workspace }}/paperclip-stub.jsonl
      GRANT_LOG: ${{ github.workspace }}/provisioner-grant-log.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres client and jq
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq
      - name: Arm the empty throwaway database
        run: ./test/fixtures/orgdb/reset.sh --init
      - name: Fixture and recording-stub contract
        run: ./test_orgdb_fixture.sh
      - name: Run privilege ceiling suite
        run: |
          set +e
          out="$({
            ./test/fixtures/orgdb/reset.sh &&
            rm -f "$GRANT_LOG" "$PAPERCLIP_STUB_LOG" &&
            ./test_privilege_ceilings.sh
          } 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [[ $rc -ne 0 ]]; then
            summary="$(printf '%s\n' "$out" | grep -F 'FAIL' | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            [[ -n "$summary" ]] || summary="$(printf '%s\n' "$out" | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            summary="${summary//'%'/'%25'}"; summary="${summary//$'\r'/'%0D'}"
            echo "::error title=Privilege ceiling suite failed::$summary"
            exit "$rc"
          fi
      - name: Run request queue suite
        run: |
          set +e
          out="$({
            ./test/fixtures/orgdb/reset.sh &&
            rm -f "$GRANT_LOG" "$PAPERCLIP_STUB_LOG" &&
            ./test_request_queue.sh
          } 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [[ $rc -ne 0 ]]; then
            summary="$(printf '%s\n' "$out" | grep -F 'FAIL' | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            [[ -n "$summary" ]] || summary="$(printf '%s\n' "$out" | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            summary="${summary//'%'/'%25'}"; summary="${summary//$'\r'/'%0D'}"
            echo "::error title=Request queue suite failed::$summary"
            exit "$rc"
          fi
      - name: Schema fixture fingerprint is stable
        run: |
          set +e
          out="$({
            ./schema_drift.sh fingerprint > expected.fp &&
            ./test/fixtures/orgdb/reset.sh &&
            ./schema_drift.sh compare expected.fp || exit $?

            cp expected.fp column-drift.fp
            column_before="$(sha256sum column-drift.fp)"
            node -e 'const fs=require("fs"),p=process.argv[1],s=fs.readFileSync(p,"utf8"),a=s.split("\n").find(l=>/^column\|agents\|[^|]+\|name\|/.test(l)); if(!a)throw Error("agents.name column fingerprint anchor missing"); fs.writeFileSync(p,s.replace(a,a.replace("|name|","|name_mutant|")))' column-drift.fp
            column_after="$(sha256sum column-drift.fp)"
            [[ "$column_before" != "$column_after" ]] || {
              echo "column drift mutation did not change the fingerprint" >&2
              exit 1
            }
            set +e
            column_out="$(./schema_drift.sh compare column-drift.fp 2>&1)"; column_rc=$?
            set -e
            printf '%s\n' "$column_out"
            [[ $column_rc -eq 3 && "$column_out" == *"name_mutant"* ]] || {
              echo "column drift mutant was not detected with exit 3 and the affected column" >&2
              exit 1
            }

            cp expected.fp type-drift.fp
            type_before="$(sha256sum type-drift.fp)"
            node -e 'const fs=require("fs"),p=process.argv[1],s=fs.readFileSync(p,"utf8"),a=s.split("\n").find(l=>/^column\|agents\|[^|]+\|created_at\|timestamp with time zone\|/.test(l)); if(!a)throw Error("agents.created_at type fingerprint anchor missing"); fs.writeFileSync(p,s.replace(a,a.replace("|timestamp with time zone|","|timestamp(3) with time zone|")))' type-drift.fp
            type_after="$(sha256sum type-drift.fp)"
            [[ "$type_before" != "$type_after" ]] || {
              echo "type drift mutation did not change the fingerprint" >&2
              exit 1
            }
            set +e
            type_out="$(./schema_drift.sh compare type-drift.fp 2>&1)"; type_rc=$?
            set -e
            printf '%s\n' "$type_out"
            [[ $type_rc -eq 3 && "$type_out" == *"timestamp(3) with time zone"* ]] || {
              echo "type drift mutant was not detected with exit 3 and the affected type" >&2
              exit 1
            }

            cp expected.fp index-drift.fp
            node -e 'const fs=require("fs"),p=process.argv[1],s=fs.readFileSync(p,"utf8"),a=s.split("\n").find(l=>l.startsWith("index|agents|")); if(!a)throw Error("index fingerprint anchor missing"); fs.writeFileSync(p,s.replace(a,a.replace("|agents_","|agents_mutant_")))' index-drift.fp
            set +e
            index_out="$(./schema_drift.sh compare index-drift.fp 2>&1)"; index_rc=$?
            set -e
            printf '%s\n' "$index_out"
            [[ $index_rc -eq 3 && "$index_out" == *"agents_mutant_"* ]] || {
              echo "index drift mutant was not detected with exit 3 and the affected index" >&2
              exit 1
            }
          } 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [[ $rc -ne 0 ]]; then
            summary="$(printf '%s\n' "$out" | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            summary="${summary//'%'/'%25'}"; summary="${summary//$'\r'/'%0D'}"
            echo "::error title=Schema fixture check failed::$summary"
            exit "$rc"
          fi
      - name: Privilege invariants are named and mutation-gated
        run: |
          set +e
          out="$(./verification/tog-480-mutation-gate.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [[ $rc -ne 0 ]]; then
            summary="$(printf '%s\n' "$out" | grep -E 'BASELINE FAILED|mutant left|red, but|mutation anchor|mutant does not parse' | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            [[ -n "$summary" ]] || summary="$(printf '%s\n' "$out" | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=Privilege mutation gate failed::$summary"
            exit "$rc"
          fi
      # CI verifies policy through the dumb stub. It deliberately cannot prove
      # what the real API now does with reportsTo, permissions, or termination;
      # the operator's VPS pre-release pass remains the API-contract coverage.

  offline-suites:
    name: Offline suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Every tool here is a script; there is no build. A parse error is the
      # most common regression and the cheapest to catch, so catch it first —
      # including in the two suites CI cannot execute.
      - name: Syntax check every script
        run: |
          set -euo pipefail
          rc=0
          # lib/*.sh is included explicitly. It is sourced by five tools, so a
          # parse error there breaks all of them, and a bare `*.sh` glob does
          # not descend into it.
          # mcp/deploy/*.sh is included for the same reason as lib/: a bare
          # `*.sh` glob does not descend, and acceptance_live.sh is a script the
          # OPERATOR runs on the VPS — a parse error there surfaces in front of
          # a human doing an install, which is the worst place to find one.
          # omniroute/*.sh and omniroute/rehearsal/*.sh are included because
          # every script there is operator-run against a management or host
          # surface no runner can reach (TOG-371/TOG-554). The rehearsal suite
          # below exercises its Podman paths with a fake runtime, but this parse
          # gate also covers the nested scripts directly.
          for f in *.sh lib/*.sh mcp/deploy/*.sh omniroute/*.sh omniroute/rehearsal/*.sh; do bash -n "$f" || { echo "::error file=$f::bash parse error"; rc=1; }; done
          for f in *.js; do node --check "$f" || { echo "::error file=$f::node parse error"; rc=1; }; done
          # The repo's first Python. Same argument as the shell gate above: these
          # are operator-run and have no suite, so a parse error would otherwise
          # be found by a human mid-install.
          # Root *.py is included too (TOG-425). quota_rotation_watch.py DOES
          # have a suite, but the glob must cover the directory rather than that
          # one file, or the next root-level Python lands here unparsed and
          # nobody notices until it is in front of an operator.
          for f in omniroute/*.py *.py; do python3 -m py_compile "$f" || { echo "::error file=$f::python parse error"; rc=1; }; done
          rm -rf omniroute/__pycache__ __pycache__
          # mcp/ is ES modules, so --check needs to be told; without the flag
          # node parses them as CommonJS and every `export` is a syntax error.
          for f in mcp/*.mjs mcp/test/*.mjs; do
            node --check --input-type=module < "$f" || { echo "::error file=$f::node parse error"; rc=1; }
          done
          exit $rc

      # The reason this repo exists. Offline: a stub API on 127.0.0.1, a
      # generated throwaway RSA key, and fabricated token-shaped canaries.
      - name: gh-app-token.js regression suite
        run: ./test_gh_app_token.sh

      # TOG-222: the credential-source half. test_gh_app_token.sh owns the leak
      # traps and the cache fixtures; this suite owns broker-vs-PEM selection,
      # which needs a stub broker on loopback and is far easier to express here.
      #
      # Pass the FILE, not the directory — same Node 24 gotcha the broker-suite
      # job documents. It bites on 20 too, so do not "fix" this to `test/`.
      #
      # Offline by construction: GH_API_URL and GH_APP_BROKER_URL both point at
      # stubs the suite starts itself, and the RSA key is generated per-run.
      - name: gh-app-token.js broker/credential-source suite
        run: node --test test/gh-app-token.test.mjs

      # TOG-576. Reproduces the TOG-574 authorization failure against loopback
      # GitHub stubs: a capable App token is not a human principal and a broad
      # channel approval is not an exact task/run/artifact grant. The passing
      # control also inspects the one-shot receipt for token/body absence.
      - name: task-specific external-disclosure grant suite
        env:
          EXTERNAL_DISCLOSURE_TOKEN: ''
          GH_TOKEN: ''
          GH_APP_PRIVATE_KEY: ''
          PAPERCLIP_API_KEY: ''
        run: node --test test/external-disclosure.test.mjs

      # Same reasoning as the broker suite's equivalent step: assert the
      # isolation rather than trust it. If this ever needs a real GH_APP_*, the
      # suite has started reaching for a live credential.
      - name: Prove the credential-source suite needs no credential
        env:
          GH_APP_ID: ''
          GH_APP_PRIVATE_KEY: ''
          PAPERCLIP_API_URL: ''
          PAPERCLIP_API_KEY: ''
          PAPERCLIP_TASK_ID: ''
        run: |
          set -uo pipefail
          node --test test/gh-app-token.test.mjs > out.txt 2>&1; rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::the credential-source suite requires a credential to pass; it must not"
            cat out.txt; exit 1
          fi
          if grep -qE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' out.txt; then
            echo "::error::private key material reached the suite's stdout"; exit 1
          fi
          echo "credential-source suite: passes with GH_APP_*/PAPERCLIP_* empty"
          rm -f out.txt

      # TOG-519. These operator scripts cannot reach their live management
      # surface in CI, but the catch-all contract is still testable with a stub:
      # unknown argv refuses, TC_CATCHALL creates its own observable combo, the
      # mappings reader accepts the live .items envelope, and verifier B4 rejects
      # the old claude-* -> claude-sonnet target. The suite never sends inference.
      - name: TOG-153 operator artifact suite
        run: ./test_tog153_artifacts.sh

      # TOG-554. No live Podman or inference traffic: the suite uses a fake
      # Podman state machine and a fixture artifact to exercise package hashes,
      # refusal gates, success/no-op/undo paths, replay protection and rollback.
      - name: OmniRoute rehearsal package suite
        run: ./test_omniroute_rehearsal.sh

      - name: Install pinned OmniRoute translator fixture compiler
        run: npm install --no-save --ignore-scripts typescript@5.9.3

      - name: OmniRoute rehearsal translator fixture
        run: node --test test_omniroute_rehearsal_translator.mjs

      - name: omniroute containment selftest
        run: ./omniroute_combo_cli.sh selftest

      # TOG-290. The selftest must prove the TOOL, not the config it happened to run
      # under. It used to report 181/0 with COMBO_OWNED_PREFIX unset and 178/3 with any
      # other value, because its fixtures hardcoded the default 'two/' namespace — so an
      # operator who followed the documented flow (export the prefix, run selftest first)
      # saw three red lines in a containment proof and no way to tell a fixture bug from
      # a real regression. Worse, the refuse-fixtures went green for the WRONG reason:
      # 'two/x' under prefix 'pc/' is refused by the namespace gate before the gate each
      # case actually names ever runs.
      #
      # This step is what stops that coming back. Identical pass/fail counts across a
      # spread of prefixes is the assertion — a count that MOVES is the bug, so the two
      # runs are compared to each other, not to a number pinned here that would need
      # updating every time an assertion is added.
      - name: omniroute selftest is hermetic w.r.t. COMBO_OWNED_PREFIX
        run: |
          set -uo pipefail
          # -e OFF deliberately: the selftest EXITS 1 when it fails, and under the
          # runner's default `bash -e` that would abort the assignment below before the
          # ::error:: line ever prints. The result is still red, but red with no reason.
          # Every outcome is checked explicitly instead.
          set +e
          # 2>&1 is LOAD-BEARING: the selftest writes its per-case lines and its
          # summary to STDERR. Without it $out is empty, the summary scrolls past on
          # the console, and the comparison below reads '' == '' and passes having
          # measured nothing.
          run_at() { # prefix('' = unset) -> full selftest output, colour stripped
            if [ -z "$1" ]; then env -u COMBO_OWNED_PREFIX ./omniroute_combo_cli.sh selftest 2>&1
            else COMBO_OWNED_PREFIX="$1" ./omniroute_combo_cli.sh selftest 2>&1; fi \
              | sed -e 's/\x1b\[[0-9;]*m//g'
          }
          base_out="$(run_at '')"; base="$(printf '%s\n' "$base_out" | tail -1)"
          echo "unset:  $base"
          case "$base" in
            *" passed, 0 failed") : ;;
            *) echo "::error::selftest is not green with COMBO_OWNED_PREFIX unset: '$base'"
               printf '%s\n' "$base_out" | grep -E 'FAIL|selftest:'; exit 1 ;;
          esac
          for p in pc/ two/ acme-team/ x.y_z/deep/; do
            out="$(run_at "$p")"; got="$(printf '%s\n' "$out" | tail -1)"
            echo "$p:  $got"
            if [ "$got" != "$base" ]; then
              echo "::error::selftest result depends on COMBO_OWNED_PREFIX. unset='$base' but '$p'='$got'. Fixtures that name a combo we own must build the name from \$COMBO_OWNED_PREFIX, not hardcode 'two/'. See TOG-290."
              printf '%s\n' "$out" | grep -E 'FAIL' ; exit 1
            fi
          done
          echo "selftest is prefix-independent: $base across 5 prefixes"

      # The TOG-226 standing gate. Offline: the board and GitHub reads are
      # redirected to fixtures, and the argv assertions use a stub curl that
      # never opens a socket. It covers the two ways this check can be wrong
      # in the direction that matters — reporting a clean board when residue
      # exists (which is what authorises a PEM unbind), including the ARG_MAX
      # failure-open that only appeared at production board size.
      - name: scope-residue gate regression suite
        run: ./test_gh_scope_residue.sh

      # TOG-398. The detector above existed and was still discovered only by
      # the agent whose project-less checkout had already failed. This suite
      # pins the actual recurring mechanism: a native Paperclip issue monitor
      # wakes the assignee, this wrapper records the board-only floor, and it
      # re-arms the issue for the next cycle. Offline: detector, Paperclip API
      # and clock are fixtures; the credential assertion reads curl's real argv.
      - name: scope-residue scheduled monitor suite
        run: ./test_gh_scope_residue_monitor.sh

      # TOG-346. The broker takes a project's profile as
      # `projectPermissions ?? defaultPermissions` — `??`, so a project's
      # GH_APP_PERMISSIONS REPLACES DEFAULT_PERMISSION_PROFILE. TOG-296 pinned
      # the last five unpinned projects, so it is 7 of 7 and the default is now
      # reached by nothing: editing it is a no-op everywhere, silently. The
      # direction that matters is removal, where a narrowed default would look
      # shipped and change no grant at all.
      #
      # This suite proves the detector, offline: every case builds its own
      # registry, its own scope module and its own project list, so no board is
      # read and no credential is needed. Its last section then points the real
      # gh_permission_pin_audit.sh at the real permission_pins.txt and this
      # checkout's real scope.js, which is the assertion that keeps the registry
      # honest — a PR that edits DEFAULT_PERMISSION_PROFILE without re-auditing
      # the pins goes red here as well as in `broker-suite`. Two readers, two
      # jobs, two runtimes: satisfying one by accident does not satisfy both.
      - name: permission-pin drift suite
        run: ./test_gh_permission_pin_audit.sh

      # TOG-310. Audits every link in git's credential-helper chain for
      # substitutability by the shared agent uid — the helper program, its
      # directory, and every config file that can name a helper, including ones
      # that do not exist yet but can be created.
      #
      # Portable by construction: the analysis is pure permission arithmetic, so
      # the suite builds its fixtures from real root-owned paths (/usr/bin/git,
      # /etc) that exist on a runner too, and skips only the handful of
      # assertions about /paperclip itself. It pins both bugs found by checking
      # the audit's output against live write probes rather than by reading it:
      # symlinked /bin reported as a world-writable hole, and an absent config
      # under a creatable parent reported clean.
      - name: credential-chain audit regression suite
        run: ./test_credential_chain_audit.sh

      # TOG-392. secret_exposure_audit.sh enumerates the platform credentials a
      # run holds (master key, full-DB DATABASE_URL, the two signing secrets).
      # Offline by construction: every case fabricates its own environment with
      # `env -i` plus fakes and a throwaway key file, so no real secret is read;
      # one case feeds sentinels and asserts they never reach stdout, which is
      # the property that keeps an exposure audit from becoming a disclosure.
      - name: secret-exposure audit regression suite
        run: ./test_secret_exposure_audit.sh

      # The pin half of that audit is a DETECTOR, not a boundary: the pin file
      # sits next to the helper, in reach of the same uid, so anyone who can
      # swap the helper can rewrite the pin. All it buys is that a swap has to
      # be loud — which makes "can this still go loud" the only property worth
      # asserting, and not one that reading the code establishes.
      #
      # This step also carries the assertion that keeps the pin file honest:
      # the sha256 of gh-app-token.js in the checkout must be the `expected`
      # line. TOG-238 changed the helper and merged without repinning, so once
      # that build was deployed the audit reported DRIFT against the reviewed
      # tip of main — a red verdict on the correct state, which is how a
      # detector gets muted instead of fixed. Now that goes red in the PR that
      # changed the helper.
      - name: credential-chain pin gates (mutation-gated)
        run: ./test_credential_chain_pin_gate.sh

      # TOG-439. The production ceiling makes two independent defence-in-depth
      # gates unreachable: a non-P1 chief cannot seat a chief, and nobody may
      # provision P0/P1. This suite passes widened ceiling VALUES to the same pure
      # function the mutating CLI calls. The CLI has no environment override, so
      # CI can reach those gates without widening the provisioner's trust boundary
      # or touching a database, API, credential or agent.
      - name: provisioner create-policy suite
        run: ./test_provisioning_policy.sh

      # The widened-catalog cases above are absence assertions: they also pass if
      # their setup never reaches the named gate. Delete each independent guard
      # from a staging copy, after a green baseline, and require its owning case
      # to go red. Parse + cmp checks prevent a missed mutation from reading as a
      # successful test.
      - name: provisioner defence gates are load-bearing (mutation-gated)
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp org_provisioner.sh test_provisioning_policy.sh "$mut/"
          mkdir -p "$mut/lib" && cp lib/*.sh "$mut/lib/"

          if ! (cd "$mut" && ./test_provisioning_policy.sh > base.out 2>&1); then
            echo "::error::the UNMUTATED staging copy is red; mutations prove nothing"
            cat "$mut/base.out"; exit 2
          fi
          cp "$mut/lib/provisioning_policy.sh" "$mut/lib/.orig"

          mutate() {
            local label="$1" start="$2" finish="$3"
            cp "$mut/lib/.orig" "$mut/lib/provisioning_policy.sh"
            START="$start" FINISH="$finish" python3 -c '
          import os, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          source = path.read_text()
          start = source.find(os.environ["START"])
          if start < 0:
              raise SystemExit("mutation start anchor missing")
          finish = source.find(os.environ["FINISH"], start)
          if finish < 0:
              raise SystemExit("mutation finish anchor missing")
          finish += len(os.environ["FINISH"])
          path.write_text(source[:start] + source[finish:])
          ' "$mut/lib/provisioning_policy.sh"
            bash -n "$mut/lib/provisioning_policy.sh" || {
              echo "::error::$label mutant does not parse"; return 1; }
            cmp -s "$mut/lib/.orig" "$mut/lib/provisioning_policy.sh" && {
              echo "::error::$label mutation changed nothing"; return 1; }
            if (cd "$mut" && ./test_provisioning_policy.sh > out.txt 2>&1); then
              echo "::error::$label deletion left the suite green"
              cat "$mut/out.txt"; return 1
            fi
            echo "  ok: $label deletion goes red"
          }

          mutate "chief-seating guard" \
            '  if [[ "$template" == B[1-5]_*' \
            '  fi'
          mutate "enterprise-role guard" \
            '  if [[ "$template" == P0_*' \
            '  fi'

      # The authorization change from TOG-194: who may approve a provisioning
      # request. Runs here because it fabricates its whole world — a TSV org
      # fixture through ORG_SNAPSHOT, a stub provisioner through PROV — so it
      # needs neither the database nor a company. It is the ONLY automated
      # coverage of that logic that CI can execute; test_request_queue.sh is
      # better evidence and stays operator-run for the reasons above.
      - name: responsible-leader authorization suite
        run: ./test_responsible_leader.sh

      # TOG-253. The sibling suite asks "who may decide?"; this one asks the
      # question an audit actually asks — can the RECORD still say what was
      # approved and why, six months later. Different question, different
      # failure modes, so it is a separate suite rather than more sections
      # bolted onto the one above. Same two offline seams (ORG_SNAPSHOT and a
      # stub PROV), so it needs no database and no credential either.
      - name: request-record integrity suite
        run: ./test_request_record_integrity.sh

      # TOG-254. A third question again: the first two ask who may decide and
      # whether the record survives, this one asks whether the REQUESTER ever
      # finds out. It also carries the containment half — that a failed or
      # hostile notifier cannot block, alter or re-target a decision — which is
      # the part that turns a convenience feature into an authorization
      # concern. Third offline seam: REQUEST_NOTIFY_CMD, a stub transport, so
      # "delivery failed" is a case the suite CAUSES rather than waits for.
      - name: decision-notification suite
        run: ./test_decision_notify.sh

      # TOG-317. The mirror question: whether the DERIVED LEADER is told there
      # is something to decide. It also exercises containment at both transport
      # call sites — submit and `notify --drain` — plus the legitimate race where
      # a review overlaps an honest slow delivery and must not be disputed.
      - name: leader-notification suite
        run: ./test_leader_notify.sh

      # TOG-390. A fourth question in the same series, and the one that makes
      # the other three conditional: the record can be perfect and the notifier
      # flawless, and the request still never gets decided because the agent it
      # was routed at cannot be woken. On this company that is the common case
      # rather than the edge — 138 of 144 agents carry wakeOnDemand=false.
      #
      # Fourth offline seam: LIVENESS_SOURCE_CMD, so reachability is something
      # the suite DICTATES rather than reads from a database. That is what lets
      # it run here, and it is also what lets it test the states a real
      # database will not produce on demand — an unset flag, an unparseable
      # one, a liveness source that is simply down.
      #
      # Two of its sections pin known-wrong READINGS rather than ordinary
      # behaviour: that an unset wakeOnDemand never reads as reachable (the
      # top-level path reads unset for EVERY agent, so a regression there would
      # silently pass the whole roster), and that an unavailable
      # throttled-vs-disabled discriminator reports 'undetermined' instead of
      # guessing 'disabled'. Both were confirmed red under mutation, against a
      # green unmutated baseline.
      - name: routing-liveness and stall-alarm suite
        run: ./test_queue_liveness.sh

      # TOG-198 review. The suite above proves the QUEUE treats the notifier as
      # untrusted, and proves it well. This one asks the mirror-image question
      # nobody had asked — whether the NOTIFIER treats its PAYLOAD as untrusted
      # — because every transport in that suite is a stub, so the reference
      # transport that actually ships bytes had no coverage at all and carried
      # three defects: the API key on curl's argv, a requester-chosen URL path,
      # and a fixed ``` fence a request body could close. Fourth offline seam:
      # a `curl` stub on PATH, so what would have gone over the wire is an
      # assertable artifact. No network, no credential.
      - name: notification-transport suite
        run: ./test_notify_transport.sh

      # TOG-387. The capability gate — the sibling of the provisioning queue,
      # for asks whose object is a CAPABILITY rather than an org seat. It runs
      # here for the same reason the three above do: it fabricates its whole
      # world through ORG_SNAPSHOT and touches no database, no credential and
      # no network. The part of it worth reading is how it asserts: every
      # refusal is pinned to the REASON that identifies which gate fired, never
      # to exit status alone, because a fail-closed neighbour catching the same
      # input is how assertions on this repo have gone green for the wrong
      # reason. Its section 10 then deletes each gate in a staging copy — after
      # a baseline on the UNMUTATED copy in the same directory — and requires
      # the test that names that gate to go red.
      - name: capability gate suite
        run: ./test_capability_gate.sh

      # TOG-389. Where an ask belongs: the owner, an agent, or an operator
      # runbook. Two thirds of every question this company has raised died
      # unanswered (73 cancelled + 47 expired of 187), and 42 of 49 pending
      # ones are blocked by a gate that has nothing to do with the question's
      # content — the author was the issue's own assignee. The suite is pure
      # fixtures and flag combinations: no API key, no VPS, no database.
      #
      # §9 is the load-bearing one. Review-verdict eligibility must fail
      # CLOSED: the first draft defaulted it to true, and against live data
      # that reported a $1.40/mo spend approval, a credential placement and a
      # brand decision as agent-resolvable. The mutation check restores that
      # default and asserts the suite goes red, with a baseline assertion
      # first so "the mutant failed" is attributable to the mutation and not
      # to a broken staging copy.
      - name: interaction routing suite
        run: ./test_interaction_route.sh

      # TOG-676. The Discord daily digest has never posted — not once, in any
      # channel, on any day. It read as healthy for two consecutive write-ups
      # because 37 of its 38 hourly rows are `succeeded` after returning at the
      # vendor's hour gate without doing any work.
      #
      # The detector that was supposed to catch that had the same hole in a
      # smaller form: it inferred the digest's health from its FAILURE count,
      # so it could only ever see a digest that died loudly. §2 of this suite
      # feeds the state the cheapest "remedy" produces — plugin_config rows
      # added for the other three companies, every denial gone, still nothing
      # posted — and pins NOT_DELIVERED and exit 1. The old logic exited 0
      # there. That matters beyond tidiness: that workaround routes other
      # companies' issue and agent counts into OUR private #control-room via
      # resolveChannel's defaultChannelId fallback, so a green detector would
      # have certified a cross-company data leak as the fix.
      #
      # §3 is the guard against the opposite error. It is byte-identical to §2
      # except one delivery metric exists, and must exit 0 — without it, a
      # script hardcoded to always say NOT_DELIVERED would satisfy §2 and this
      # suite would measure nothing.
      #
      # Offline by construction: DISCORD_JOB_HEALTH_SOURCE_CMD replaces the
      # database read with `cat` over a fixture, so CI needs no DATABASE_URL.
      - name: Discord scheduled-job delivery suite
        run: ./test_discord_job_health.sh

      # TOG-676. The detector above is only ever run here, against a fixture --
      # this workflow has no database, so CI never measures the installation.
      # Until the monitor wrapper existed, nothing ran the detector against
      # production on any clock, and the defect it watches is silent: the
      # digest is time-gated, so 23 of every 24 runs record `succeeded` having
      # posted nothing. This suite pins the wrapper's refusals -- an
      # unmeasurable detector must never re-arm as healthy, and a failing
      # measurement must retry on the SHORT interval rather than sleeping six
      # hours on a known-broken feature.
      - name: Discord delivery monitor suite
        run: ./test_discord_job_health_monitor.sh

      # TOG-419. The quota brake, after it took the company off the air: a
      # sweep set heartbeat.wakeOnDemand=false on 44 of 47 agents nine seconds
      # after the owner created a task, and the owner's own Chief of Staff was
      # then refused 68 times in 17 minutes while every wake returned HTTP 202.
      #
      # The owner's requirement — "the brake must never disable an agent" — is
      # one edit away from being untrue at any time, and the edit that breaks
      # it looks reasonable, because setting a boolean is the shortest path to
      # a hard stop. §1 of this suite tests the guard DIRECTLY with hand-built
      # bodies rather than only through the planner, since a guard exercised
      # solely via its caller is only ever fed inputs the caller already gets
      # right.
      #
      # §6 is the one to read if this ever goes red confusingly. Its four
      # "could not measure" gates all exit 5, so an exit-code-only assertion is
      # satisfied by whichever gate fires first — measured: neutering the
      # unreadable-roster gate left the whole section GREEN because the
      # empty-roster gate downstream caught the same input. Each assertion
      # therefore pins its own cause by message. Do not "simplify" those back
      # to a bare exit-code check.
      #
      # Offline: pace signal, roster, refusal counts and the write path all
      # arrive through *_CMD seams, so there is no database and no credential.
      #
      # §9 is TOG-440's half. The brake used to key on the producer's
      # `burn_per_day` field; measured over a 219-sample snapshot of the real
      # pacing file that field was null on 46% of account-samples — and on 75 of
      # the 219 rows NO account had a value, so the brake exited 5 and did
      # nothing a third of the time. Where it WAS present it picked a different
      # ladder level from the measured burn on 69% of comparable samples. The
      # worst shape is an idle account: 11:59Z-14:30Z `weekly` was flat (zero
      # consumption) while the field decayed 0.9568 -> 0.1595 and reported 34.1x
      # down to 5.5x — LEVEL3/LEVEL2 on an account burning nothing. Underrunning
      # the weekly quota is the expensive failure mode here, so that is not a
      # fail-safe error, it is the error. §9c pins it.
      - name: quota brake suite
        run: ./test_quota_brake.sh

      # TOG-440. The offline derivation tool, and — §5 — the cross-check that
      # keeps it in step with the jq copy inside quota_brake.sh. Two
      # implementations of one formula is the price of the production path
      # needing only bash+jq+awk while the analysis path has to replay history
      # and sweep windows; what makes it survivable is that they are diffed on
      # every build rather than during the next incident.
      - name: quota burn derivation suite
        run: ./test_quota_burn_derive.sh

      # TOG-454. blocked_audit.sh reassigns and re-statuses real issues from an
      # explicitly supplied audit table in bounded batches. Three properties
      # are load-bearing and not visible by reading successful output: there is
      # no default snapshot to go stale, a board already matching the supplied
      # table is a no-op, and an ambiguous agent-id prefix must REFUSE rather
      # than bind whichever agent sorted first — two companies share one
      # database here, so a wrong bind assigns a real issue to a stranger. Each
      # property is asserted; the latter two were also mutation-checked.
      - name: blocked-issue audit applier suite
        run: ./test_blocked_audit.sh

      # TOG-434. The rule: an action only a human can perform is a RUNBOOK
      # LINE; a judgement only the owner may make is a DECISION. Filed the
      # wrong way round, "please run these three root commands" renders as a
      # decision awaiting judgement, nobody triages it as work, and it expires
      # — 47 of 189 interactions have died that way. Of the 35 pending
      # owner-only asks swept for TOG-434, 21 were requests for hands.
      #
      # The load-bearing half is `check`, not the rendering: it is what stops a
      # new capability-bound ask joining the owner's queue unclassified. It
      # fails silently if it is wrong, so §4 pins the fail-open case (empty or
      # malformed input must NEVER read as a clean board — that bug was real
      # and is fixed) and §6 deletes each branch of `check` from a staging copy
      # to prove the test naming it goes red, baseline asserted first.
      #
      # This gate does NOT reach the board. `render` is a pure function of the
      # checked-in classification file; `check` needs a live snapshot and is
      # run by hand.
      - name: operator runbook suite
        run: ./test_operator_runbook.sh

      # The committed runbook must be the one the generator produces. A
      # hand-edit to docs/OPERATOR-RUNBOOK.md would otherwise drift away from
      # the classification file that CI actually validates.
      - name: operator runbook is regenerated, not hand-edited
        run: |
          ./operator_runbook.sh render > /tmp/runbook.regenerated.md
          diff -u docs/OPERATOR-RUNBOOK.md /tmp/runbook.regenerated.md
      # TOG-396. The sibling problem to the one above: routing decides WHERE an
      # ask goes, this decides whether the JSON you are about to POST says what
      # you think it says. `POST /issues/{id}/interactions` validates against a
      # NON-strict zod object, so a misspelled envelope key is not an error, it
      # is a deletion — and `resolverPolicy`, the field deciding who may answer
      # you, falls back to a per-kind default. Measured live: the same create
      # sent as `requestedResolverPolicy` (the name the API returns) rather than
      # `resolverPolicy` returns 201 and stores the OPPOSITE policy.
      #
      # The pinned key set is the load-bearing part. It is pinned, not read from
      # the platform, because the platform source exists in an agent container
      # and not on a CI runner — `--verify-keyset` re-derives and diffs it where
      # it IS available. An unreadable platform exits 8 (UNVERIFIED), never 0:
      # a check that measured nothing must not read green. §8 asserts exactly
      # that, and the mutation check below asserts §8 is doing real work.
      - name: interaction envelope lint suite
        run: ./test_interaction_envelope_lint.sh

      # TOG-396 mutation check. Three ways to gut the lint, each asserted red,
      # with the unmutated copy asserted GREEN in the same staging directory
      # first — otherwise "the mutant failed" is unattributable.
      - name: interaction envelope lint — mutation check
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp interaction_envelope_lint.sh test_interaction_envelope_lint.sh "$mut/"
          chmod +x "$mut"/*.sh
          if ! (cd "$mut" && ./test_interaction_envelope_lint.sh > base.txt 2>&1); then
            echo "::error::the UNMUTATED staging copy is already red; every result below is meaningless"
            cat "$mut/base.txt"; exit 2
          fi
          cp "$mut/interaction_envelope_lint.sh" "$mut/.orig"

          # 1. remove the unknown-key check — the core TOG-396 guard
          # 2. accept a missing resolverPolicy — the silent-default guard
          # 3. let an unreadable platform exit 0 — the fail-open we most fear
          run_mutant() {
            local label="$1" expr="$2"
            cp "$mut/.orig" "$mut/interaction_envelope_lint.sh"
            perl -0pi -e "$expr" "$mut/interaction_envelope_lint.sh"
            if cmp -s "$mut/.orig" "$mut/interaction_envelope_lint.sh"; then
              echo "::error::mutation '$label' did not apply — the source moved, so this gate is asserting nothing"
              exit 2
            fi
            if ! bash -n "$mut/interaction_envelope_lint.sh"; then
              echo "::error::mutant '$label' does not parse; a syntax error is not a real red"
              exit 2
            fi
            if (cd "$mut" && ./test_interaction_envelope_lint.sh > out.txt 2>&1); then
              echo "::error::mutant '$label' left the suite GREEN — that check is not being tested"
              cat "$mut/out.txt"; exit 1
            fi
            echo "  ok: mutant '$label' goes red"
          }

          run_mutant "unknown-key check deleted" \
            's/if \[\[ " \$ACCEPTED_ENVELOPE_KEYS " == \*" \$key "\* \]\]; then\n      continue\n    fi/continue/s'
          run_mutant "missing resolverPolicy accepted" \
            's/elif \(\( ! allow_default \)\); then/elif false; then/'
          run_mutant "unverifiable keyset reads green" \
            's/exit "\$EX_UNVERIFIED"/exit "\$EX_OK"/g'

          cp "$mut/.orig" "$mut/interaction_envelope_lint.sh"
          (cd "$mut" && ./test_interaction_envelope_lint.sh > restored.txt 2>&1) \
            || { echo "::error::the restored copy is red; the staging dir was corrupted"; cat "$mut/restored.txt"; exit 2; }
          echo "restored copy is green again"

      # TOG-487. The companion question to the brake above: the brake decides
      # when to SLOW DOWN, this decides when the company has failed to START
      # again. On 2026-08-25 an 89-minute quota drain became a 5.5-hour outage
      # because 202 runs died `429 All 2 accounts exhausted`, ZERO scheduled a
      # retry, and nothing noticed that the quota had been back since 15:15Z.
      #
      # The platform has both the retry path and a classifier for that exact
      # failure body, and neither fired: `readHeartbeatRunErrorFamily` at
      # services/heartbeat.ts:548-566 recognises only `errorCode` values the ACP
      # lane never emits, so the family stayed null and the retry never armed.
      # That is `/app/server/src`, not this repo — hence a detector here rather
      # than a fix there.
      #
      # THE CASE TO READ IF THIS GOES RED is §2. The real pacer feed carries
      # `five_hour: null` twice inside the recovery window, and `[[ "" -eq 0 ]]`
      # is TRUE in bash, so the shortest possible headroom test fires 45 minutes
      # early on missing data. §2 pins that a null is not a zero in BOTH
      # directions — the all-null sample must not read as headroom, and a
      # sample with one null and one genuine zero must still fire. Rejecting
      # every record containing any null would pass the first and fail the
      # second, and would have delayed the real alarm by 15 minutes.
      #
      # Offline: the pace window and the recovery actions both arrive through
      # *_CMD seams, so there is no database and no host file.
      - name: cold-start detector suite
        run: ./test_cold_start_detector.sh

      # TOG-682. model_lane_probe.sh watches the cheap/small-fast lane — the
      # profile status-recovery itself runs on, so a dead value blocks the
      # mechanism that would otherwise notice.
      #
      # THE ASSERTION THAT MATTERS MOST IS §2, AND IT IS NOT AN UPTIME CHECK.
      # Measured against the live gateway 2026-08-30: the pinned id
      # `cliproxy/claude-haiku-4-5-20251001` returns 200 — and so does the BARE
      # `claude-haiku-4-5-20251001`. A bare id is a fully working lane billed to
      # a pay-as-you-go leg instead of the owner's subscription; the prefix is
      # what makes it fail CLOSED. So an unpinned lane is green by every HTTP
      # measure and is HARDER to see than a dead one. §2 pins that a bare id at
      # 200 is an ALARM. If that ever "simplifies" to "200 is fine", the tool
      # stops detecting the failure it was built for.
      #
      # §3 replays the TOG-679/TOG-680 disagreement: adapterConfig pinned and
      # healthy while runtimeConfig.modelProfiles.cheap is undated and 400. The
      # two surfaces drift independently and a tool that coalesced them would
      # report the healthy one and exit 0.
      #
      # §4 is the blind-monitor half: an unreadable source, zero surface rows, a
      # short read, and HTTP 000 all exit 5 and never 0. 000 is curl's "no
      # response completed" and it parses as an integer that is not 200, so the
      # naive ordering reports an unreachable gateway as a dead lane.
      #
      # Offline: the surface rows and the HTTP result both arrive through *_CMD
      # seams, so there is no database and no gateway.
      - name: model lane probe suite
        run: ./test_model_lane_probe.sh

      # lib/pcsql.sh decides how every DB-touching tool reaches PostgreSQL. It
      # is a dispatcher, so it is testable without a database: the suite puts
      # recording fakes for `podman` and `psql` on PATH and asserts the exact
      # argv, stdin and environment each backend produces. No database, no
      # credential, no network.
      - name: SQL backend seam suite
        run: ./test_sql_backend.sh

      # TOG-402. The two suites CI cannot run are the two whose green ticks
      # nobody here can check, and they were scoring themselves against nothing:
      # with COMPANY_ID set and no podman, test_request_queue.sh reported
      # 15 passed / 16 failed, because a `grep -q REFUSED` assertion is
      # satisfied by "requester not found" from an absent database just as well
      # as by the ceiling check it names.
      #
      # This suite is the part of that CI CAN run. It stubs a psql on PATH in
      # three modes and drives the real suites through it, so it proves both
      # guards: that they refuse to run at all when the backend is unreachable,
      # and — with a backend that answers the preflight but returns no rows —
      # that their reason-pinned assertions FAIL a refusal from the wrong gate.
      # The second is the one that needs a seam: once the preflight works, the
      # reason-pinning never executes anywhere else CI can see it.
      - name: suite-precondition and wrong-gate refusal suite
        run: ./test_suite_preconditions.sh
      # TOG-247: the CI status reader that must never report a denial or an
      # empty result set as green. TOG-381: nor a job GitHub never ran as a red
      # build. Offline — a stub GitHub API on 127.0.0.1 serves a different
      # permission/result case off each ref, so this needs no credential and no
      # network. The TOG-381 cases are RECORDED responses replayed through that
      # stub (test/fixtures/gh_ci_status/), because a non-start is identical to
      # a real failure in every field and a hand-written fixture would only
      # prove the reader agrees with whoever typed it.
      - name: fail-closed CI status suite
        run: ./test_gh_ci_status.sh

      # TOG-345. Whether two runs of one agent can implement one issue twice.
      # They can, and did — TOG-253 (#15/#16) and TOG-258 (#27/#28), each a full
      # wasted implementation plus a full CI cycle. The losing run on TOG-258
      # had checked: `ps` is silently empty in the agent container for every
      # process including the caller's own, and worktree mtimes lag a live run
      # parked on a CI poll. Both said "nothing", and "nothing" was read as
      # "nothing found". So most of this suite is about the guard refusing to
      # report CLEAR while any detector could not run. Offline: real git against
      # a local bare origin, plus one stub on 127.0.0.1 serving both the
      # Paperclip and the GitHub API. No credential, nothing leaves loopback.
      - name: sibling-run guard suite
        run: ./test_sibling_guard.sh

      # TOG-212. Whether the copy of a tool that RUNS is the copy that is
      # REVIEWED. The suite fabricates a throwaway git repo and a "deployed"
      # directory in mktemp, so it needs no VPS, no network and no credential.
      # See the header for what this suite's green does NOT mean.
      - name: running-vs-reviewed drift suite
        run: ./test_tool_drift.sh

      # TOG-356. The OTHER direction. tool_drift.sh asks whether the operator's
      # copy drifted ahead of the repo; measured 2026-08-24 it had not. This
      # asks whether an agent staged a RUNNABLE file for the operator that
      # exists in no commit — measured 2026-08-25, 11 of the 14 runnable
      # artifacts in /paperclip/operator-handoff/ did not. Same fabricated-world
      # trick: a throwaway git repo and a fake channel in mktemp, so no
      # /paperclip mount, no VPS, no network, no credential.
      #
      # Read the header of channel_drift.sh for what this green does NOT mean.
      # CI cannot run `channel_drift.sh check` — GitHub Actions has no view of
      # /paperclip. Green here means the DETECTOR works, never that the channel
      # is clean. The real check runs where the channel is mounted.
      - name: handoff-channel unversioned-drop suite
        run: ./test_channel_drift.sh

      # TOG-151/TOG-372. The channel's OTHER question. channel_drift.sh asks
      # whether a staged file was ever reviewed; this asks whether anything
      # staged there is a credential. The channel is the one path agents write
      # and the operator reads, and every agent on the box shares uid 1000, so
      # a secret landing there is disclosed instance-wide the moment it lands.
      #
      # The suite is the scanner's own `selftest`, which is why there is no
      # separate test_*.sh: every rule gets a positive case, the false-positive
      # corpus is the repo's own text, and two of the checks scan THIS FILE —
      # once asserting it comes back clean, once with a planted secret asserting
      # it comes back red. Offline: fixtures are mktemp, and DROPSCAN_PASSWD_FILE
      # feeds the shared-uid detector a fixture instead of the runner's own
      # /etc/passwd, so the verdict does not depend on where it runs.
      #
      # Same caveat as its sibling above, and it is the important one: green
      # here means the DETECTOR works. It is NOT a scan of the channel — GitHub
      # Actions has no view of /paperclip. Run `dropchannel_scan.sh scan` where
      # the channel is mounted; on 2026-08-25 that run was not clean.
      - name: handoff-channel credential-scanner selftest
        run: ./dropchannel_scan.sh selftest

      # TOG-385. The selftest above gained a block of cases that assert a
      # credential rule DOES NOT fire. Those are the dangerous kind: a negative
      # case is green both when the narrowing works and when the narrowing was
      # never applied, so on its own it measures nothing. This step removes each
      # limb of that narrowing from a throwaway copy and requires the NAMED case
      # to go red — after asserting the unmutated copy is green in the same
      # staging directory, without which the reds are unattributable.
      #
      # It earned its place while being written: two of the new positive cases
      # were being satisfied by the guard NEXT DOOR rather than the one they
      # were named for, and passed until this gate said which limb they covered.
      - name: dropchannel_scan narrowing is not vacuous (mutation-gated)
        run: ./verification/tog-385-mutation-gate.sh

      # TOG-487. Same shape, same reason. Every refusal in the cold-start
      # detector is a limb a reasonable person would simplify away — coalescing
      # a null five_hour to zero, defaulting a missing runs_in_flight to zero,
      # letting an unreadable source fall through to "nothing stranded". Each
      # is removed here one at a time from a staged copy, and the suite must go
      # red ON THE CASE THAT NAMES IT, not merely somewhere.
      #
      # It earned its place while being written, twice. It first reported five
      # cases whose failure label differed from their success label, so a red
      # could not be attributed at all; and then it found that the
      # empty-leading-TSV-field case was asserting on the verdict, which
      # survives the corruption — `date -u -d 1` parses, so a column-shifted row
      # still ages as stale and still fires. The assertion now pins the OWNER
      # the plan names, which is what the shift actually breaks.
      - name: cold-start detector refusals are not vacuous (mutation-gated)
        run: ./verification/tog-487-mutation-gate.sh

      # TOG-676. Same shape, and the limb at risk is the delivery check itself.
      # It reads as redundant with the failure count — every digest that has
      # ever broken here broke loudly — so "simplify it away" is the obvious
      # edit, and it is the edit that makes this detector go green on the one
      # remedy that leaks other companies' data into our private #control-room.
      # Mutation 2 exists for the opposite error: a detector that never
      # believes a delivery satisfies the NOT_DELIVERED case while measuring
      # nothing, so a real send is pinned green too.
      - name: Discord delivery proof is not vacuous (mutation-gated)
        run: ./verification/tog-676-mutation-gate.sh

      # TOG-676, the wrapper half. The limb at risk here is the UNKNOWN branch:
      # a wrapper that reports an unmeasurable detector as healthy looks like a
      # tidier comment and silently converts the whole monitor into a false
      # green. This gate also refuses to score a mutant that only ever landed
      # in a comment -- the first draft "killed" a mutation that had edited
      # header prose and changed no behaviour at all.
      - name: Discord delivery monitor is not vacuous (mutation-gated)
        run: ./verification/tog-676-monitor-mutation-gate.sh

      # TOG-349. A THIRD drift question, and the one a hash cannot answer.
      # tool_drift.sh asks whether two copies differ; this asks whether the
      # difference changes what the plugin is ALLOWED TO DO. The host adopts a
      # plugin's manifest from its package directory at activation with no
      # capability-escalation check (refreshPluginManifestFromPackage does what
      # upgradePlugin refuses to), and the broker's package directory is
      # agent-writable — so "deploy new worker code" and "re-declare the
      # plugin's authority" are currently the same write.
      #
      # Measured 2026-08-25: the deployed broker differed from origin/main in
      # three files by content hash and in ZERO authority-bearing fields. Every
      # one of those differences was a comment. That is the distinction this
      # gate draws and a hash cannot, in both directions — it must not shout at
      # a docstring, and it must not stay quiet about a changed `auth`.
      #
      # Offline: the suite fabricates a git repo and a package directory in
      # mktemp. No plugin host, no network, no credential.
      - name: plugin manifest authority-surface suite
        run: ./test_plugin_manifest_gate.sh

      # TOG-400. A FOURTH drift question, about a defect in a bundle we do not
      # own. `tool_action_requests.expires_at` IS written — one hour out, by an
      # UPDATE one statement after the insert that leaves it NULL — and it is
      # published to the approver on the interaction card. Nothing enforces it:
      # both expiry sites are lazy and fire only when the REQUESTER re-invokes
      # the same tool with the same arguments on the same issue, and zero of the
      # four bundle modules touching the table register a `setInterval`. So the
      # approver is shown a deadline that no clock is holding.
      #
      # TOG-400 originally reported that the column "is never set", having read
      # only the insert. Sending that fix upstream would have added a write that
      # is already there and left the missing clock in place. The probe encodes
      # the corrected finding so nobody re-derives the wrong one.
      #
      # Offline: the suite builds a synthetic bundle in mktemp and puts a fake
      # `psql` on PATH, so it needs no Paperclip server and no database. Green
      # here means the DETECTOR works — it is NOT a statement about the deployed
      # server, which CI cannot see. Run `./approval_timeout_probe.sh` where
      # /app/server/dist and the database are reachable.
      - name: tool-approval deadline enforcement probe suite
        run: ./test_approval_timeout_probe.sh

      # TOG-358. Whether the model endpoint the agents are about to be pointed
      # at can actually serve them. The suite stands up a stub Anthropic front
      # on 127.0.0.1 that serves a different failure off each path prefix —
      # PAYG lane, missing cache accounting, wrong dialect, 401, a hang — so it
      # needs no credential, no network and no quota.
      - name: model-endpoint preflight suite
        run: ./test_agent_endpoint_preflight.sh

      # TOG-526. The offline stub proves its argv/environment detectors can
      # catch exposed credentials, then requires private transport and rejects
      # incomplete or malformed OmniRoute responses.
      - name: OmniRoute chain verifier credential suite
        run: ./test_tog485_verify_chain_argv.sh

      # Same credential boundary for the operator-side registration script:
      # management auth and the CLIProxy connection key must stay out of argv
      # and child environments, including on its default dry-run path.
      - name: OmniRoute registration credential suite
        run: ./test_tog352_register_cliproxy_argv.sh

      # TOG-425. Whether teamclaude stops sending traffic to a quota-spent
      # Claude account, read out of the pacer's jsonl. Every case is a
      # synthetic feed in a temp dir, so this needs no quota, no network and no
      # credential. It exists mainly to hold two things still: that the verdict
      # follows BURN DELTA and not the `is_current` field (which was measured
      # pointing at the idle account for an hour), and that a feed in which
      # nothing ever reached the threshold exits 4 rather than reading green.
      - name: teamclaude rotation watcher suite
        run: ./test_quota_rotation_watch.sh
      # TOG-423. Who can actually resolve a pending issue-thread interaction.
      # The gate order this encodes was re-derived from the deployed server
      # build, and it corrected two claims that had been carried forward as
      # fact — most importantly that an UNASSIGNED issue passes the assignee
      # gate for every agent rather than blocking them. Getting that backwards
      # is what left 13 answerable questions sitting on the owner's queue, so
      # the suite asserts each verdict against the source line that produced
      # it and then deletes each gate to prove the naming test goes red.
      # Pure stdin/stdout: no database, no credentials, no network.
      - name: interaction triage suite
        run: ./test_interaction_triage.sh

      # TOG-365. acceptance_live.sh can only ever run on the VPS, so the
      # operator would otherwise be the first person to execute it — against a
      # fresh install, with no way to tell "these assertions passed" from "these
      # assertions never looked at anything". This runs the real transport on a
      # real socket with requireLiveRun ON (podman and sudo substituted through
      # the seams the suite already exposes), proves the suite green, then
      # removes each of its four controls in turn and requires the OWNING
      # section to go red. Phase 3 additionally reproduces the vacuous form of
      # the assertion this replaces, so the rationale in the file header stays
      # a measurement rather than a claim.
      - name: live-path acceptance self-test (mutation-gated)
        run: ./mcp/deploy/acceptance_live_selftest.sh

      # "No secrets in this repo, ever" is a stated non-negotiable, so it gets
      # an assertion rather than a promise. Scans TRACKED files only: anything
      # .gitignore covers is by definition not in the repo, and scanning the
      # working tree would fail on an operator's local scratch files.
      #   test_gh_app_token.sh assembles its canaries from fragments at runtime
      # precisely so the suite does not trip this step.
      - name: Secret scan
        run: |
          set -uo pipefail
          rc=0
          # git grep searches tracked files only, which is the scope we want.
          # Live GitHub credentials of every prefix, and private key material.
          if git grep -nIE '(gh[pousr]_[A-Za-z0-9]{16,}|github_pat_[A-Za-z0-9_]{16,})'; then
            echo "::error::a GitHub-token-shaped string is committed"; rc=1
          fi
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY'; then
            echo "::error::private key material is committed"; rc=1
          fi
          # The .gitignore entries other steps and the tools depend on. Losing
          # one is silent until the day something lands in a commit.
          for pat in '*.env' '*.pem' '*.key' '*.jsonl' '.gh-app-token.json'; do
            grep -qxF "$pat" .gitignore || { echo "::error::.gitignore no longer covers $pat"; rc=1; }
          done
          [ $rc -eq 0 ] && echo "secret scan: clean"
          exit $rc

      # A suite that cannot fail is decoration. Each mutation step below
      # reintroduces a REAL past defect into a THROWAWAY COPY — never a tracked
      # file — and requires the suite to reject it.
      #
      # WHY THERE IS A BASELINE ASSERTION IN HERE (TOG-253). Until this commit
      # these steps copied the suites into a temp directory WITHOUT lib/, which
      # org_request_queue.sh sources and exits 1 without. The copied suite
      # therefore failed in that directory no matter what the sed did, and
      # "the mutated suite failed" was true for a reason that had nothing to do
      # with the mutation. Both gates passed while proving nothing.
      #
      # The fix is not merely `cp -r lib` — it is asserting that the UNMUTATED
      # copy passes in the same directory first. That single check is what makes
      # a red result attributable to the mutation, and it is what would have
      # caught the original hole. mutation_check below does both, and every
      # mutation step goes through it.
      - name: Mutation gates — the suites must reject reintroduced defects
        run: |
          set -uo pipefail

          # stage <dir> — a runnable copy of the tools, lib/ included.
          stage() {
            cp org_request_queue.sh org_provisioner.sh org_access_review.sh \
               test_responsible_leader.sh test_request_record_integrity.sh \
               test_decision_notify.sh test_leader_notify.sh "$1/"
            mkdir -p "$1/lib" && cp lib/*.sh lib/*.py "$1/lib/"
          }

          # mutation_check <label> <suite> <expect-sibling: yes|no|skip> <sed-expr>...
          #   1. the unmutated copy must PASS      (else the gate is vacuous)
          #   2. the mutated copy must still PARSE (else it fails for the wrong reason)
          #   3. the mutated copy must FAIL        (the actual assertion)
          # Every invocation has an OUTER watchdog independent of the code being
          # mutated. Exit 124/137 is expected only from a mutant; a baseline that
          # reaches either is a distinct harness failure, never "the mutant died".
          mutation_suite() {
            local dir="$1" suite="$2" limit="${MUTATION_SUITE_TIMEOUT:-150}"
            local output="${MUTATION_SUITE_OUTPUT:-/dev/null}"
            # This independent subreaper owns the whole mutation session. A
            # courier can start a new session of its own; the watchdog still
            # adopts and terminates it before returning 124 to this gate.
            python3 "$dir/lib/mutation_watchdog.py" "$dir" "$suite" "$limit" >"$output" 2>&1
          }

          mutation_check() {
            local label="$1" suite="$2" sibling="$3"; shift 3
            local mut; mut="$(mktemp -d)"; stage "$mut"
            local assertion_sentinel="" required_assertion="" assertion_armed=""
            if [[ "$label" == "transport-can-ignore-timeout-term" ]]; then
              assertion_sentinel="$mut/.assertion-sentinel"
              required_assertion="transport-ignore-term-courier-gone"
              assertion_armed="transport-ignore-term-assertion-armed"
            fi

            TEST_LEADER_NOTIFY_ASSERTION_SENTINEL="$assertion_sentinel" \
              mutation_suite "$mut" "$suite"
            local base_rc=$?
            if [[ $base_rc -ne 0 ]]; then
              if [[ $base_rc -eq 124 || $base_rc -eq 137 ]]; then
                echo "::error::$label: BASELINE TIMEOUT in $suite — the unmutated suite exceeded the outer ${MUTATION_SUITE_TIMEOUT:-150}s bound"
              else
                echo "::error::$label: the UNMUTATED copy of $suite already fails (rc=$base_rc) — this gate proves nothing"
              fi
              MUTATION_SUITE_OUTPUT="$mut/.baseline-output" \
                TEST_LEADER_NOTIFY_ASSERTION_SENTINEL="$assertion_sentinel" \
                mutation_suite "$mut" "$suite"
              tail -20 "$mut/.baseline-output"
              rm -rf "$mut"; return 1
            fi
            if [[ -n "$required_assertion" ]] \
              && ! grep -qxF "$required_assertion" "$assertion_sentinel" 2>/dev/null; then
              echo "::error::$label: baseline passed without reaching the required $required_assertion assertion"
              rm -rf "$mut"; return 1
            fi

            local e target
            for e in "$@"; do
              target="$mut/org_request_queue.sh"
              if [[ "$e" == lib:* ]]; then
                target="$mut/lib/reqrecord.sh"
                e="${e#lib:}"
              elif [[ "$e" == py:* ]]; then
                target="$mut/lib/notify_exec.py"
                e="${e#py:}"
              fi
              sed -i "$e" "$target" || {
                echo "::error::$label: mutation expression failed for $target: $e"
                rm -rf "$mut"; return 1
              }
            done
            if ! bash -n "$mut/org_request_queue.sh" "$mut/lib/reqrecord.sh" \
              || ! python3 -m py_compile "$mut/lib/notify_exec.py"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            if cmp -s org_request_queue.sh "$mut/org_request_queue.sh" \
              && cmp -s lib/reqrecord.sh "$mut/lib/reqrecord.sh" \
              && cmp -s lib/notify_exec.py "$mut/lib/notify_exec.py"; then
              echo "::error::$label: the sed changed nothing — the code moved and the mutation missed"
              rm -rf "$mut"; return 1
            fi

            [[ -z "$assertion_sentinel" ]] || : > "$assertion_sentinel"
            local descendant_watch="" mutant_output="$mut/.mutant-output"
            if [[ -n "$required_assertion" ]]; then
              descendant_watch="$mut/.descendant-watch"
            fi
            MUTATION_SUITE_OUTPUT="$mutant_output" \
              MUTATION_WATCHDOG_PROCESS_FILE="$descendant_watch" \
              TEST_LEADER_NOTIFY_DESCENDANT_WATCH="$descendant_watch" \
              TEST_LEADER_NOTIFY_ASSERTION_SENTINEL="$assertion_sentinel" \
              mutation_suite "$mut" "$suite"
            local mut_rc=$?
            if [[ $mut_rc -eq 0 ]]; then
              echo "::error::$label: $suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            elif [[ -n "$required_assertion" ]]; then
              if grep -qxF "$required_assertion" "$assertion_sentinel" 2>/dev/null; then
                echo "::error::$label: mutant reached the passing $required_assertion assertion"
                rm -rf "$mut"; return 1
              fi
              if [[ -n "$assertion_armed" ]] \
                && ! grep -qxF "$assertion_armed" "$assertion_sentinel" 2>/dev/null; then
                echo "::error::$label: mutant timed out before arming the intended TERM assertion"
                rm -rf "$mut"; return 1
              fi
              if [[ $mut_rc -ne 124 ]] \
                || ! grep -qxF "MUTATION_WATCHDOG: watched descendant terminated" "$mutant_output"; then
                echo "::error::$label: mutant did not time out with attributable descendant cleanup (rc=$mut_rc)"
                tail -20 "$mutant_output"
                rm -rf "$mut"; return 1
              fi
              echo "  ok  $label — TERM assertion armed and blocked; watchdog terminated the escaped descendant"
            elif [[ $mut_rc -eq 124 || $mut_rc -eq 137 ]]; then
              echo "  ok  $label — mutant hit the outer deadline (rc=$mut_rc)"
            fi

            # Cross-check: is this defect visible to the OTHER suite? Pins which
            # suite is actually carrying the weight, so the two cannot quietly
            # collapse into one.
            if [ "$sibling" != "skip" ]; then
              local other=test_responsible_leader.sh
              [ "$suite" = "$other" ] && other=test_request_record_integrity.sh
              mutation_suite "$mut" "$other" >/dev/null 2>&1
              local other_rc=$?
              if [[ $other_rc -eq 0 ]]; then
                [ "$sibling" = "yes" ] && {
                  echo "::error::$label: expected $other to catch this too, and it did not"; rm -rf "$mut"; return 1; }
              else
                if [[ $other_rc -eq 124 || $other_rc -eq 137 ]]; then
                  echo "::error::$label: sibling $other hit the OUTER deadline; this cross-check is not attributable"
                  rm -rf "$mut"; return 1
                fi
                [ "$sibling" = "no" ] && {
                  echo "::error::$label: $other also catches this, so it does not show $suite carries its own weight"
                  rm -rf "$mut"; return 1; }
              fi
            fi
            rm -rf "$mut"
            [[ $mut_rc -eq 124 || $mut_rc -eq 137 ]] || echo "  ok  $label"
          }

          rc=0

          # Let a dormant leader be SKIPPED instead of woken. The single most
          # tempting future "fix" to this design, and it silently turns waiting
          # into approver-shopping.
          mutation_check "skipped-dormant-leader" test_responsible_leader.sh skip \
            's/if \[\[ "$a_status" == "terminated" \]\]; then/if [[ "$a_status" == "terminated" || "$a_status" == "paused" ]]; then/' || rc=1

          # TOG-197's two-time validation: the requester's ceiling is checked at
          # SUBMIT and RE-CHECKED at approval against freshly-read state. Drop
          # the re-check and a pending request banks the authority its requester
          # held when it submitted — so a demotion, a transfer or a termination
          # between submit and approval no longer reaches the decision. This is
          # the TOCTOU defence TOG-194 says must survive the epic intact, and
          # until TOG-258 the only coverage of it lived in test_request_queue.sh,
          # which needs Postgres and podman and never runs here. `no`: the record
          # suite does not see this one, which is what shows the authorization
          # suite carries it.
          mutation_check "banked-stale-authority" test_responsible_leader.sh no \
            's/^  may_request "$now_tpl"/  true "$now_tpl"/' || rc=1

          # An auditor may not clear an override it took itself. Drop that one
          # comparison and the open-item list becomes self-service: the bypasser
          # writes the entry AND retires it, a write-only log in audit clothing.
          mutation_check "self-clearable-override" test_responsible_leader.sh skip \
            's/rv_id" == "$a_id"/rv_id" == "never-matches"/' || rc=1

          # TOG-253 defect 4, exactly as found: the reason guard back on the
          # denial path only, leaving approvals unreasoned. Expected to be
          # INVISIBLE to the authorization suite — a denial still needs a
          # reason — which is what shows the record suite earns its place.
          mutation_check "unreasoned-approval" test_request_record_integrity.sh no \
            's/\[\[ -n "$reason" \]\] || die "every decision/[[ -n "$reason" || "$decision" == "approved" ]] || die "every decision/' || rc=1

          # TOG-253 defect 3: expiry back to being a side effect of an attempted
          # review. Both halves go together — the reaper and the derivation in
          # request_state — because either alone still gives the right answer,
          # which is the point of having both.
          mutation_check "never-expires" test_request_record_integrity.sh skip \
            's/^reap_expired() {/reap_expired() { return 0;/' \
            's/expired "$exp" \&\& rec=/false \&\& rec=/' || rc=1

          # TOG-253 defect 1: the invariant, not the lock. An ambiguous id gets
          # resolved by tail -1 again instead of being refused.
          mutation_check "ambiguous-request-id" test_request_record_integrity.sh skip \
            'lib:s/\[\[ "$n" -le 1 \]\]/[[ "$n" -le 99 ]]/' || rc=1

          # --- TOG-254: the requester learns ---------------------------------
          # All four use sibling=skip. The cross-check picks "the other suite"
          # from a hard-coded pair, so it cannot express a third suite; using it
          # here would compare against an arbitrary one of the two and prove
          # nothing. The gates below still assert the full three-step contract.

          # THE headline defect this issue was filed about: "nothing wakes on an
          # expiry today at all". Expiry is the quietest of the terminal states
          # because no human action produces it, so it is the one that silently
          # reverts to notifying nobody.
          mutation_check "expiry-notifies-nobody" test_decision_notify.sh skip \
            's/emit_notification "$rid" expired/true "$rid" expired/' || rc=1

          # Expiry re-notifying on EVERY read, because reap_expired runs from
          # read paths. A notifier that pages on every `list` gets muted, and a
          # muted notifier is the dead end this issue exists to close, reached
          # by a different road.
          #
          # BOTH halves go together, for the same reason the never-expires gate
          # above mutates two lines: single-shot delivery is held by the
          # idempotency guard in emit_notification AND by reap_expired only
          # reaping requests whose last status is pending. Either alone gives
          # the right answer, so mutating one proves nothing — the first draft
          # of this gate mutated only the guard and the suite passed, which is
          # how the redundancy was found rather than assumed.
          mutation_check "notification-repeats-forever" test_decision_notify.sh skip \
            's/^  notify_already "$rid" requester && { NOTIFY_RESULT="already"; return 0; }/  false \&\& { NOTIFY_RESULT="already"; return 0; }/' \
            's/| map(select(.last == "pending" and .exp != ""))/| map(select(.exp != ""))/' || rc=1

          # Put the notification row back to carrying `status`, so it is shaped
          # like a decision. This is not hypothetical — it is the regression
          # this feature actually caused while being written, and it made
          # notified requests vanish from every filtered listing.
          mutation_check "notification-shaped-like-a-decision" test_decision_notify.sh skip \
            's/{event:"notify.queued",requestId:$id,audience:"requester",decision:$s,/{event:"notify.queued",requestId:$id,audience:"requester",status:$s,/' || rc=1

          # The undelivered-notification gate going green. Same failure mode as
          # a muted alarm: the feature still "works", and nobody learns that
          # nobody is learning.
          mutation_check "undelivered-gate-always-green" test_decision_notify.sh skip \
            's/\[\[ "$bad" -eq 0 \]\] ||/[[ "$bad" -ge 0 ]] ||/' || rc=1

          # The queue-side half of the steering guard. The transport validates
          # too, so this gate exists to prove the door check is load-bearing on
          # its own — without it, deleting the submit-time refusal would leave
          # every suite green and a hostile address sitting in the audit record.
          mutation_check "notify-issue-unvalidated-at-submit" test_decision_notify.sh skip \
            's|^  if \[\[ -n "\$notify_issue" && ! "\$notify_issue" =~.*$|  if false; then|' || rc=1

          # TOG-312, and the two directions this one selector can fail in.
          #
          # NARROWED — back to matching the role string alone. This is the
          # tempting revert ("--for takes a ROLE, it always has"), and it is
          # invisible from a shell, where a role is what anyone types. It is
          # only visible from the MCP transport, which has no role to type: it
          # authenticates a session and knows exactly one thing about its
          # caller, the agent uuid. Narrowed, an agent's own decisions read back
          # EMPTY through the only door it has — indistinguishable from "not
          # decided yet", which is the dead end TOG-312 was filed about.
          mutation_check "inbox-matches-role-only" test_decision_notify.sh skip \
            's/select(.role==$w or .agent==$w)/select(.role==$w)/' || rc=1

          # WIDENED — the same line failing the other way. An inbox that stops
          # filtering is not a broken inbox; it is a company-wide read of every
          # decision, reached from a per-principal tool, and it LOOKS like a
          # working feature from the caller's side because their own rows are
          # all still there. Both halves matter: the mutation above proves the
          # fix does something, this one proves it does not do too much.
          mutation_check "inbox-matches-everyone" test_decision_notify.sh skip \
            's/select(.role==$w or .agent==$w)/select(true)/' || rc=1

          # --- TOG-317: the leader learns ------------------------------------
          # These use sibling=skip because the cross-check only understands the
          # original two-suite pair. Each still proves baseline, applied mutation,
          # parse validity, and that the owning suite goes red.
          mutation_check "leader-never-told" test_leader_notify.sh skip \
            's/^  if ! build_leader_notification_payloads "$rid" "$submission"; then$/  LEADER_NOTIFY_PAYLOADS=(); if false; then/' || rc=1

          # Standing notices are profile-addressed for the operator but UUID-
          # addressed through authenticated MCP. Blank the enqueue-time profile
          # resolution; both shell role pulls still work, so only the UUID
          # assertions prove this path is actually reachable to agents.
          mutation_check "standing-authority-agent-id-not-recorded" test_leader_notify.sh skip \
            's/^        standing_id="$(f 1 "$standing_row")"$/        standing_id=""/' || rc=1

          mutation_check "leader-notification-swallows-the-requesters" test_leader_notify.sh skip \
            's/                and (.audience \/\/ "requester")==$aud/                and true/' || rc=1

          mutation_check "leader-address-chosen-by-requester" test_leader_notify.sh skip \
            's/^  local addr="$REQUEST_LEADER_NOTIFY_ISSUE" addr_note=""$/  local addr="$(jq -r ".notifyIssue \/\/ \\"\\"" <<<"$sub")" addr_note=""/' || rc=1

          # Collapse reqrecord's separate notification-status lock back onto
          # QUEUE_LOCK. A >5s honest transport then occupies the queue's ordinary
          # writer lock and a legitimate overlapping review is refused.
          mutation_check "transport-holds-queue-lock" test_leader_notify.sh skip \
            's|^REQRECORD_STATUS_LOCK="${QUEUE}.notify-status.lock"$|REQRECORD_STATUS_LOCK="$QUEUE_LOCK"|' || rc=1

          # Re-open the unbounded fallback when timeout enforcement is missing.
          # The suite points the explicit timeout seam at an unavailable command
          # and must prove that the transport is not invoked at all.
          mutation_check "transport-runs-without-timeout-enforcement" test_leader_notify.sh skip \
            's|^    out="process-tree timeout enforcement unavailable; transport not invoked"$|    out="transport ran without containment"; bash -c "$REQUEST_NOTIFY_CMD" </dev/null >/dev/null 2>\&1|' \
            's|^    rc=125$|    rc=$?|' || rc=1

          # Remove only the forced-kill escalation. The TERM-ignoring courier
          # survives TERM, so its PID assertion must reject this mutant. The
          # independent mutation_suite watchdog bounds that mutant and reports a
          # mutant timeout separately from an unmutated baseline timeout.
          mutation_check "transport-can-ignore-timeout-term" test_leader_notify.sh skip \
            'py:s/os.killpg(proc.pid, signal.SIGKILL)/os.killpg(proc.pid, signal.SIGTERM)/' \
            'py:s/signal_children(signal.SIGKILL)/signal_children(signal.SIGTERM)/' \
            'py:s/proc.kill()/proc.terminate()/' || rc=1

          # Remove descendant cleanup from the supervisor. The retained-stdout
          # and detached-mutator fixtures exercise descriptor and process-tree
          # containment; the owning suite must reject the mutation without
          # letting it hang the CI job.
          mutation_check "transport-descendants-survive-parent" test_leader_notify.sh skip \
            'py:s/^        stop_tree(proc, grace)$/        pass/' || rc=1

          # Suppress jq failure again. Malformed JSON then produces partial output
          # that can compare equal and be credited as a delivered notification.
          mutation_check "malformed-fingerprint-reads-equal" test_leader_notify.sh skip \
            'lib:s#^    .select(\$ev\[.event\] // false). .\$QUEUE.$#    '\''select($ev[.event] // false)'\'' "$QUEUE" 2>/dev/null || true#' || rc=1

          # Disable the central mutation verdict. Because the guard lives inside
          # notify_deliver, this one deletion must expose both hostile submit and
          # hostile drain cases; a call-site wrapper cannot satisfy the drain case.
          mutation_check "notifier-mints-a-decision-on-submit-or-drain" test_leader_notify.sh skip \
            's/^  \[\[ "$fp_before" == "$fp_after" \]\] || tampered="yes"$/  true/' || rc=1

          # The atomic standing-authority intent set must retain both recipients.
          # Collapsing the builder to its first row strands the second authority
          # before publication, while a single-leader request still looks healthy.
          mutation_check "standing-recipient-idempotency-collapsed" test_leader_notify.sh skip \
            '/while IFS= read -r standing_role; do/,/done < <(jq -r/ s/      LEADER_NOTIFY_PAYLOADS+=("$LEADER_NOTIFY_PAYLOAD")$/      [[ ${#LEADER_NOTIFY_PAYLOADS[@]} -gt 0 ]] || LEADER_NOTIFY_PAYLOADS+=("$LEADER_NOTIFY_PAYLOAD")/' || rc=1

          # Upgrade compatibility: recipient-aware grouping must still associate
          # historical requester outcomes that predate recipientRole. Requiring an
          # exact role match re-queues and redelivers already-delivered decisions.
          mutation_check "legacy-notification-outcome-orphaned" test_leader_notify.sh skip \
            's/                             or ($q.audience=="requester" and ((has("recipientRole")|not) or .recipientRole==null))))/                             or false))/' || rc=1

          # Standing authority has two required recipients. Regressing to the old
          # scalar summary lets P1's later success overwrite P4's earlier failure.
          mutation_check "standing-mixed-result-collapsed" test_leader_notify.sh skip \
            's/^    LEADER_NOTIFY_RESULTS+=.*$/    LEADER_NOTIFY_RESULTS=""/' \
            's/^    NOTIFY_RESULT="failed"$/    NOTIFY_RESULT="$result"/' || rc=1

          # Advisory reachability may never execute without an enforceable outer
          # deadline. Re-open the direct fallback and the hanging fixture must hit
          # this mutation gate's independent watchdog rather than hang the job.
          mutation_check "reachability-runs-without-timeout-enforcement" test_leader_notify.sh skip \
            's|^    echo "  reachability       : UNKNOWN for .*|    out="$("$probe" probe --agent "$lid" 2>/dev/null)"; rc=$?;|' || rc=1

          # --- the transport's own gates (TOG-198 review) ---------------------
          # Separate helper because these mutate notify_paperclip_issue.sh, not
          # org_request_queue.sh, and the suite reaches it through NOTIFY_SH
          # rather than by cwd. Same three-step contract: the unmutated copy
          # must pass in the staging dir (or the gate is vacuous), the mutation
          # must still parse (or it fails for the wrong reason), and the sed
          # must actually change something (or the code moved and the mutation
          # silently missed).
          notify_mutation_check() {
            local label="$1"; shift
            local mut; mut="$(mktemp -d)"
            cp notify_paperclip_issue.sh test_notify_transport.sh "$mut/"
            chmod +x "$mut/notify_paperclip_issue.sh" "$mut/test_notify_transport.sh"

            if ! NOTIFY_SH="$mut/notify_paperclip_issue.sh" ./test_notify_transport.sh >/dev/null 2>&1; then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              NOTIFY_SH="$mut/notify_paperclip_issue.sh" ./test_notify_transport.sh 2>&1 | tail -20
              rm -rf "$mut"; return 1
            fi

            local e
            for e in "$@"; do sed -i "$e" "$mut/notify_paperclip_issue.sh"; done
            if ! bash -n "$mut/notify_paperclip_issue.sh"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            if cmp -s notify_paperclip_issue.sh "$mut/notify_paperclip_issue.sh"; then
              echo "::error::$label: the sed changed nothing — the code moved and the mutation missed"
              rm -rf "$mut"; return 1
            fi

            if NOTIFY_SH="$mut/notify_paperclip_issue.sh" ./test_notify_transport.sh >/dev/null 2>&1; then
              echo "::error::$label: test_notify_transport.sh PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"
            echo "  ok  $label"
          }

          # The credential back on argv. /proc/<pid>/cmdline is world-readable
          # and this box is shared between companies; gh_token.sh:75-131 made
          # this a repo-wide rule under TOG-200 and the notifier shipped
          # breaking it, which is how a rule decays — one new caller at a time.
          notify_mutation_check "notify-credential-on-argv" \
            's|^  printf .header = "Authorization: Bearer %s..n. "\$PAPERCLIP_API_KEY"$|  :|' \
            's|^RESP="\$(curl --config "\$CFG" -o /dev/null -w .%{http_code}. 2>&1)"|RESP="$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $PAPERCLIP_API_KEY" -H "Content-Type: application/json" -d "$(jq -cn --arg b "$MSG" "{body:\\$b}")" "$BASE/api/issues/$ISSUE/comments" 2>\&1)"|' || rc=1

          # The issue id unvalidated, so the least-privileged party in the flow
          # picks the route an operator-credentialed POST takes. curl resolves
          # dot segments client-side, so this is not theoretical: `..` in the
          # id removed /api/issues/ from url_effective entirely.
          notify_mutation_check "notify-unvalidated-issue-id" \
            's|^if \[\[ ! "\$ISSUE" =~ \^\[A-Za-z0-9\]\[A-Za-z0-9_-\]\*\$ \]\]; then|if false; then|' || rc=1

          # A fixed ``` fence, which a body containing ``` closes. These
          # comments WAKE agents, so the forged block that follows is read by a
          # machine, not merely displayed to a human.
          notify_mutation_check "notify-fence-not-measured" \
            's|^FENCE_LEN=\$(( \$(longest_tick_run "\$BODY") + 1 )).*$|FENCE_LEN=3|' || rc=1

          # Leader rows carry `decision`, deliberately not `status`; reading only
          # status renders the reference adapter heading as null.
          notify_mutation_check "notify-renders-status-only" \
            's/^STATUS=.*$/STATUS="$(jq -r '\''.status'\'' <<<"$PAYLOAD")"/' || rc=1

          # Restore the audience-blind fallback. A leader row whose operator
          # address is null then gets sent to the requester's fallback issue.
          notify_mutation_check "notify-leader-uses-requester-fallback" \
            's/^if \[\[ -z "$ISSUE" && "$AUDIENCE" == "requester" \]\]; then/if [[ -z "$ISSUE" ]]; then/' || rc=1

          exit $rc

      - name: Prove the regression suite still detects the bug
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp gh-app-token.js test_gh_app_token.sh "$mut/"
          # Delete the help branch and the refusal, restoring the unconditional
          # trailing mint that leaked a live org-admin token. Written with no
          # single quotes inside so the shell quoting stays legible.
          node -e '
            var fs = require("fs");
            var p = process.argv[1];
            var s = fs.readFileSync(p, "utf8");
            var i = s.indexOf("if (mode === undefined");
            var j = s.indexOf("main().catch");
            if (i < 0 || j < 0) {
              console.error("::error::could not find the dispatch tail of main() to mutate; this guard is now blind, fix it");
              process.exit(2);
            }
            fs.writeFileSync(p, s.slice(0, i) + "process.stdout.write(await token())\n}\n\n" + s.slice(j));
          ' "$mut/gh-app-token.js"
          node --check "$mut/gh-app-token.js"
          if "$mut/test_gh_app_token.sh" > "$mut/out.txt" 2>&1; then
            echo "::error::the regression suite PASSED against a deliberately reintroduced bug"
            cat "$mut/out.txt"
            exit 1
          fi
          grep -c 'FAIL' "$mut/out.txt" | xargs -I{} echo "suite correctly reported {} failures against the mutant"

      # TOG-200. Asserts on the kernel's record — a stub curl on PATH reading
      # its own /proc/<pid>/cmdline — rather than on the source text, so a
      # future rewrite of how gh_token.sh calls curl cannot pass by accident.
      - name: gh_token.sh argv-leak suite
        run: ./test_gh_token_argv.sh

      # The matching mutation guard. This one is surgical: it leaves the config
      # file exactly as it is and ADDS the header back on argv, so every other
      # assertion in the suite still passes and only the /proc check can go red.
      # That is the point — it proves the /proc detector is what carries this
      # suite, not the config-file bookkeeping around it.
      - name: Prove the argv-leak suite still detects a credential on argv
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp gh_token.sh test_gh_token_argv.sh "$mut/"
          chmod +x "$mut/gh_token.sh" "$mut/test_gh_token_argv.sh"
          # TOG-253's rule, applied here too: the UNMUTATED copy must pass in
          # this same staging directory FIRST. Without it, "the mutated suite
          # failed" is not attributable to the mutation — the staged copy could
          # be failing for any reason at all (a missing sibling file, a change
          # in how GH_TOKEN_SH is resolved) and this gate would still go green
          # while proving nothing. It passes today; this keeps it honest.
          if ! GH_TOKEN_SH="$mut/gh_token.sh" "$mut/test_gh_token_argv.sh" > "$mut/base.txt" 2>&1; then
            echo "::error::the UNMUTATED copy of test_gh_token_argv.sh already fails in the staging dir — this gate proves nothing"
            tail -25 "$mut/base.txt"
            exit 1
          fi
          before='  curl --config "$cfg" "$@"'
          after='  curl --config "$cfg" -H "Authorization: Bearer $bearer" "$@"'
          if ! grep -qxF "$before" "$mut/gh_token.sh"; then
            echo "::error::could not find the curl invocation in curl_authed() to mutate; this guard is now blind, fix it"
            exit 2
          fi
          # awk, not sed: the replacement is full of characters sed would treat
          # as syntax, and a mutation that silently does nothing is the one
          # failure mode this step exists to avoid.
          awk -v b="$before" -v a="$after" '$0 == b { print a; next } { print }' \
            "$mut/gh_token.sh" > "$mut/gh_token.mut" && mv "$mut/gh_token.mut" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          bash -n "$mut/gh_token.sh"
          if GH_TOKEN_SH="$mut/gh_token.sh" "$mut/test_gh_token_argv.sh" > "$mut/out.txt" 2>&1; then
            echo "::error::the argv-leak suite PASSED against a credential deliberately put back on argv"
            cat "$mut/out.txt"
            exit 1
          fi
          grep -c 'FAIL' "$mut/out.txt" | xargs -I{} echo "suite correctly reported {} failures against the mutant"

      # TOG-305. The third property of gh_token.sh's `api` path, and the one
      # that was wrong: the request BODY must reach the request. It did not.
      # curl_authed's body slot was hardcoded empty and the caller's JSON was
      # passed positionally instead, so curl parsed it as a URL and the write
      # went out with no body — dropping a `sha` head guard from a real merge
      # and turning a requested squash into a merge commit, silently, while
      # reporting failure for a write that had actually succeeded.
      #
      # Same seams as the two suites above: a stub curl on PATH, a fabricated
      # credential environment, `env -i`. No network, no credential.
      - name: gh_token.sh api request-body suite
        run: ./test_gh_token_api_body.sh

      # Its mutation guard. Three mutations, because the fixes fail independently
      # and a single mutation would leave one of them ungated:
      #
      #   body-slot-collision   restores the original call — body slot empty,
      #                         JSON passed positionally. Surgical: the
      #                         argument PARSING is left alone, so sections
      #                         5/7/8/10 stay green and only the assertions
      #                         about the body and the exit status can go red.
      #                         That is the point — it proves those assertions
      #                         carry this suite, not the parsing around them.
      #   unchecked-mint        restores `tok="$(mint_token)"` with no status
      #                         check. mint_token runs in a command
      #                         substitution, so its `exit 1` ends only the
      #                         subshell and the request went out with an empty
      #                         bearer. Both lines of the guard are removed:
      #                         leaving the `-n "$tok"` check in place would let
      #                         a NEIGHBOURING gate satisfy the test, which is
      #                         how assertions in this repo have gone green for
      #                         the wrong reason before.
      #   http-status-ignored   routes `api` back through curl_authed, restoring
      #                         the TOG-455 false success: GitHub's 409 body is
      #                         printed, but the command exits 0 and `&& merged`
      #                         runs. The named red assertions require the exit
      #                         status AND body-preservation contract together.
      #
      # Each mutation asserts red on the NAMED assertions it should break, not
      # merely on a non-zero exit. "The suite failed" is satisfied by a suite
      # that failed to start.
      - name: Prove the api-body suite still detects a dropped request body
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp gh_token.sh test_gh_token_api_body.sh "$mut/"
          chmod +x "$mut/gh_token.sh" "$mut/test_gh_token_api_body.sh"

          # TOG-253's rule: the UNMUTATED copy must pass in this same staging
          # directory FIRST, or "the mutated suite failed" is not attributable
          # to the mutation.
          if ! GH_TOKEN_SH="$mut/gh_token.sh" "$mut/test_gh_token_api_body.sh" > "$mut/base.txt" 2>&1; then
            echo "::error::the UNMUTATED copy of test_gh_token_api_body.sh already fails in the staging dir — this gate proves nothing"
            tail -30 "$mut/base.txt"
            exit 1
          fi

          plain() { sed 's/\x1B\[[0-9;]*m//g' "$1"; }

          # A mutant must go red on the assertion that NAMES the defect. A
          # mutant that merely exits non-zero could be failing at startup.
          require_red() {
            local out="$1"; shift
            local a
            for a in "$@"; do
              if plain "$out" | grep -qF "FAIL  $a"; then
                echo "    red on: $a"
              else
                echo "::error::mutant did not go red on '$a' — that assertion is not carrying this gate"
                plain "$out" | tail -30
                exit 1
              fi
            done
          }

          run_mutant() {
            local label="$1" out="$mut/$1.txt"
            bash -n "$mut/gh_token.sh"
            if GH_TOKEN_SH="$mut/gh_token.sh" "$mut/test_gh_token_api_body.sh" > "$out" 2>&1; then
              echo "::error::the api-body suite PASSED against mutation '$label'"
              plain "$out"
              exit 1
            fi
            echo "  mutation '$label' correctly rejected:"
          }

          # --- mutation 1: body-slot-collision ---------------------------------
          cp "$mut/gh_token.sh" "$mut/gh_token.orig"
          before='    curl_authed_http "$tok" "$method" "https://api.github.com${path}" "$api_body" ${api_extra[@]+"${api_extra[@]}"}'
          after='    curl_authed_http "$tok" "$method" "https://api.github.com${path}" "" "$api_body" ${api_extra[@]+"${api_extra[@]}"}'
          if ! grep -qxF "$before" "$mut/gh_token.sh"; then
            echo "::error::could not find the curl_authed call in the api arm to mutate; this guard is now blind, fix it"
            exit 2
          fi
          # awk, not sed: the replacement is full of characters sed would treat
          # as syntax, and a mutation that silently does nothing is the one
          # failure mode this step exists to avoid.
          awk -v b="$before" -v a="$after" '$0 == b { print a; next } { print }' \
            "$mut/gh_token.sh" > "$mut/g" && mv "$mut/g" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          run_mutant body-slot-collision
          require_red "$mut/body-slot-collision.txt" \
            "the body did not reach the request as given" \
            "the request body reached curl's argv" \
            "the 'sha' head guard never reached GitHub" \
            "'merge_method' was dropped" \
            "a successful write reported failure"
          # The surgical half: the parsing sections must still pass, or this
          # mutation is proving something broader than it claims.
          for still_green in \
            "caller-supplied curl arguments still reach curl" \
            "a bare curl flag in the body slot is a usage error (exit 2)" \
            "a non-JSON body is a usage error (exit 2)"; do
            if ! plain "$mut/body-slot-collision.txt" | grep -qF "PASS  $still_green"; then
              echo "::error::mutation 'body-slot-collision' also broke '$still_green' — it is not surgical, so it does not isolate the body assertions"
              exit 1
            fi
          done

          # --- mutation 2: unchecked-mint --------------------------------------
          cp "$mut/gh_token.orig" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          b1='    tok="$(mint_token)" || exit $?'
          b2='    [[ -n "$tok" ]] || { echo "ERROR: minted an empty token; refusing to send the request" >&2; exit 1; }'
          a1='    tok="$(mint_token)"'
          for t in "$b1" "$b2"; do
            if ! grep -qxF "$t" "$mut/gh_token.sh"; then
              echo "::error::could not find the mint guard line to mutate; this guard is now blind, fix it"
              echo "  wanted: $t"
              exit 2
            fi
          done
          awk -v b1="$b1" -v b2="$b2" -v a1="$a1" \
            '$0 == b1 { print a1; next } $0 == b2 { next } { print }' \
            "$mut/gh_token.sh" > "$mut/g" && mv "$mut/g" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          run_mutant unchecked-mint
          require_red "$mut/unchecked-mint.txt" \
            "a failed mint exited 0" \
            "the request went out anyway"

          # --- mutation 3: http-status-ignored ----------------------------------
          cp "$mut/gh_token.orig" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          before='    curl_authed_http "$tok" "$method" "https://api.github.com${path}" "$api_body" ${api_extra[@]+"${api_extra[@]}"}'
          after='    curl_authed "$tok" "$method" "https://api.github.com${path}" "$api_body" ${api_extra[@]+"${api_extra[@]}"}'
          if ! grep -qxF "$before" "$mut/gh_token.sh"; then
            echo "::error::could not find the HTTP-aware api call to mutate; this guard is now blind, fix it"
            exit 2
          fi
          awk -v b="$before" -v a="$after" '$0 == b { print a; next } { print }' \
            "$mut/gh_token.sh" > "$mut/g" && mv "$mut/g" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          run_mutant http-status-ignored
          require_red "$mut/http-status-ignored.txt" \
            "HTTP 409 exited 0, expected 22" \
            "the composed caller contract broke"
          # Surgical: ignoring status must not discard the error body. This keeps
          # the mutation focused on the false-success half of the pair.
          if ! plain "$mut/http-status-ignored.txt" | grep -qF "PASS  HTTP 409 response body is still printed in full"; then
            echo "::error::mutation 'http-status-ignored' also lost the body — it does not isolate the exit-status assertion"
            exit 1
          fi

      # TOG-201. The other half of gh_token.sh's contract: an unrecognised
      # subcommand printed usage on STDOUT and exited 0, so
      # `tok="$(gh_token.sh tokne)" && use "$tok"` took the `&&` with usage text
      # in $tok. Offline — fake credential environment, stub curl.
      - name: gh_token.sh dispatch-contract suite
        run: ./test_gh_token_dispatch.sh

      # Its mutation guard, with a BASELINE. "The mutated suite failed" is
      # unattributable on its own — a staging dir that breaks the suite for an
      # unrelated reason (a missing sibling file, a copy that lost +x) produces
      # the same red as a working detector. So assert the UNMUTATED copy passes
      # in the same directory first, then mutate it there.
      #
      # Five mutations, one per independently-failing property. The first two
      # are the TOG-201 halves; the last three are TOG-331, which is the same
      # class one level down — the RIGHT subcommand, reached, failing silently.
      #
      #   catchall-exits-zero        restores the pre-TOG-201 arm verbatim.
      #   help-below-preamble        keeps `help` recognised but moves it back
      #                              under the credential preamble, so `--help`
      #                              on a box with no ~/secure-drop dies with
      #                              "cannot read github-app.pem" instead of
      #                              answering. Only the two --no-creds cases
      #                              can catch that one; delete them and this
      #                              step goes red.
      #   jwt-arm-masks-failure      restores `jwt) app_jwt; echo ;;`, whose
      #                              status is echo's and therefore always 0.
      #   empty-signature-unchecked  drops the `[[ -n "$sig" ]]` guard, leaving
      #                              only the pipeline status. Caught by ONE
      #                              case — the openssl stub that exits 0 having
      #                              written nothing — because pipefail sees
      #                              success down the whole chain. Delete that
      #                              case and this step goes red.
      #   response-body-unvalidated  makes require_field always succeed, so a
      #                              {"message":"Bad credentials"} body renders
      #                              a report full of nulls and `check` reports
      #                              success. Caught by the STDOUT assertion:
      #                              the arm still exits non-zero afterwards,
      #                              by accident, when jq trips over a null.
      - name: Prove the dispatch suite still detects every regression
        run: |
          set -uo pipefail
          rc=0
          base="$(mktemp -d)"
          cp gh_token.sh test_gh_token_dispatch.sh "$base/"
          if ! (cd "$base" && ./test_gh_token_dispatch.sh > out.txt 2>&1); then
            echo "::error::the dispatch suite fails on an UNMUTATED copy in a staging dir; every mutation result below would be unattributable"
            cat "$base/out.txt"
            exit 1
          fi
          echo "baseline: unmutated copy passes in the staging dir"

          # awk, not sed: these lines are full of characters sed reads as
          # syntax, and a mutation that silently does nothing is the one
          # failure mode this step exists to avoid. The chmod is load-bearing —
          # the suite invokes the tool directly, so a rewrite that loses +x
          # makes every case fail with 126 and the mutant looks detected when
          # nothing was tested.
          #
          # Every replacement string stays on ONE line: this is a YAML block
          # scalar, and a continuation line indented less than the block would
          # silently end it and truncate the rest of this step.
          require_anchor() {
            grep -qxF "$2" "$1" && return 0
            echo "::error::could not find the anchor in $1; this guard is now blind, fix it:"
            echo "::error::  $2"
            exit 2
          }
          mutate() { # mutate <file> <before> <after>  — replace the line
            require_anchor "$1" "$2"
            awk -v b="$2" -v a="$3" '$0 == b { print a; next } { print }' \
              "$1" > "$1.mut" && mv "$1.mut" "$1"
            chmod +x "$1"
          }
          insert_above() { # insert_above <file> <anchor> <new-line>
            require_anchor "$1" "$2"
            awk -v b="$2" -v a="$3" '$0 == b { print a } { print }' \
              "$1" > "$1.mut" && mv "$1.mut" "$1"
            chmod +x "$1"
          }

          for m in catchall-exits-zero help-below-preamble jwt-arm-masks-failure \
                   empty-signature-unchecked response-body-unvalidated; do
            mut="$(mktemp -d)"
            cp gh_token.sh test_gh_token_dispatch.sh "$mut/"
            t="$mut/gh_token.sh"
            case "$m" in
              catchall-exits-zero)
                mutate "$t" '  *) refuse_usage "${1:-}" ;;' '  *) usage ;;' ;;
              help-below-preamble)
                mutate "$t" '  help|--help|-h) usage; exit 0 ;;' '  help|--help|-h) : ;;'
                # Put help back as an ordinary arm of the main case, i.e. below
                # the preamble. Without this the mutant merely stops recognising
                # help, which is a different and more obvious bug.
                insert_above "$t" '  check) app_check ;;' '  help|--help|-h) usage ;;' ;;
              jwt-arm-masks-failure)
                mutate "$t" '  jwt)   app_jwt || exit $?; echo ;;' '  jwt)   app_jwt; echo ;;' ;;
              empty-signature-unchecked)
                mutate "$t" '    || { echo "ERROR: signing with $PEM produced an empty signature" >&2; return 1; }' '    || :' ;;
              response-body-unvalidated)
                mutate "$t" '  jq -e "$1" >/dev/null 2>&1 <<<"$2" && return 0' '  return 0' ;;
            esac
            bash -n "$t" || { echo "::error::the '$m' mutant does not parse"; exit 2; }
            if (cd "$mut" && ./test_gh_token_dispatch.sh > out.txt 2>&1); then
              echo "::error::the dispatch suite PASSED against the '$m' mutant"
              cat "$mut/out.txt"; rc=1
            else
              echo "$m: suite correctly reported $(grep -c 'FAIL' "$mut/out.txt") failures"
            fi
          done
          exit $rc

      # Same discipline for the SQL backend seam. Both mutations below are
      # things a reasonable person would actually write; neither is a strawman.
      #
      # 1. Hand the URI to psql instead of decomposing it. This is the obvious
      #    one-liner, and it publishes the database password through
      #    /proc/*/cmdline on a host every company on the box shares.
      # 2. Auto-select the psql backend when DATABASE_URL happens to be set.
      #    This reads as a convenience and silently retargets the PROVISIONER —
      #    which creates and deletes real agents — at whatever that variable
      #    points to.
      #
      # THE COPY LIST IS PART OF THE GUARD, and TOG-300 proved it the hard way.
      # The suite reads every tool it makes assertions about, so a tool missing
      # from this staging directory fails the suite for a STAGING reason. The
      # job then reports "the mutant was correctly detected" — because the
      # suite did fail — while being completely blind to whether the mutation
      # had any effect at all. Adding gh_access.sh and skills.sh to section 10
      # did exactly that, silently, until the baseline below was written.
      # A tool added to test_sql_backend.sh must be added here too.
      - name: Prove the SQL backend suite still detects both unsafe shortcuts
        run: |
          set -uo pipefail
          rc=0
          stage() { # stage <dir> — the suite's full subject list, in one place
            cp -r lib "$1/"
            cp test_sql_backend.sh org_provisioner.sh org_request_queue.sh \
               org_access_review.sh test_privilege_ceilings.sh test_request_queue.sh \
               gh_access.sh skills.sh "$1/"
          }

          # BASELINE FIRST, in the same staging directory the mutants use. Not
          # ceremony: "the mutated suite failed" is unattributable on its own,
          # because a copy that fails for a staging reason fails identically.
          # This is the assertion that says the staging is complete, and it is
          # the one that catches a copy list that has fallen behind the suite.
          base="$(mktemp -d)"; stage "$base"
          if ! "$base/test_sql_backend.sh" > "$base/out.txt" 2>&1; then
            echo "::error::the UNMUTATED suite fails in the staging directory, so this job cannot attribute anything to a mutation. Most likely the copy list above has fallen behind test_sql_backend.sh."
            cat "$base/out.txt"; exit 2
          fi
          echo "baseline: the unmutated suite passes in the staging directory"

          for m in uri-on-argv sniff-database-url; do
            mut="$(mktemp -d)"
            stage "$mut"
            node -e '
              var fs = require("fs");
              var p = process.argv[1], which = process.argv[2];
              var s = fs.readFileSync(p, "utf8");
              var anchor = which === "uri-on-argv"
                ? "\n  psql \\\n"
                : "  local b=\"${PAPERCLIP_SQL_BACKEND:-podman}\"";
              if (s.indexOf(anchor) < 0) {
                console.error("::error::could not find the " + which + " anchor in lib/pcsql.sh; this guard is now blind, fix it");
                process.exit(2);
              }
              var repl = which === "uri-on-argv"
                ? "\n  psql \"$DATABASE_URL\" \\\n"
                : "  local b=\"${PAPERCLIP_SQL_BACKEND:-${DATABASE_URL:+psql}}\"; b=\"${b:-podman}\"";
              fs.writeFileSync(p, s.replace(anchor, repl));
            ' "$mut/lib/pcsql.sh" "$m" || exit 2
            bash -n "$mut/lib/pcsql.sh"
            if "$mut/test_sql_backend.sh" > "$mut/out.txt" 2>&1; then
              echo "::error::the SQL backend suite PASSED against the '$m' mutant"
              cat "$mut/out.txt"; rc=1
            else
              echo "$m: suite correctly reported $(grep -c 'FAIL' "$mut/out.txt") failures"
            fi
          done
          # Without this the job is decorative. `set -e` is deliberately not on
          # (a mutant is EXPECTED to fail its suite), so the block's status is
          # the status of `done` — which is the last `echo`, always 0. rc was
          # being set and then dropped, so a mutation that the suite failed to
          # detect printed ::error:: and left the build green. The sibling
          # dispatch guard above has always had this line; this one did not.
          exit $rc
      # TOG-402. Three mutations, each the tempting simplification rather than
      # invented nonsense, and each one restores a specific undeserved green:
      #
      #   1. binary-check-preflight — replace the SELECT 1 round-trip with
      #      `command -v`. This is what someone reaches for when the preflight
      #      looks slow or noisy. It passes a podman with no paperclip-db
      #      container, so the suite runs anyway and fails halfway through.
      #   2. any-refusal — make refuses_because ignore its reason argument. The
      #      first time a gate's wording is edited and a suite goes red, this is
      #      the one-character-looking fix, and it restores TOG-402 exactly.
      #   3. empty-is-zero — put back `[[ "$left" -eq 0 ]]`. Reads as a harmless
      #      tidy-up; bash scores "" as 0, so the teardown reports a company it
      #      never looked at as clean.
      #
      # The BASELINE below is not ceremony. "The mutated suite failed" is
      # unattributable on its own — a copy that fails for an unrelated staging
      # reason looks identical. So the unmutated copy must pass in the same
      # directory first, and each mutant must go red on a NAMED assertion, not
      # merely somewhere.
      - name: Prove the precondition suite still detects each undeserved green
        run: |
          set -uo pipefail
          rc=0

          base="$(mktemp -d)"
          tar -cf - --exclude=.git . | (cd "$base" && tar -xf -)
          if ! "$base/test_suite_preconditions.sh" > "$base/out.txt" 2>&1; then
            echo "::error::BASELINE FAILED — the unmutated suite does not pass in a staging copy, so every mutant result below is unattributable"
            cat "$base/out.txt"; exit 1
          fi
          echo "baseline: $(grep -c 'PASS' "$base/out.txt") assertions passed in a staging copy"

          for m in binary-check-preflight any-refusal empty-is-zero; do
            mut="$(mktemp -d)"
            tar -cf - --exclude=.git . | (cd "$mut" && tar -xf -)
            anchor2=""; repl2=""
            case "$m" in
              binary-check-preflight)
                # Both conditions, so the mutant ACCEPTS on a bare binary check.
                # Disabling only the round-trip leaves the row check reading an
                # empty $out, which makes preflight refuse EVERYTHING — the
                # opposite mistake, and it reds the positive control instead of
                # the assertion this mutant is meant to expose.
                target="$mut/lib/pcsql.sh"
                anchor='  if ! out="$(pcsql_run -Atq -v ON_ERROR_STOP=1 <<<'"'"'SELECT 1;'"'"' 2>&1)"; then'
                repl='  if false; then'
                anchor2='  if ! grep -qx '"'"'1'"'"' <<<"$out"; then'
                repl2='  if false; then'
                want="accepted an erroring backend" ;;
              any-refusal)
                target="$mut/test_request_queue.sh"
                anchor='  if grep -qF -- "$why" <<<"$o"; then ok "$d"'
                repl='  if true; then ok "$d"'
                want="T0 cannot request a President/COO" ;;
              empty-is-zero)
                # BOTH halves, or the mutant is not the pre-TOG-402 code: gutting
                # qnum alone leaves `[[ "(no result)" -eq 0 ]]`, which trips
                # `set -u` and produces an unrelated red. Restoring the raw read
                # AND the arithmetic comparison is what reinstates the actual
                # false green, because bash scores "" as 0.
                target="$mut/test_request_queue.sh"
                anchor='qnum() { local v; v="$(q "$@")"; [[ "$v" =~ ^[0-9]+$ ]] && printf '"'"'%s'"'"' "$v" || printf '"'"'(no result)'"'"'; }'
                repl='qnum() { q "$@"; }'
                anchor2='if [[ "$left" == "0" ]]; then ok "no TESTQ-provisioned agents remain active"'
                repl2='if [[ "$left" -eq 0 ]]; then ok "no TESTQ-provisioned agents remain active"'
                want="teardown absence claim still passes" ;;
            esac
            # NOTE: $want must appear in the FAILURE text the suite prints, which
            # is the bad() message, not the ok() one. They are deliberately
            # different sentences, so matching the ok() wording here silently
            # makes every mutant read as unattributable.

            for a in "$anchor" "$anchor2"; do
              [[ -n "$a" ]] || continue
              if ! grep -qF -- "$a" "$target"; then
                echo "::error::could not find a '$m' anchor in $target; this guard is now blind, fix it"
                exit 2
              fi
            done
            node -e '
              var fs = require("fs");
              var p = process.argv[1], s = fs.readFileSync(p, "utf8");
              for (var i = 2; i + 1 < process.argv.length; i += 2) {
                var a = process.argv[i], r = process.argv[i + 1];
                if (!a) continue;
                if (s.indexOf(a) < 0) { console.error("::error::anchor vanished: " + a); process.exit(2); }
                s = s.replace(a, r);
              }
              fs.writeFileSync(p, s);
            ' "$target" "$anchor" "$repl" "$anchor2" "$repl2" || exit 2
            bash -n "$target" || { echo "::error::the '$m' mutant does not parse"; exit 2; }

            # empty-is-zero re-mutates a file the previous loop left alone, so
            # each mutant is applied to a fresh copy — never stacked.
            if "$mut/test_suite_preconditions.sh" > "$mut/out.txt" 2>&1; then
              echo "::error::the precondition suite PASSED against the '$m' mutant"
              cat "$mut/out.txt"; rc=1
              continue
            fi
            if grep -qF "FAIL" "$mut/out.txt" && grep -F "FAIL" "$mut/out.txt" | grep -qF -- "$want"; then
              echo "$m: suite correctly went red on its named assertion (\"$want\")"
            else
              echo "::error::the '$m' mutant made the suite fail, but NOT on \"$want\" — the red is unattributable"
              cat "$mut/out.txt"; rc=1
            fi
          done
          exit $rc

      # Same discipline for the CI status reader (TOG-247). Its entire value is
      # the refusal to call an unobserved CI green, so a suite that cannot
      # detect that refusal being weakened is decoration. Both mutations below
      # are the tempting ones, not invented nonsense:
      #
      #   1. Make `unknown` exit 0. This is what someone reaches for the first
      #      time exit 3 breaks a pipeline — and it silently restores the exact
      #      false green, because `if gh_ci_status.sh; then merge` goes green on
      #      a token that was denied.
      #   2. Drop the no-signal guard, so zero results from a readable source
      #      falls through to pass. That is the naive "all runs concluded
      #      success" predicate, which is vacuously true for an empty list.
      #
      # TOG-381 adds the third failure mode and its mutations. A job GitHub
      # never ran reports `completed/failure` — identical to a real red in every
      # field — so an Actions outage was read as "fix your code" for 21 minutes
      # while four commits merged. The `non-started` verdict is what separates
      # them, and each mutation below removes one load-bearing piece of it.
      #
      # This gate used to assert only "the suite failed", which is not
      # attribution: a mutation that reddens some unrelated assertion looks
      # identical to one the gate actually caught, and keeps looking identical
      # after the assertion it was meant to pin has been DELETED. Per TOG-339 /
      # TOG-200 it now requires, for every mutation:
      #
      #   * the UNMUTATED copy passes in the same staging directory, so a red
      #     below is attributable to the mutation rather than to the staging;
      #   * the named test is present and PASSING in that baseline — this suite
      #     has no skip verb, so "present and green before" is its zero-skips
      #     check, and it is what makes deleting the test fail the gate;
      #   * the mutated run goes red ON THAT NAMED TEST, not merely somewhere.
      - name: Prove the CI status suite still detects a weakened refusal
        run: |
          set -uo pipefail
          rc=0
          # ci_mutation <label> <sed-expr> <named test that must go red>
          ci_mutation() {
            local label="$1" expr="$2" expect="$3"
            local mut; mut="$(mktemp -d)"
            cp gh_ci_status.sh test_gh_ci_status.sh "$mut/"
            # The TOG-381 cases are replayed from recorded API responses; without
            # them the suite hard-errors rather than skipping, which is the point.
            mkdir -p "$mut/test/fixtures"
            cp -R test/fixtures/gh_ci_status "$mut/test/fixtures/"

            local base
            base="$(cd "$mut" && ./test_gh_ci_status.sh 2>&1)"
            if [ $? -ne 0 ]; then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              printf '%s\n' "$base" | grep -a 'FAIL' | head -20; rm -rf "$mut"; return 1
            fi
            # Zero-skips equivalent for a suite with no skip verb: the assertion
            # this mutation is aimed at must EXIST and be GREEN before we mutate.
            # Delete the test and the gate fails here instead of reporting success.
            if ! grep -aqE "PASS.*$expect" <<< "$base"; then
              echo "::error::$label: no PASSING test matching /$expect/ in the baseline — the assertion this mutation pins has been renamed or deleted"
              rm -rf "$mut"; return 1
            fi

            sed -i "$expr" "$mut/gh_ci_status.sh"
            if ! bash -n "$mut/gh_ci_status.sh"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            if cmp -s gh_ci_status.sh "$mut/gh_ci_status.sh"; then
              echo "::error::$label: the sed changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi

            local out status
            out="$(cd "$mut" && ./test_gh_ci_status.sh 2>&1)"; status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$label: the CI status suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            if ! grep -aqE "FAIL.*$expect" <<< "$out"; then
              echo "::error::$label: the suite went red, but no test matching /$expect/ failed — it is failing for an unrelated reason, so this mutation is not actually covered"
              grep -a 'FAIL' <<< "$out" | head -20
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          # TOG-247: the two false greens.
          ci_mutation "unknown-exits-zero" 's/EXIT=3/EXIT=0/g' \
            'every source denied -> unknown, not pass' || rc=1
          ci_mutation "no-signal-is-a-pass" 's/^elif \[\[ "\$SIGNALS" -eq 0 \]\]; then/elif false; then/' \
            'readable but zero signals -> unknown, not pass' || rc=1

          # TOG-381: the outage that read as a red build.
          #
          # 1. Delete the verdict outright. This is the shape of the bug as it
          #    shipped, and it is what a revert would produce.
          ci_mutation "nonstart-verdict-removed" \
            's/^elif \[\[ -n "\$CHECKS_NONSTART" \&\& -z "\$CHECKS_FAIL" \&\& -z "\$EXT_FAILED" \]\]; then/elif false; then/' \
            'a recorded account-block outage -> non-started, not fail' || rc=1
          # 2. Keep the classification but fold it back onto exit 1. The verdict
          #    string is then correct and every caller still branches to "fix
          #    your code" — the distinction exists in the exit code or nowhere.
          ci_mutation "nonstart-exits-as-a-red" 's/^  EXIT=5$/  EXIT=1/' \
            'a recorded account-block outage -> non-started, not fail' || rc=1
          # 3. Stop requiring the annotation text, leaving duration to decide.
          #    This is THE tempting simplification — it deletes an API call and
          #    looks right against the outage fixtures — and it misclassifies
          #    every fast genuine red, including our own 2s `bash -n` scan.
          ci_mutation "classified-by-duration-alone" \
            "s/^NONSTART_ANNOTATION_RE=.*/NONSTART_ANNOTATION_RE=''/" \
            'duration is not the classifier' || rc=1
          # 4. Ignore the annotation LEVEL. A successful run carries annotations
          #    too (24f0d30's are Node 20 deprecation warnings), so without the
          #    level check the text alone is a much weaker claim than it reads as.
          ci_mutation "annotation-level-ignored" \
            's/select(.annotation_level == "failure")/select(true)/' \
            'the billing text at warning level does not license non-started' || rc=1
          # 5. Report a probe that never completed as a clean one. The verdict is
          #    still correct here, so only the reporting assertion can catch it —
          #    and a caller that trusts `nonStartedProbe` would be told the
          #    question was asked and answered "no" when it was refused.
          ci_mutation "failed-probe-reads-clean" \
            's/NONSTART_PROBE="incomplete-\$acode"/NONSTART_PROBE="clean"/' \
            'a probe that could not complete says so' || rc=1
          # 6. Let a non-start outrank a genuine failure on the same commit.
          #    Wrong in the UNSAFE direction: there is real code to fix and this
          #    would report exit 5, "nothing here is your fault".
          ci_mutation "nonstart-outranks-a-real-red" \
            's/^elif \[\[ -n "\$CHECKS_NONSTART" \&\& -z "\$CHECKS_FAIL" \&\& -z "\$EXT_FAILED" \]\]; then/elif [[ -n "$CHECKS_NONSTART" ]]; then/' \
            'a real failure alongside non-starts -> fail, not non-started' || rc=1
          # 7. Tighten the duration prefilter to something that looks generous
          #    against the 2-3s fixtures. The recorded outage also contains a
          #    14-SECOND non-start, so a tight window silently stops classifying
          #    — the failure mode that has no symptom until the next outage.
          ci_mutation "prefilter-tightened" \
            's/GH_CI_NONSTART_MAX_SECONDS:-60/GH_CI_NONSTART_MAX_SECONDS:-1/' \
            'a recorded account-block outage -> non-started, not fail' || rc=1
          # 8. Trust the check-run id from the response body. The classification
          #    added a second authenticated call whose PATH contains a value the
          #    remote supplied; an id that is a traversal normalises onto another
          #    run's annotations, so the body gets to choose which annotations
          #    are consulted and can turn a genuine red into "not your fault".
          ci_mutation "check-run-id-trusted" \
            's/^is_check_run_id() {/is_check_run_id() { return 0;/' \
            'a check-run id that is not a number is never put in a request path' || rc=1
          exit $rc

      # Same discipline for the drift detector (TOG-212). Its whole value is
      # noticing that two copies of a tool differ, so a suite that cannot detect
      # that ability being weakened is decoration. All three mutations below are
      # things a reasonable person would actually write:
      #
      #   1. Fingerprint the SIZE instead of the content. This is the obvious
      #      cheap version, and it is blind to exactly the edit that matters —
      #      a changed gate condition that happens to keep the byte count. It is
      #      also the same class of mistake as the test count (114 vs 156) that
      #      TOG-212 was found by: a fingerprint that collides.
      #   2. Make drift exit 0. What someone reaches for the first time exit 3
      #      breaks a pipeline, and it restores the false green wholesale.
      #   3. Fingerprint secret-shaped files too. Reads as removing a special
      #      case; publishes a hash oracle for a credential into whatever issue
      #      the report gets pasted into.
      #
      # Each goes through a BASELINE ASSERTION first: the unmutated copy must
      # pass in the same staging directory. Without that, "the mutated suite
      # failed" is unattributable — which is how two gates in this repo sat
      # vacuous for months before TOG-253 found them.
      - name: Prove the drift suite still detects a weakened detector
        run: |
          set -uo pipefail
          rc=0
          # Third argument is the NAMED test that must go red. A bare "the suite
          # failed" is not attribution: a mutation that reddens some unrelated
          # assertion looks identical to one the gate actually caught, and stays
          # looking identical after the assertion it was meant to pin is
          # deleted. TOG-357 hit exactly that — an empty-fingerprint mutation
          # reddened nothing, because the assertion covering it was being
          # satisfied by the check standing next to it.
          drift_mutation() {
            local label="$1" expr="$2" expect="$3"
            local mut; mut="$(mktemp -d)"
            cp tool_drift.sh test_tool_drift.sh "$mut/"

            if ! (cd "$mut" && ./test_tool_drift.sh >/dev/null 2>&1); then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              (cd "$mut" && ./test_tool_drift.sh 2>&1 | tail -20); rm -rf "$mut"; return 1
            fi

            sed -i "$expr" "$mut/tool_drift.sh"
            if ! bash -n "$mut/tool_drift.sh"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            if cmp -s tool_drift.sh "$mut/tool_drift.sh"; then
              echo "::error::$label: the sed changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi

            local out status
            out="$(cd "$mut" && ./test_tool_drift.sh 2>&1)"; status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$label: the drift suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            if ! grep -aqE "FAIL.*$expect" <<< "$out"; then
              echo "::error::$label: the suite went red, but no test matching /$expect/ failed — it is failing for an unrelated reason, so this mutation is not actually covered"
              grep -a 'FAIL' <<< "$out" | head -20
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          drift_mutation "size-not-content" \
            's|^  { printf .blob %d\\0. "\$len"; cat "\$f"; } . sha1sum . cut -d. . -f1$|  printf "%040d" "$len"|' \
            'disagrees with git hash-object' || rc=1
          drift_mutation "drift-exits-zero"      's/EXIT_DRIFT=3/EXIT_DRIFT=0/' \
            'content change exits 0, want 3' || rc=1
          drift_mutation "secrets-fingerprinted" 's/^is_secretish() {/is_secretish() { return 1;/' \
            'a secret-shaped file was fingerprinted' || rc=1

          # TOG-357. The two coverage-gate mutations. Both restore a comparison
          # that measured the wrong directory reporting itself as clean, which
          # is worse than no detector: it retires the assumption it was supposed
          # to test, in the wrong direction.
          drift_mutation "empty-fp-reads-green" \
            's/if \[ "\$fp_entries" -eq 0 \]; then/if false; then/' \
            'emptiness check is not carrying its own weight' || rc=1
          drift_mutation "no-exec-reads-green" \
            's/if \[ "\$ref_exec" -gt 0 \] \&\& \[ "\$matched_exec" -eq 0 \]; then/if false; then/' \
            'a README made a wrong directory read as clean' || rc=1
          drift_mutation "manifest-includes-nonexec" \
            's/\$2=="blob" \&\& \$1=="100755"/$2=="blob"/' \
            'manifest listed a non-executable doc' || rc=1
          exit $rc

      # TOG-349. The authority gate. Its whole value is drawing a line a content
      # hash cannot draw, and it can fail in BOTH directions: shout at a comment
      # (and get muted, which is a deleted detector), or stay quiet about a
      # changed `auth` (and green-light a privilege escalation at the next
      # activation). Every mutation below is one of those two.
      #
      # Two of these caught real vacuity in the suite while it was being
      # written, and both were the same shape: the test was satisfied by the
      # gate standing NEXT to the one it named. Dropping `auth` from the
      # authority allowlist made the leaf UNCLASSIFIED, which also exits 4, so
      # an exit-code-only assertion stayed green while the field was no longer
      # recognised as authority-bearing at all. The suite now asserts the
      # verdict PAIRED WITH ITS OWN LEAF by adjacency, which is what makes
      # `auth-not-authority` and `pointer-not-authority` below able to go red.
      # A third — `routes-indexed-not-keyed` — was uncoverable because the
      # fixture's route swap was silently a no-op, so the case had been passing
      # without reordering anything.
      - name: Prove the authority gate still detects a weakened comparison
        run: |
          set -uo pipefail
          rc=0
          # Third argument is the NAMED test that must go red. A bare "the suite
          # failed" is not attribution: a mutation that reddens some unrelated
          # assertion looks identical to one the gate actually caught.
          gate_mutation() {
            local label="$1" expr="$2" expect="$3"
            local mut; mut="$(mktemp -d)"
            cp plugin_manifest_gate.sh test_plugin_manifest_gate.sh "$mut/"

            if ! (cd "$mut" && ./test_plugin_manifest_gate.sh >/dev/null 2>&1); then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              (cd "$mut" && ./test_plugin_manifest_gate.sh 2>&1 | tail -20); rm -rf "$mut"; return 1
            fi

            sed -i "$expr" "$mut/plugin_manifest_gate.sh"
            if ! bash -n "$mut/plugin_manifest_gate.sh"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            if cmp -s plugin_manifest_gate.sh "$mut/plugin_manifest_gate.sh"; then
              echo "::error::$label: the sed changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi

            local out status
            out="$(cd "$mut" && ./test_plugin_manifest_gate.sh 2>&1)"; status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$label: the authority suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            if ! grep -aqE "FAIL.*$expect" <<< "$out"; then
              echo "::error::$label: the suite went red, but no test matching /$expect/ failed — it is failing for an unrelated reason, so this mutation is not actually covered"
              grep -a 'FAIL' <<< "$out" | head -20
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          # Quiet about a real escalation.
          gate_mutation "escalation-exits-zero" \
            's/EXIT_ESCALATION=4/EXIT_ESCALATION=0/' \
            'an added capability is an escalation' || rc=1
          gate_mutation "auth-not-authority" \
            's/(routeKey|method|path|auth|capability|checkoutPolicy)/(routeKey|method|path|capability|checkoutPolicy)/' \
            'a changed route auth is an escalation' || rc=1
          gate_mutation "pointer-not-authority" \
            "s|^  '\\^#packageManifestPath\\$'\$|  '^#never-matches-anything$'|" \
            'a repointed package.json manifest is an escalation' || rc=1
          # The allowlist turned into a denylist. This is the slow failure: a
          # future host version honours a new manifest key and the gate keeps
          # printing OK about it because nobody taught it the name.
          gate_mutation "unknown-reads-clean" \
            's/^  echo UNCLASSIFIED$/  echo NONAUTHORITY/' \
            'an unclassified manifest field is an escalation' || rc=1
          # Zero-vs-zero reading as clean.
          gate_mutation "no-authority-leaf-guard" \
            's/if \[ "\$ref_auth" -eq 0 \]; then/if false; then/' \
            'contentless manifests' || rc=1
          # Crying wolf. Both of these turn a reorder into a false ESCALATION,
          # which is how a detector gets muted and then ignored.
          gate_mutation "caps-indexed-not-set" \
            's/node.every((e) => typeof e === "string")/false/' \
            'capability reordering is not a change' || rc=1
          gate_mutation "routes-indexed-not-keyed" \
            's/typeof e.routeKey === "string"/false/' \
            'route reordering is not a change' || rc=1
          # Narrowing scored as escalation — the other way to cry wolf.
          gate_mutation "narrowing-scored-as-escalation" \
            's/verdict="NARROWING   removed"/verdict="ESCALATION  removed"/' \
            'a removed capability is narrowing' || rc=1
          exit $rc

      # TOG-358. The preflight's whole job is to refuse to say "ok" about an
      # endpoint it could not actually use. Each mutation below reintroduces one
      # specific way of saying ok anyway. `unreachable-reads-ok` is the one that
      # matters most: it is the exact shape of the failure this tool was written
      # for — :20129 answers a TCP reset from inside a container, and a gate that
      # scores that as a pass green-lights a company-wide outage.
      #
      # Baseline first, as everywhere else here: the unmutated copy must pass in
      # the same staging directory, or a red below is unattributable.
      - name: Prove the preflight suite still detects a weakened refusal
        run: |
          set -uo pipefail
          rc=0
          preflight_mutation() {
            local label="$1"; shift
            local mut; mut="$(mktemp -d)"
            cp agent_endpoint_preflight.sh test_agent_endpoint_preflight.sh "$mut/"

            if ! (cd "$mut" && ./test_agent_endpoint_preflight.sh >/dev/null 2>&1); then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              (cd "$mut" && ./test_agent_endpoint_preflight.sh 2>&1 | tail -25); rm -rf "$mut"; return 1
            fi

            local e
            for e in "$@"; do sed -i "$e" "$mut/agent_endpoint_preflight.sh"; done
            if cmp -s agent_endpoint_preflight.sh "$mut/agent_endpoint_preflight.sh"; then
              echo "::error::$label: the sed changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi
            if ! bash -n "$mut/agent_endpoint_preflight.sh"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            if (cd "$mut" && ./test_agent_endpoint_preflight.sh >/dev/null 2>&1); then
              echo "::error::$label: the preflight suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          # A refused connection scored as a pass — the outage green-light.
          preflight_mutation "unreachable-reads-ok" \
            's/verdict "unreachable" 5/verdict "unreachable" 0/g' || rc=1
          # A hung endpoint folded into "reachable enough".
          preflight_mutation "hang-reads-ok" \
            's/verdict "timeout" 6/verdict "timeout" 0/' || rc=1
          # A route can inject both field names as zero and still carry no
          # accounting. Defeat the positive cache-write gate; the zero-cache
          # case must then make the suite red.
          preflight_mutation "cache-creation-check-deleted" \
            's/"\$CACHE_CREATE" -le 0/"$CACHE_CREATE" -le -1/' || rc=1
          # A positive write alone is also insufficient. Defeat the identical
          # replay's positive-read gate; the write-only case must make it red.
          preflight_mutation "cache-replay-check-deleted" \
            's/"\$CACHE_REPLAY_READ" -le 0/"$CACHE_REPLAY_READ" -le -1/' || rc=1
          # Billing per token while the subscriptions idle, reported as fine.
          preflight_mutation "payg-not-flagged" \
            's/^\[\[ "\$RESP_ID" == gen-\* \]\]/[[ "$RESP_ID" == nevermatch-* ]]/' \
            's|^\[\[ "\$RESP_MODEL" == \*/\* \]\]|[[ "$RESP_MODEL" == *@@@* ]]|' || rc=1
          # An OpenAI-dialect body accepted as an Anthropic envelope.
          preflight_mutation "wrong-dialect-accepted" \
            's/^  anthropic) ;;$/  anthropic|openai|error|*) ;;/' || rc=1
          # The property that keeps CLIProxy from IP-banning the host: one
          # request, ever. This mutation adds a second probe call.
          preflight_mutation "retries-on-auth-failure" \
            's|^CURL_EXIT=0$|curl -sS -o /dev/null -H "@$HDRS" -d "$REQ" --max-time "$TIMEOUT" "$BASE/v1/messages" >/dev/null 2>\&1\nCURL_EXIT=0|' || rc=1
          # TOG-361. A live endpoint whose model lane is dead, scored as a pass.
          preflight_mutation "dead-model-lane-reads-ok" \
            's/verdict "model-unavailable" 8/verdict "model-unavailable" 0/' || rc=1
          # Collapse the classification back into a generic timeout. Both values
          # are non-zero, so a merge gate would miss this wrong diagnosis.
          preflight_mutation "model-lane-reads-as-outage" \
            's/if \[\[ "\$CCODE" == 200 \]\]; then/if [[ "$CCODE" == 999 ]]; then/' || rc=1
          # TOG-358. The subscription lane answers Claude Code clients, not a
          # bare curl. Silently losing the default identity makes a healthy lane
          # read as a hang.
          preflight_mutation "client-identity-not-sent" \
            's/^CLIENT_IDENTITY=1$/CLIENT_IDENTITY=0/' || rc=1
          # OmniRoute's combo validator manufactures a 502 below 16 output
          # tokens, before the selected upstream runs. A one-token probe cannot
          # distinguish that validator from a broken route.
          preflight_mutation "combo-output-budget-too-small" \
            's/"max_tokens":16/"max_tokens":1/g' || rc=1
          exit $rc

      # TOG-425. This watcher answers a question that expires: the evidence for
      # whether teamclaude rotates off a spent account exists only while the
      # pacer feed still holds an exhaustion episode. A watcher that quietly
      # reports the wrong answer is therefore not merely wrong, it is
      # unfalsifiable later.
      #
      # `verdict-from-is_current` is the mutation that matters. TOG-425 as
      # written asked for exactly that field, and it was MEASURED pointing at
      # the idle account for an hour on 2026-08-24 while the other account
      # burned 0.28 -> 0.38. The first version of the suite passed against this
      # mutation, because in that fixture burn and is_current happened to agree;
      # the case now pins a feed where they contradict each other. Keep it.
      #
      # Baseline first, as everywhere else here: the unmutated copy must pass in
      # the same staging directory, or a red below is unattributable.
      - name: Prove the rotation watcher still detects a wrong verdict
        run: |
          set -uo pipefail
          rc=0
          rotation_mutation() {
            local label="$1"; shift
            local mut; mut="$(mktemp -d)"
            cp quota_rotation_watch.py test_quota_rotation_watch.sh "$mut/"

            if ! (cd "$mut" && ./test_quota_rotation_watch.sh >/dev/null 2>&1); then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              (cd "$mut" && ./test_quota_rotation_watch.sh 2>&1 | tail -25); rm -rf "$mut"; return 1
            fi

            # Each mutation is "old<US>new" — a literal 0x1f separator, so the
            # patterns can carry newlines and quotes without escaping. Done with
            # `python3 -c` and NOT a heredoc on purpose: a heredoc terminator has
            # to sit at column 0, which would close this YAML block scalar early
            # and silently truncate the step.
            local e
            for e in "$@"; do
              python3 -c 'import sys; p, ex = sys.argv[1], sys.argv[2]; o, n = ex.split("\x1f", 1); s = open(p).read(); open(p, "w").write(s.replace(o, n))' "$mut/quota_rotation_watch.py" "$e"
            done
            if cmp -s quota_rotation_watch.py "$mut/quota_rotation_watch.py"; then
              echo "::error::$label: the edit changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi
            if ! python3 -m py_compile "$mut/quota_rotation_watch.py"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            if (cd "$mut" && ./test_quota_rotation_watch.sh >/dev/null 2>&1); then
              echo "::error::$label: the rotation suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          # The lying field: decide rotation from is_current instead of burn.
          rotation_mutation "verdict-from-is_current" \
            "$(printf '    elif best > epsilon:\n        verdict = "ROTATED"\x1f    elif not (samples[hi]["accounts"].get(spent) or {}).get("is_current"):\n        verdict = "ROTATED"')" || rc=1
          # Watching OUR pause gate and calling it teamclaude's rotation.
          rotation_mutation "threshold-is-our-gate" \
            "$(printf 'SWITCH_THRESHOLD = 0.98\x1fSWITCH_THRESHOLD = 0.95')" || rc=1
          # Measured nothing, reported success — the failure this repo exists for.
          rotation_mutation "nothing-observed-reads-green" \
            "$(printf 'overall, code = "NOT_OBSERVED", 4\x1foverall, code = "ROTATED", 0')" || rc=1
          # An idle fleet counted as proof that rotation works.
          rotation_mutation "idle-counts-as-rotation" \
            "$(printf 'verdict = "INCONCLUSIVE_IDLE"\x1fverdict = "ROTATED"')" || rc=1
          # A null bucket splits one episode into two undersized halves.
          rotation_mutation "null-breaks-episode" \
            "$(printf '        if val is None:\n            continue\x1f        if val is None:\n            val = 0.0')" || rc=1
          # Burn measured across the whole feed instead of within the episode.
          rotation_mutation "delta-spans-whole-feed" \
            "$(printf 'spent_d = weekly_delta(samples, lo, hi, spent)\x1fspent_d = weekly_delta(samples, 0, len(samples)-1, spent)')" || rc=1
          exit $rc

      # TOG-440. The brake's INPUT, which is the half TOG-419 got right in
      # mechanism and wrong in measurement. Every mutation below is the shortest
      # path back to a shipped defect, and each names the test that must go red
      # — a bare "the suite failed" is not attribution, and §6's four exit-5
      # gates already proved in this repo that an exit-code-only assertion can
      # be satisfied by the gate standing next to the one being tested.
      - name: Prove the brake still derives its burn rather than reading it
        run: |
          set -uo pipefail
          rc=0
          brake_mutation() {
            local label="$1" expect="$2"; shift 2
            local mut; mut="$(mktemp -d)"
            cp quota_brake.sh test_quota_brake.sh quota_brake_exempt.txt "$mut/"

            # Baseline first. Without it "the mutated suite failed" is
            # unattributable, which is how two gates in this repo sat vacuous
            # for months before TOG-253 found them.
            if ! (cd "$mut" && ./test_quota_brake.sh >/dev/null 2>&1); then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              (cd "$mut" && ./test_quota_brake.sh 2>&1 | tail -25); rm -rf "$mut"; return 1
            fi

            # "old<US>new" with a literal 0x1f separator, applied by python3 -c
            # and NOT a heredoc: a heredoc terminator has to sit at column 0,
            # which closes this YAML block scalar early and silently truncates
            # the step. Same reason as the rotation gate above.
            local e
            for e in "$@"; do
              python3 -c 'import sys; p, ex = sys.argv[1], sys.argv[2]; o, n = ex.split("\x1f", 1); s = open(p).read(); open(p, "w").write(s.replace(o, n))' "$mut/quota_brake.sh" "$e"
            done
            if cmp -s quota_brake.sh "$mut/quota_brake.sh"; then
              echo "::error::$label: the edit changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi
            if ! bash -n "$mut/quota_brake.sh"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            local out status
            out="$(cd "$mut" && ./test_quota_brake.sh 2>&1)"; status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$label: the brake suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            if ! grep -aqE "FAIL.*$expect" <<< "$out"; then
              echo "::error::$label: the suite went red, but no test matching /$expect/ failed — it is failing for an unrelated reason, so this mutation is not actually covered"
              grep -a 'FAIL' <<< "$out" | head -20
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          # 1. THE REVERT. Read the producer's field instead of the derived
          #    rate. This is precisely what shipped in #65, and it is what
          #    anyone reaches for who finds the jq hard to follow. On an idle
          #    account it selects LEVEL3 — concurrency 1 across the roster while
          #    nothing is burning.
          brake_mutation "burn-read-not-derived" 'RELEASES instead of flooring' \
            "$(printf '( if $d.source == "derived" then $d.burn else $acc.burn_per_day end ) as $burn\x1f( $acc.burn_per_day // $d.burn ) as $burn')" || rc=1
          # 2. THE SILENT FALLBACK. Keep the derivation, delete the label. The
          #    plan is then identical whether it was measured or estimated,
          #    which is the state TOG-440 exists to end: an estimate that reads
          #    as a measurement is worse than a loud estimate.
          brake_mutation "fallback-is-silent" 'warns that this was not measured' \
            "$(printf 'if [[ "$source" != "derived" ]]; then\x1fif false; then')" || rc=1
          # 3. --require-derived NEUTERED. The monitor path's only hard gate.
          brake_mutation "require-derived-is-a-noop" 'require-derived on a fallback is exit 5' \
            "$(printf 'if [[ -n "$PACE_REQUIRE_DERIVED" || "$require_derived" == yes ]]; then\x1fif false; then')" || rc=1
          # 4. RESET TRUNCATION REMOVED. A window spanning the weekly reset then
          #    derives a large negative rate, clamps to 0 and RELEASES the brake
          #    at the exact moment a fresh week's quota is all in front of you.
          brake_mutation "reset-not-truncated" 'spanning a reset derives from the NEW week only' \
            "$(printf '| select($series[.].weekly < ($series[. - 1].weekly - $rd)) ] | last // 0 ) as $floor\x1f| select(false) ] | last // 0 ) as $floor')" || rc=1
          # 5. THE NEGATIVE CLAMP REMOVED. `weekly` is rounded to 0.01, so a
          #    flat account steps -0.01 and derives a negative burn — which
          #    beats every positive account in max_by and reports the pool as
          #    healthier than its worst member.
          brake_mutation "negative-burn-allowed" 'rounding step clamps to zero burn' \
            "$(printf 'burn: ( [ 0, (($end.weekly - $start.weekly) / $dt_days) ] | max ),\x1fburn: (($end.weekly - $start.weekly) / $dt_days),')" || rc=1
          # 6. THE MINIMUM WINDOW REMOVED. Any two adjacent samples are then
          #    "derived", and at a 15-minute gap the 0.01 quantum is +/-0.96/day
          #    — 32x sustainable. That is not a measurement, it is the reported
          #    field's instability re-created in our own code.
          brake_mutation "min-window-ignored" 'cannot derive; it falls back' \
            "$(printf 'elif (($dt_days * 24) < $mw) then\x1felif false then')" || rc=1
          # 7. TOG-490. THE TARGET QUIETLY REVERTED. `1 - PACE_TARGET` is a
          #    RESERVE sized against the brake's own reaction lag (~15 min of
          #    producer cadence, plus the drain of runs already in flight), not
          #    a decision to leave 10% of a subscription unspent — cap_for()
          #    never exceeds the captured baseline, so this knob can only lower
          #    consumption, never raise it. That makes 0.90 read like a mistake
          #    to anyone who has not read the header, and it is one character
          #    from being "corrected" back. §10 measures the default through the
          #    tool's own arithmetic rather than by grepping for the literal.
          brake_mutation "pace-target-reverted" 'the DEFAULT target computes sustainable at 0.90' \
            "$(printf 'PACE_TARGET="${PACE_TARGET:-0.90}"\x1fPACE_TARGET="${PACE_TARGET:-0.97}"')" || rc=1
          # 8. TOG-490. THE PASSED-TARGET PIN REMOVED. Once `weekly` passes the
          #    target `sustainable` goes NEGATIVE, and a bare burn/need is then
          #    negative too — which sails under the ladder's `ratio <= 1.0` rung
          #    and RELEASES the brake on an already-overspent week. At 0.90 that
          #    is a routine late-week reading rather than a corner case: both
          #    accounts were past it on 2026-08-25.
          brake_mutation "passed-target-releases" 'selects LEVEL3' \
            "$(printf 'ratio: (if $need <= 0 then 999 else ($burn / $need) end),\x1fratio: ($burn / $need),')" || rc=1
          exit $rc

      # TOG-345. The sibling guard's whole value is the THIRD exit state. Two
      # states — found / not found — is what the losing run on TOG-258 had, and
      # it reported "not found" from two signals that carry no information in
      # this container. Every mutation below reintroduces one way of collapsing
      # that back to two, or of making the guard so noisy it gets skipped, and
      # each names the assertion that must go red — a bare "the suite failed" is
      # not attribution.
      #
      # `blind-reads-clear` is the one that matters: it is the original defect
      # exactly, moved into a script where it would be trusted rather than
      # doubted. `any-live-run-is-a-sibling` is the opposite failure and just as
      # fatal in practice — measured 2026-08-25, /api/issues/{id}/runs is NOT
      # issue-exclusive (a run holding the shared workspace's environment lease
      # shows up on every issue in the company), so without the agentId filter
      # the guard fires everywhere and nobody runs it twice.
      - name: Prove the sibling guard still detects each undeserved green
        run: |
          set -uo pipefail
          rc=0
          sibling_mutation() {
            local label="$1" expect="$2"; shift 2
            local mut; mut="$(mktemp -d)"
            cp sibling_guard.sh test_sibling_guard.sh "$mut/"

            # Baseline first. Without it "the mutated suite failed" is
            # unattributable, which is how two gates in this repo sat vacuous
            # for months before TOG-253 found them.
            if ! (cd "$mut" && ./test_sibling_guard.sh >/dev/null 2>&1); then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              (cd "$mut" && ./test_sibling_guard.sh 2>&1 | tail -25); rm -rf "$mut"; return 1
            fi

            local e
            for e in "$@"; do sed -i "$e" "$mut/sibling_guard.sh"; done
            if cmp -s sibling_guard.sh "$mut/sibling_guard.sh"; then
              echo "::error::$label: the edit changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi
            if ! bash -n "$mut/sibling_guard.sh"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            local out status
            out="$(cd "$mut" && ./test_sibling_guard.sh 2>&1)"; status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$label: the sibling guard suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            if ! grep -aqE "FAIL.*$expect" <<< "$out"; then
              echo "::error::$label: the suite went red, but no test matching /$expect/ failed — it is failing for an unrelated reason, so this mutation is not actually covered"
              grep -a 'FAIL' <<< "$out" | head -20
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          # 1. THE ORIGINAL DEFECT. A detector that could not run scored as a
          #    pass. This is `ps` returning nothing, in a script.
          sibling_mutation "blind-reads-clear" 'missing PAPERCLIP_API_KEY exits 3, not 0' \
            's/VERDICT="indeterminate"; CODE=3/VERDICT="indeterminate"; CODE=0/' || rc=1
          # 2. A found sibling downgraded to "inconclusive" because something
          #    else was blind. Exit 3 reads as "try again", and try-again is a
          #    push.
          sibling_mutation "blindness-outranks-a-finding" 'sibling found while another detector is blind still exits 1' \
            's/^if \[\[ "${#FINDINGS\[@\]}" -gt 0 \]\]; then VERDICT="sibling"; CODE=1; fi$/if [[ "${#FINDINGS[@]}" -gt 0 ]]; then VERDICT="sibling"; CODE=1; fi; if [[ "${#BLIND[@]}" -gt 0 ]]; then VERDICT="indeterminate"; CODE=3; fi/' || rc=1
          # 3. The agentId filter dropped: fires on the workspace-lease row,
          #    i.e. on every issue in the company, i.e. gets turned off.
          sibling_mutation "any-live-run-is-a-sibling" 'live run on my issue is not a sibling verdict' \
            's/const kind = (r.agentId === myAgent) ? "SIBLING" : "FOREIGN"/const kind = "SIBLING"/' || rc=1
          # 4. History counted as a sibling. A cancelled row carries a null
          #    finishedAt, so "not finished" alone is not the liveness test.
          sibling_mutation "terminal-status-ignored" 'terminal status with a null finishedAt is not a sibling' \
            's/const TERMINAL = new Set(\[[^]]*\])/const TERMINAL = new Set([])/' || rc=1
          # 5. The already-landed test run at start, where HEAD sits on
          #    origin/main by definition. Fires on everything; gets skipped.
          sibling_mutation "ancestor-test-at-start" 'at start, a HEAD sitting on origin/main is not already-landed' \
            's/^  if \[\[ "$PHASE" == "prepush" \]\]; then$/  if true; then/' || rc=1
          exit $rc

      # Mutation: restore the pre-TOG-238 OR, where ANY non-empty scope satisfied
      # strict mode. That is the tempting simplification here — it reads as
      # "something was requested, so this is scoped" — and it silently reinstates
      # a token spanning every repo in the installation while GH_APP_SCOPE_STRICT=1
      # keeps reporting least-privilege. Mutating strictGaps() rather than its
      # callers reproduces the original semantics at every call site at once.
      - name: Prove the suite still detects a permissions-only scope passing strict mode
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp gh-app-token.js test_gh_app_token.sh "$mut/"
          node -e '
            var fs = require("fs");
            var p = process.argv[1];
            var s = fs.readFileSync(p, "utf8");
            var anchor = "function strictGaps(scope) {";
            if (s.indexOf(anchor) < 0) {
              console.error("::error::could not find strictGaps() to mutate; this guard is now blind, fix it");
              process.exit(2);
            }
            fs.writeFileSync(p, s.replace(anchor, anchor + "\n  if (Object.keys(scope).length > 0) return [];"));
          ' "$mut/gh-app-token.js"
          node --check "$mut/gh-app-token.js"
          if "$mut/test_gh_app_token.sh" > "$mut/out.txt" 2>&1; then
            echo "::error::the suite PASSED with strict mode satisfied by permissions alone (TOG-238 regression)"
            cat "$mut/out.txt"
            exit 1
          fi
          grep -c 'FAIL' "$mut/out.txt" | xargs -I{} echo "suite correctly reported {} failures against the strict-mode mutant"

      # The second TOG-238 mutation, and the subtler one. Strict mode gates the
      # PEM path, so `SOURCE === 'pem'` reads as a correct, even careful,
      # narrowing — the broker bounds scope server-side, why gate it? Because
      # the DEFAULT is `auto`, which falls back to the PEM on a retryable broker
      # failure. Under that spelling a broker outage silently turns the control
      # off on the one path that mints a ceiling token. This is not a strawman:
      # it is the exact line the TOG-226 merge produced, caught by this suite.
      - name: Prove the suite still detects strict mode gated on the wrong source
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp gh-app-token.js test_gh_app_token.sh "$mut/"
          before="  if (enforce && SOURCE !== 'broker') assertStrictForPem(scope)"
          after="  if (enforce && SOURCE === 'pem') assertStrictForPem(scope)"
          if ! grep -qxF "$before" "$mut/gh-app-token.js"; then
            echo "::error::could not find the strict-mode source gate to mutate; this guard is now blind, fix it"
            exit 2
          fi
          awk -v b="$before" -v a="$after" '$0 == b { print a; next } { print }' \
            "$mut/gh-app-token.js" > "$mut/mut.js" && mv "$mut/mut.js" "$mut/gh-app-token.js"
          chmod +x "$mut/gh-app-token.js"
          node --check "$mut/gh-app-token.js"
          if "$mut/test_gh_app_token.sh" > "$mut/out.txt" 2>&1; then
            echo "::error::the suite PASSED with strict mode gated on GH_APP_TOKEN_SOURCE === 'pem', which exempts the auto fallback (TOG-238)"
            cat "$mut/out.txt"
            exit 1
          fi
          grep -c 'FAIL' "$mut/out.txt" | xargs -I{} echo "suite correctly reported {} failures against the source-gate mutant"

      # TOG-356 mutation guard, with a BASELINE and NAMED expected failures.
      #
      # Three rungs, because the first two have both been passed vacuously in
      # this repo before:
      #
      #   1. BASELINE — the unmutated copy must pass in the same staging dir.
      #      Without it, a staging dir that breaks the suite for an unrelated
      #      reason (a lost +x, a missing sibling) produces the same red as a
      #      working detector, and "the mutant failed" is unattributable.
      #   2. THE NAMED TEST MUST EXIST — each expected-red assertion has to be
      #      present as a PASS in the baseline output before it is allowed to
      #      count as a FAIL after. Rung 1 alone is satisfied by DELETING the
      #      assertion: the baseline still passes, the mutant still fails (for
      #      some other reason), and the gate reports success while the thing
      #      it guards is gone.
      #   3. THE NAMED TEST MUST GO RED — not merely "the suite failed". A
      #      mutation that breaks the tool in some unrelated way also fails the
      #      suite, and would otherwise be indistinguishable from the detector
      #      catching the regression it was written for.
      #
      # Every mutation below is something a reasonable person would actually
      # write. None is a strawman.
      - name: Prove the channel suite still detects each way to blind it
        run: |
          set -uo pipefail
          rc=0

          stage() { cp channel_drift.sh test_channel_drift.sh "$1/"; chmod +x "$1"/*.sh; }

          # The suite colours its PASS/FAIL markers, so the raw line is
          # "  <ESC>[32mPASS<ESC>[0m  <name>" and a literal grep for "PASS  x"
          # never matches. Strip the escapes before any assertion reads them —
          # NOT by loosening the greps, which would let "PASS" anywhere on the
          # line satisfy a check meant to be about one named assertion.
          plain() { sed -e 's/\x1b\[[0-9;]*m//g' "$1"; }

          # chan_mutation_check <label> <before-line> <after-line> <expected-red-test>...
          chan_mutation_check() {
            local label="$1" before="$2" after="$3"; shift 3
            local mut; mut="$(mktemp -d)"; stage "$mut"

            # Rung 1: baseline.
            if ! (cd "$mut" && ./test_channel_drift.sh > base.txt 2>&1); then
              echo "::error::$label: the UNMUTATED suite already fails in the staging dir; this gate proves nothing"
              cat "$mut/base.txt"; rm -rf "$mut"; return 1
            fi
            # ...and a baseline with no assertions in it is not a baseline.
            local npass; npass="$(plain "$mut/base.txt" | grep -c 'PASS' || true)"
            if [ "${npass:-0}" -lt 10 ]; then
              echo "::error::$label: the baseline reports only ${npass:-0} passing assertions; the suite has been gutted"
              cat "$mut/base.txt"; rm -rf "$mut"; return 1
            fi

            # Rung 2: the assertions this mutation is supposed to trip must be
            # THERE, and green, before the mutation is applied.
            local t
            for t in "$@"; do
              if ! plain "$mut/base.txt" | grep -qF "PASS  $t"; then
                echo "::error::$label: the baseline has no PASSING assertion named '$t' — it was renamed or deleted, and this guard is now blind"
                cat "$mut/base.txt"; rm -rf "$mut"; return 1
              fi
            done

            # awk on an exact line, not sed: these anchors are full of
            # characters sed reads as syntax, and a mutation that silently does
            # nothing is the single failure mode this step exists to avoid.
            if ! grep -qxF "$before" "$mut/channel_drift.sh"; then
              echo "::error::$label: could not find the anchor line in channel_drift.sh; the code moved and this guard is now blind, fix it"
              rm -rf "$mut"; return 1
            fi
            awk -v b="$before" -v a="$after" '$0 == b { print a; next } { print }' \
              "$mut/channel_drift.sh" > "$mut/m" && mv "$mut/m" "$mut/channel_drift.sh"
            chmod +x "$mut/channel_drift.sh"
            if ! bash -n "$mut/channel_drift.sh"; then
              echo "::error::$label: the mutant does not parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            if cmp -s channel_drift.sh "$mut/channel_drift.sh"; then
              echo "::error::$label: the mutation changed nothing"
              rm -rf "$mut"; return 1
            fi

            # Rung 3: the suite must fail, AND on the named assertions.
            if (cd "$mut" && ./test_channel_drift.sh > out.txt 2>&1); then
              echo "::error::$label: test_channel_drift.sh PASSED against the mutant"
              cat "$mut/out.txt"; rm -rf "$mut"; return 1
            fi
            for t in "$@"; do
              if ! plain "$mut/out.txt" | grep -qF "FAIL  $t"; then
                echo "::error::$label: the suite went red, but NOT on '$t' — the red is not attributable to this mutation"
                cat "$mut/out.txt"; rm -rf "$mut"; return 1
              fi
            done
            rm -rf "$mut"
            echo "  ok  $label"
          }

          # 1. Regress into tool_drift.sh's path matching. This is the change
          #    TOG-356 originally proposed ("point tool_drift.sh compare at the
          #    channel"), and it is wrong in both directions at once: it passes
          #    a tampered file that kept its name, and it fails a compliant drop
          #    the repo has since renamed. The whole reason this tool exists is
          #    that it matches on content.
          chan_mutation_check "match-on-path-not-content" \
            '    if [ -n "${BY_HASH[$hash]:-}" ]; then' \
            '    if [ -n "${BY_BASE[$(strip_prefix "$base")]:-}" ]; then' \
            'a renamed drop matching a blob at another path passes' \
            'a same-size, different-content drop fails' || rc=1

          # 2. Drop the shebang test from the runnable classifier, keeping the
          #    exec bit and the extension list. Reads as a simplification. It
          #    means anything named like evidence is never checked, and
          #    `bash TOG-nnn-findings.md` still runs it.
          chan_mutation_check "shebang-test-removed" \
            "  case \"\$(head -c 2 \"\$f\" 2>/dev/null)\" in '#!') return 0 ;; esac" \
            '  :' \
            'a shebang alone makes a file runnable, whatever it is named' || rc=1

          # 3. Honour an exemption that states no reason instead of refusing.
          #    The tempting lenient default, and it turns the exemption file
          #    into a mute button: one line, no explanation, detector silenced.
          chan_mutation_check "unreasoned-exemption-honoured" \
            '        die "$exempt:$lineno: exemption for '"'"'$name'"'"' has no reason (want '"'"'<basename><TAB><reason>'"'"')"' \
            '        reason="(unspecified)"' \
            'an exemption with no reason is REFUSED, not honoured' || rc=1

          # 4. Demote STALE to a warning, failing only on UNVERSIONED. Reads as
          #    noise reduction. STALE is the case where a mirror STOPPED
          #    mirroring — a file the operator installed from, edited in place
          #    or swapped, and it is strictly more dangerous than one that was
          #    never imported, because it looks reviewed.
          chan_mutation_check "stale-demoted-to-warning" \
            '  if [ "$unver" -gt 0 ] || [ "$stale" -gt 0 ]; then' \
            '  if [ "$unver" -gt 0 ]; then' \
            'a same-size, different-content drop fails' || rc=1

          # 5. Treat an ABSENT required mirror as nothing to report (TOG-373).
          #    The most tempting of the five: the suite right above it asserts
          #    that "an exemption for an absent file is inert", so skipping a
          #    file that is not there reads as the consistent behaviour. It is
          #    the exact opposite for a required mirror — absence IS the
          #    finding, and it is the state the channel is in until the
          #    operator installs the README. This mutation makes the one thing
          #    TOG-373 exists to detect report clean.
          chan_mutation_check "absent-required-mirror-ignored" \
            '      missing=$((missing+1)); L_MISSING+=("$rbase  (want the bytes of $rpath)")' \
            '      :' \
            'a MISSING required mirror fails' \
            'the report names absence as its own category' || rc=1

          # 6. Check a required mirror by PRESENCE rather than content. The
          #    same defect as mutation 1, on the path where it matters most:
          #    the README is the file whose entire content is the byte-for-byte
          #    rule, so "a README is installed" is precisely the assurance that
          #    is worth nothing. A truncated or hand-retyped copy passes.
          chan_mutation_check "required-mirror-matched-on-presence" \
            '    if [ "$hash" = "${REQUIRED_HASH[$rbase]}" ]; then' \
            '    if [ -f "$rf" ]; then' \
            'a required mirror whose bytes are not the committed blob fails' \
            'a tampered required mirror is not reported as UNVERSIONED' || rc=1

          # 7. Downgrade the missing-canonical-blob REFUSAL to a skip. TOG-357's
          #    lesson, on this table: a comparison that did not happen must not
          #    read as an answer. Renaming handoff-channel-README.md in the repo
          #    without updating REQUIRED_MIRRORS would then silently stop
          #    checking the README, and the run would go green having measured
          #    nothing — the failure mode that is worse than a red.
          chan_mutation_check "missing-canonical-blob-skipped-not-refused" \
            '      || die "required mirror source is not on $ref: $rpath (the table in $ME names a file this ref does not have; fix the table, do not delete the entry)"' \
            '      || continue' \
            'a ref with no canonical blob REFUSES rather than passing or failing' || rc=1

          exit $rc

  # ---------------------------------------------------------------------------
  # The gh-token-broker plugin suite (TOG-213 / TOG-174).
  #
  # Separate job, not a step on `offline-suites`, for two reasons that are not
  # stylistic: it needs a different Node major (see below), and it is the only
  # thing in this repo with npm dependencies. Keeping it apart means a registry
  # hiccup cannot turn the shell suites red, and the two failures read
  # differently in the checks list instead of as one opaque "CI failed".
  #
  # Like every other suite here, this one is gated on EXIT STATUS and never on a
  # test count. See the header.
  broker-suite:
    name: gh-token-broker suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/gh-token-broker
    steps:
      - uses: actions/checkout@v4

      # Node 24, deliberately, while the job above pins 20. This suite is written
      # against the runtime the Paperclip instance actually executes the plugin
      # on, and `node --test` semantics have moved between those majors. Testing
      # the broker on a Node the host does not run would be testing the wrong
      # thing.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/gh-token-broker/package-lock.json

      # --ignore-scripts: nothing in this dependency tree should be running
      # lifecycle scripts on a runner that has a checkout of credential tooling
      # sitting next to it. It is three packages with no build step; if this flag
      # ever starts breaking the install, that is a fact worth stopping on rather
      # than a flag worth removing.
      #
      # --include=dev is NOT redundant, however much it looks it. Both packages
      # are devDependencies (the host supplies plugin-sdk at runtime; shared is
      # test-only), and npm silently implies --omit=dev whenever NODE_ENV is
      # `production`. The Paperclip instance sets exactly that, so `npm ci` there
      # installs NOTHING, exits 0, prints "up to date", and every test then fails
      # ERR_MODULE_NOT_FOUND. A green install step followed by an unexplained
      # module error is a bad afternoon; the flag makes it impossible.
      - name: Install pinned host packages
        run: npm ci --include=dev --ignore-scripts

      # Guard the above rather than trusting it. If the install silently no-ops
      # again, fail HERE with the reason, not 40 lines later as a module error.
      - name: Verify the install actually landed
        run: |
          set -euo pipefail
          for p in @paperclipai/shared @paperclipai/plugin-sdk; do
            [ -d "node_modules/$p" ] || {
              echo "::error::$p is missing after npm ci — dev dependencies were omitted (NODE_ENV=${NODE_ENV:-unset})"
              exit 1
            }
          done
          echo "install ok: both host packages present"

      # Pass the FILE, not the directory. `node --test test/` resolves `test` as
      # a module specifier on Node 24 and dies with one MODULE_NOT_FOUND before
      # running anything — which looks precisely like a broken suite and is not.
      # `npm test` in package.json passes the file for this reason; it is invoked
      # here rather than open-coded so the two cannot drift apart.
      - name: Broker suite
        run: npm test

      # No credential, no network, no host: the suite fabricates its own RSA key
      # and stubs every outbound call. Anything that starts reaching the real
      # GitHub API from CI is a regression in the suite's isolation, not a
      # networking problem to be fixed by opening the runner up.
      #   This asserts that property instead of trusting it: the private key the
      # broker signs with must never appear in the suite's own output, and the
      # run must not need GH_APP_* to pass.
      - name: Prove the suite needs no credential and leaks no key
        env:
          GH_APP_ID: ''
          GH_APP_ORG: ''
          GH_APP_PRIVATE_KEY: ''
          GH_APP_REPOS: ''
          GH_APP_PERMISSIONS: ''
        run: |
          set -uo pipefail
          npm test > out.txt 2>&1; rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::the broker suite requires a credential to pass; it must not"
            cat out.txt; exit 1
          fi
          if grep -qE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' out.txt; then
            echo "::error::private key material reached the suite's stdout"
            exit 1
          fi
          echo "broker suite: passes with GH_APP_* empty, no key in output"
          rm -f out.txt

  # ---------------------------------------------------------------------------
  # OmniRoute management-operation broker (TOG-391 / TOG-473 / TOG-537).
  #
  # This is an Ops Tooling plugin, not Model Router product code. Its native
  # suite proves the exact operation allowlist, secret resolution, redaction,
  # audit ordering and two-agent approval protocol. The calibration suite then
  # mutates the committed catalogue and mapping plan to prove the mapping guard
  # still goes red for an unseen Claude-bearing id, a wildcard, a missing
  # priority and a protected-family mapping.
  #
  # Both are offline: no credential, no network and no host. The LIVE catalogue
  # check stays operator-run because a fixture certifies only the fixture.
  omniroute-broker-suite:
    name: omniroute-broker suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Broker security suite
        run: node --test plugins/omniroute-broker/test/broker.test.mjs

      - name: Mapping-guard calibration mutation suite
        run: node --test test_tog473_mapping_guard.mjs

      - name: Prove credential and key-management surfaces stay absent
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { VERBS, resolveVerb } from './plugins/omniroute-broker/dist/verbs.js'
          const forbiddenNames = [
            'keys.create', 'keys.reveal', 'keys.regenerate', 'keys.rotate',
            'cli.tokens.create', 'cli.tokens.mint',
          ]
          for (const name of forbiddenNames) {
            if (Object.hasOwn(VERBS, name)) throw new Error(`forbidden verb exists: ${name}`)
            try { resolveVerb(name); throw new Error(`forbidden verb resolved: ${name}`) }
            catch (error) { if (error.status !== 404) throw error }
          }
          const forbiddenPaths = ['/api/keys', '/api/cli/tokens']
          for (const [name, verb] of Object.entries(VERBS)) {
            for (const path of forbiddenPaths) {
              if (verb.path === path || verb.path.startsWith(`${path}/`)) {
                throw new Error(`${name} reaches forbidden credential path ${verb.path}`)
              }
            }
          }
          console.log('credential mint, reveal and regeneration surfaces: absent')
          NODE

  # ---------------------------------------------------------------------------
  # gh-event-capture (TOG-289 / TOG-244).
  #
  # The self-hosted GitHub webhook store that stands in — partially, and the
  # README is emphatic about which parts — for the org audit log GitHub Free
  # does not give us.
  #
  # Its own job for the same reason as `broker-suite`: a different runtime
  # concern from the shell suites, and a failure here should read as "the
  # capture suite went red", not as one opaque "CI failed".
  #
  # NO INSTALL STEP, and that is not an omission. This directory has zero
  # runtime and zero dev dependencies: `node --test` on the sources, an
  # in-memory store standing in for D1, and a stub HTTP server for the shell
  # tools. Nothing here reaches npm, Cloudflare or GitHub. If a dependency ever
  # becomes necessary, the `--include=dev --ignore-scripts` install and the
  # did-it-actually-land guard from `broker-suite` are the pattern to copy.
  #
  # Gated on EXIT STATUS, never on a test count. See the header.
  capture-suite:
    name: gh-event-capture suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gh-event-capture
    steps:
      - uses: actions/checkout@v4

      # Node 24: the suite uses the global Request/Response/Headers and the
      # WebCrypto that the Workers runtime provides, so testing on a Node that
      # lacks them would be testing a different program than the one deployed.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check
        run: |
          set -euo pipefail
          npm run check
          for f in scripts/*.sh test/*.sh; do bash -n "$f"; done

      - name: Receiver suite
        run: npm test

      - name: Shell tool suite
        run: ./test/test_scripts.sh

      # The assertion behind every other step here. Reintroduce the exact bug
      # this module exists to prevent — a receiver that accepts without
      # verifying the signature — into a THROWAWAY COPY, never the tracked
      # file, and require the suite to reject it.
      #
      # The URL is public by construction, so "we verify signatures" is the
      # whole security model. A suite that would stay green without the
      # verification is decoration, and it would be believed.
      #
      # TOG-339 — this step was itself decoration for its whole life, and the
      # CISO review (TOG-315) caught it. Two independent defects, both fixed
      # below; do not undo either.
      #
      #   1. It staged an ENUMERATED SUBSET (`src test package.json`), while
      #      the suite's NUL-byte scan walks src/ test/ scripts/ migrations/d1/
      #      and the root. The staged copy died on `ENOENT scandir scripts`
      #      BEFORE the mutation was ever exercised, so it was red no matter
      #      what src/app.js did. Staging is now the whole directory, because a
      #      hand-maintained list silently rots the next time a directory is
      #      added and nothing in CI would say so.
      #
      #   2. It had no BASELINE. The verdict is "suite passed -> error, else
      #      it worked", so a copy that is ALWAYS red always reports success.
      #      Run verbatim with no mutation applied it printed "suite correctly
      #      went red against the unverifying mutant" and CI went green. This
      #      is the TOG-253 lesson that mutation_check() already encodes for
      #      the shell suites above; capture-suite never got it. A red is only
      #      attributable to the mutation if the unmutated copy is green FIRST.
      #
      # TOG-354 — a third defect of the same family, found verifying the two
      # above. A red attributable to the mutation is still not necessarily a
      # red attributable to SIGNATURE VERIFICATION, and this step only asked
      # for "some test failed". See the two guards inline below.
      - name: Prove the suite detects a receiver that skips verification
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp -r . "$mut/"

          # Both runs go through this one function. They must differ ONLY by the
          # mutation — if the baseline and the mutant ran different commands, a
          # command that is broken for any other reason would look like a red
          # and we would be back to a gate that proves nothing.
          run_suite() { (cd "$mut" && node --test --test-reporter=tap test/capture.test.mjs > "$1" 2>&1); }

          # STEP 1 — baseline. Without this the gate measures nothing.
          if ! run_suite baseline.txt; then
            echo "::error::the UNMUTATED copy already fails — this gate proves nothing, fix the staging before trusting any red below"
            cat "$mut/baseline.txt"
            exit 1
          fi
          # A SKIPPED test is a disabled test, and it leaves the baseline green.
          # Without this, the very tests this gate exists to exercise can be
          # switched off and every check below still reports success. `todo` is
          # the same hole by another name: the assertions still run but their
          # failure is not counted, so a todo'd signature test is a signature
          # test that cannot go red.
          if ! grep -qE '^# skipped 0$' "$mut/baseline.txt" ||
             ! grep -qE '^# todo 0$' "$mut/baseline.txt"; then
            echo "::error::the staged suite DISABLES tests (skip/todo) — a disabled signature test switches off the thing this gate proves"
            grep -E '^ok [0-9]+ - .*# (SKIP|TODO)' "$mut/baseline.txt"
            exit 1
          fi
          echo "baseline: the unmutated staged copy is GREEN with nothing skipped — a red below is attributable to the mutation"

          # STEP 2 — mutate, and require the suite to notice.
          node -e '
            const fs = require("fs")
            const p = process.argv[1]
            const s = fs.readFileSync(p, "utf8")
            const call = "const verdict = await verifySignature({ secret: webhookSecret, body: bodyBytes, header: signature })"
            if (!s.includes(call)) {
              console.error("::error::could not find the verification call to mutate; this guard is now blind, fix it")
              process.exit(2)
            }
            fs.writeFileSync(p, s.replace(call, "const verdict = { ok: true }"))
          ' "$mut/src/app.js" || exit 1
          node --check "$mut/src/app.js"
          if run_suite out.txt; then
            echo "::error::the suite PASSED against a receiver that does not verify signatures"
            grep -E '^# (tests|pass|fail|skipped)' "$mut/out.txt"
            exit 1
          fi
          # TOG-354 — the red must be THE red. "Some test failed" is not the
          # assertion we want: an unverifying receiver also reddens the
          # rejection-counter tests, for BOOKKEEPING reasons — they fail
          # because nothing is being rejected, not because anything checked
          # that a forgery was refused. So all five signature tests could be
          # deleted and this step still printed "correctly went red" and exited
          # 0. Name the tests that must fail.
          #
          # On the enumerated list, given defect 1 above: the staging list
          # rotted SILENTLY (a missing directory became an ENOENT that read as
          # success). This one rots LOUDLY — a renamed or deleted test is
          # reported as missing and the step goes red, rather than quietly
          # reducing what is checked. Keep that property if you restructure it.
          not_ok="$(awk '/^not ok [0-9]+ - /{sub(/^not ok [0-9]+ - /,"");print}' "$mut/out.txt")"
          present="$(awk '/^(not )?ok [0-9]+ - /{sub(/^(not )?ok [0-9]+ - /,"");print}' "$mut/out.txt")"
          missing=0
          for name in \
            "an UNSIGNED delivery is rejected with 401 and stores nothing" \
            "a delivery signed with the WRONG secret is rejected with 401 and stores nothing" \
            "a TAMPERED body fails the signature that was valid for the original" \
            "a MALFORMED signature header is rejected without being treated as a mismatch" \
            "every 401 looks identical, so probing cannot distinguish the failure"
          do
            if ! grep -Fxq -- "$name" <<<"$present"; then
              echo "::error::required signature test is no longer in the suite: $name"
              missing=1
            elif ! grep -Fxq -- "$name" <<<"$not_ok"; then
              echo "::error::the unverifying mutant did NOT fail: $name — this red is not attributable to signature verification"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::the mutant went red, but not on the signature tests — the gate would be decoration again"
            exit 1
          fi
          echo "suite correctly went red against the unverifying mutant, on every required signature test; it failed on:"
          grep -E '^not ok ' "$mut/out.txt"

      # The shell suite fabricates its own RSA key and stubs the GitHub API.
      # Anything that starts needing a real credential is a regression in the
      # suite's isolation, not a networking problem to open the runner up for.
      - name: Prove the shell suite needs no credential and leaks no key
        env:
          GH_APP_ID: ''
          GH_APP_PRIVATE_KEY: ''
        run: |
          set -uo pipefail
          ./test/test_scripts.sh > out.txt 2>&1; rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::the shell suite requires a credential to pass; it must not"
            cat out.txt; exit 1
          fi
          if grep -qE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' out.txt; then
            echo "::error::private key material reached the suite's stdout"
            exit 1
          fi
          echo "shell suite: passes with GH_APP_* empty, no key in output"
          rm -f out.txt

  # ---------------------------------------------------------------------------
  # The host-side MCP transport (TOG-196 / TOG-194).
  #
  # Separate job, and pinned to Node 24 rather than the 20 the shell job uses,
  # for the same reason as broker-suite: this code runs on the HOST under the
  # node the operator actually has, and `node --test` semantics have moved
  # between those majors. Testing the transport on a Node the host does not run
  # would be testing the wrong thing.
  #
  # Zero dependencies by design — no npm install step here, and there should
  # never be one. This process runs as the operator user with podman access;
  # an npm tree next to that is a supply-chain surface the server is small
  # enough not to need.
  #
  # Gated on EXIT STATUS, never a test count. See the header.
  mcp-suite:
    name: org-request-mcp suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: org-request-mcp regression suite
        run: node --test mcp/test/org-request-mcp.test.mjs

      # A suite that cannot fail is decoration, and this one guards an IDENTITY
      # boundary — the property the whole epic rests on. Every mutation below is
      # a real, tempting simplification rather than invented nonsense, and the
      # suite must reject each of them. Written with node -e and no single
      # quotes inside, matching the style of the offline-suites mutations above.
      - name: Prove the suite rejects each tempting simplification
        run: |
          set -uo pipefail
          rc=0

          # mcp_mutation_check <label> <needle> <replacement>
          #
          # Four properties, each of which has left a gate in this repo blind at
          # some point:
          #
          #   BASELINE   TOG-200's rule (ccbf918): the UNMUTATED copy must pass
          #              in this same staging directory FIRST, or "the mutated
          #              suite failed" is not attributable to the mutation — the
          #              staged copy could be failing for any reason at all (a
          #              sibling file the suite reads, a relative import that
          #              does not survive the copy) and the gate would still go
          #              green while proving nothing.
          #
          #   UNIQUENESS String.replace substitutes only the FIRST occurrence.
          #              A needle that later appears twice would mutate a site
          #              nobody meant to mutate, and this gate would report on
          #              that one instead — silently. So: exactly one, checked,
          #              not merely "found". (TOG-341)
          #
          #   PARSE      A mutation that no longer parses fails the suite for
          #              the wrong reason, which reads exactly like success.
          #
          #   WHOLE      A baseline that PASSES can still be the wrong baseline.
          #   SUITE      The staging dir used to hold `mcp/` alone, and the
          #              suite skips its real-gate sections when
          #              capability_gate.sh / org_request_queue.sh / lib/ are
          #              absent — so `node --test` reported "0 failed" while
          #              quietly running FEWER tests than CI did, and every
          #              mutation below was judged by whichever assertions
          #              happened to survive the copy. Measured on this branch
          #              (TOG-399): `cp -r mcp` alone ran 60 of 65, and the 5 it
          #              dropped included BOTH TOG-399 acceptance tests — the
          #              ones that drive the real gate end to end and are the
          #              only place a forged capability principal is caught.
          #              Copying the scripts costs a few seconds per mutation
          #              and puts the real gate behind all of them.
          #
          #              The skip assertion is what keeps that true. A skipped
          #              test is not a failed one, so without it this regresses
          #              in silence the next time the suite grows a section with
          #              a precondition. Three outcomes, deliberately: the count
          #              must be FOUND and be zero — a missing line means the
          #              reporter changed and the check has stopped measuring,
          #              which must not read as "nothing skipped".
          #
          #   REJECTED   And then, finally, the thing being asserted.
          mcp_mutation_check() {
            label="$1"; needle="$2"; repl="$3"
            mut="$(mktemp -d)"
            cp -r mcp lib "$mut/"
            cp capability_gate.sh org_request_queue.sh "$mut/"
            if ! node --test "$mut/mcp/test/org-request-mcp.test.mjs" > "$mut/base.txt" 2>&1; then
              echo "::error::$label: the UNMUTATED copy of the mcp suite already fails in the staging dir — this gate proves nothing"
              tail -25 "$mut/base.txt"
              return 1
            fi
            skipped="$(sed -n 's/^[^0-9]*skipped \([0-9][0-9]*\)$/\1/p' "$mut/base.txt" | tail -1)"
            if [ -z "$skipped" ]; then
              echo "::error::$label: could not read a skipped count out of the staged suite's summary; the reporter format changed and this gate has stopped measuring coverage"
              tail -25 "$mut/base.txt"
              return 1
            fi
            if [ "$skipped" -ne 0 ]; then
              echo "::error::$label: the staged copy SKIPPED $skipped test(s), so this mutation is judged by a smaller suite than CI runs. Stage whatever those tests need — a skipped assertion cannot reject a mutation."
              grep -F "﹣" "$mut/base.txt" | head -10
              return 1
            fi
            node -e '
              var fs = require("fs");
              var p = process.argv[1], label = process.argv[2], needle = process.argv[3], repl = process.argv[4];
              var s = fs.readFileSync(p, "utf8");
              var hits = s.split(needle).length - 1;
              if (hits !== 1) {
                console.error("::error::" + label + ": the mutation needle matches " + hits + " times, not exactly once; the code moved or the site was duplicated, and this gate is now blind. Fix the needle.");
                process.exit(2);
              }
              fs.writeFileSync(p, s.replace(needle, repl));
            ' "$mut/mcp/org-request-mcp.mjs" "$label" "$needle" "$repl" || return 1
            if ! node --check "$mut/mcp/org-request-mcp.mjs" 2>/dev/null; then
              echo "::error::$label: the mutation broke the parse; it would fail the suite for the wrong reason"
              return 1
            fi
            if node --test "$mut/mcp/test/org-request-mcp.test.mjs" >/dev/null 2>&1; then
              echo "::error::$label: the mcp suite PASSED against the mutation"
              return 1
            fi
            echo "suite correctly rejects the $label mutation"
          }

          # Silently ignore a forged identity argument instead of refusing it.
          # The most likely future "cleanup" — buildQueueArgs never reads a
          # `requester` key anyway, so the denylist looks redundant. A silent
          # drop lets a caller believe it acted as someone else right up until
          # it reads the audit log; the refusal has to be loud.
          mcp_mutation_check "silent-drop-identity-argument" \
            "const bad = Object.keys(args).find((key) => FORBIDDEN_ARGUMENT_NAMES.has(key));" \
            "const bad = undefined;" || rc=1

          # Advertise `additionalProperties: false` and then not enforce it —
          # which is what this server actually did until TOG-341. There is no
          # JSON-Schema validator in the process, so this line IS the
          # enforcement; without it an unrecognised key is dropped in silence
          # and the denylist above becomes the only control rather than the
          # specific-message layer its own comment claims it is.
          mcp_mutation_check "unenforced-input-schema" \
            "const unknown = Object.keys(args).find((key) => !Object.hasOwn(declared, key));" \
            "const unknown = undefined;" || rc=1

          # Let an unreachable database fail OPEN. The tempting version is "do
          # not take the transport down just because podman hiccuped" — which
          # converts a database outage into an authentication bypass, because
          # the agent header is then trusted on its own.
          mcp_mutation_check "fail-open-run-check" \
            "    if (failure) {" \
            "    if (failure) return; if (failure) {" || rc=1

          # The two halves of the queueEnv fix, mutated separately because they
          # fail independently and either alone would let a config file lie
          # about which company the queue is acting for.
          mcp_mutation_check "queueenv-reserved-name-allowed" \
            ".filter((key) => RESERVED_QUEUE_ENV.has(key));" \
            ".filter(() => false);" || rc=1
          mcp_mutation_check "queueenv-overrides-tenancy" \
            "PAPERCLIP_DB_CTR: cfg.dbContainer," \
            "PAPERCLIP_DB_CTR: cfg.dbContainer, ...cfg.queueEnv," || rc=1

          # TOG-388. Pair each alternative with the NEXT entry's failure reason.
          # This is the mutation the obvious test cannot see: every value the
          # caller supplied still reaches the argv, so a "did anything get
          # dropped" assertion stays green, and the queue records alternative 1
          # as having failed for reason 2. The result is a safer-alternatives
          # record that is fully populated and entirely wrong — worse than a
          # missing one, because it reads as diligence to the auditor whose
          # whole job is to read it.
          mcp_mutation_check "considered-paired-with-the-wrong-reason" \
            'argv.push("--considered", alternative, "--because", whyItFailed);' \
            'argv.push("--considered", alternative, "--because", considered[(index + 1) % considered.length].why_it_failed);' || rc=1

          # Drop the safer-alternatives arguments on the floor. Their absence is
          # INVISIBLE at this layer: the queue refuses the decision either way,
          # so the transport looks fine while every agent reviewer is simply
          # unable to decide anything. Both halves of the denial path, because
          # they fail independently.
          mcp_mutation_check "safer-alternatives-never-reach-the-cli" \
            'argv.push("--alternative", alternative);' \
            'void alternative;' || rc=1
          mcp_mutation_check "no-safer-finding-dropped" \
            'if (noSafer) argv.push("--no-safer-alternative", noSafer);' \
            'if (false) argv.push("--no-safer-alternative", noSafer);' || rc=1

          # The nested schema also says additionalProperties:false, and nothing
          # else walks into the array to enforce it — the top-level
          # assertKnownArguments only sees `alternatives_considered` itself.
          mcp_mutation_check "nested-additionalProperties-unenforced" \
            'const unknown = Object.keys(entry).find((key) => key !== "alternative" && key !== "why_it_failed");' \
            'const unknown = undefined;' || rc=1

          # TOG-399. The capability tools carry the SAME identity boundary as the
          # provisioning tools, one CLI over, so it gets the same mutation
          # coverage. Each of these is a plausible regression that would let the
          # transport record a principal the caller could influence.

          # Forge the capability requester. The tempting "simplification" is to
          # reuse a value already in scope; the acceptance test records the
          # submitter's authenticated id and this breaks it. Leading space keeps
          # the needle off the provisioning submit line, which is otherwise
          # identical.
          mcp_mutation_check "capability-requester-forged" \
            ' "submit", "--requester", identity.agentId,' \
            ' "submit", "--requester", "forged-principal",' || rc=1

          # Forge the custody key. This is THE key the whole two-key rule turns
          # on: if the countersigner's principal is anything but the
          # authenticated session, "two keys" is theatre. The acceptance test
          # asserts the recorded custodian is the authenticated countersigner.
          mcp_mutation_check "capability-custodian-forged" \
            '"countersign", "--custodian", identity.agentId, "--request", requestId,' \
            '"countersign", "--custodian", "forged-principal", "--request", requestId,' || rc=1

          # Drop the capability gate's own identity names from the denylist. They
          # are already undeclared keys, so the general control still refuses
          # them — but the SPECIFIC control is what names the rule in the audit
          # log, telling `custodian` (an impersonation attempt) apart from a
          # typo. The section-8 by-name test asserts the specific code.
          mcp_mutation_check "capability-identity-names-dropped" \
            '"custodian", "custodianAgentId", "custodian_agent_id", "decider",' \
            '' || rc=1

          # TOG-467. Take the safer-alternative arguments back off a capability
          # tool's schema. This is the regression that turned `main` red, and it
          # is the most tempting one in the file because it LOOKS like removing
          # something unused: no arm of the builder needs the key, and the gate
          # is one process away. What it actually does is shut the gate. This
          # transport enforces additionalProperties:false, so an argument the
          # schema does not declare is refused rather than dropped, and
          # capability_gate.sh refuses a denial with no way forward and a risky
          # grant with no considered record. Measured before the fix, with an
          # approve-a-non-risky-ask control that passed: four of the five
          # decision paths were unreachable. A door with no handle on the
          # agent's side does not report itself as broken — it reports as a
          # refusal the agent assumes it deserved.
          #
          # Rejected by `every property a schema advertises is actually read
          # onto the argv`, which needs no capability_gate.sh in the staging
          # directory. The acceptance tests do need it, and they used to skip
          # there — see WHOLE SUITE above; the staging dir now carries the
          # scripts, so both rejections are live rather than one.
          mcp_mutation_check "capability-review-loses-safer-alternatives" \
            '...saferAlternativeProperties(RISKY_CAPABILITY_CLAUSE),' \
            '' || rc=1
          mcp_mutation_check "countersign-loses-safer-alternatives" \
            '...saferAlternativeProperties(RISKY_COUNTERSIGN_CLAUSE),' \
            '' || rc=1

          # TOG-312. The read tool is the only tool here that is not a write,
          # and the three mutations below are the three ways it stops being a
          # read OF THE CALLER'S OWN RECORD while still looking like one — none
          # of them raises an error, changes a status code, or fails a health
          # check. Every one returns a cheerful 200 with the wrong contents.

          # Scope the read by the RUN instead of the AGENT. Reads like a tidy-up
          # (both are on `identity`, both are uuids, the run is "more precise"),
          # and the queue matches neither role nor agent against a run id — so
          # the requester's inbox is empty FOREVER, which is exactly what "no
          # decision yet" looks like. The bug TOG-312 fixes, restored in the
          # very tool that fixes it.
          mcp_mutation_check "read-scoped-by-run-not-agent" \
            '"--for", identity.agentId' \
            '"--for", identity.runId' || rc=1

          # Turn the read of MY requests into a read of EVERY request. `list`
          # is one subcommand over and renders the whole company queue —
          # requesters, templates, titles, reviewers, override records. From the
          # caller's side it looks like a working, generous inbox: their own
          # rows are all present. Pinned by an exact-argv assertion, because
          # "did my rows come back" cannot see this and never will.
          mcp_mutation_check "read-returns-every-agents-requests" \
            'return ["inbox", "--for", identity.agentId];' \
            'return ["list", "--status", "all"];' || rc=1

          # Give the read tool a property. The tool declares NONE, and that is
          # the whole of its identity guarantee: with no argument there is no
          # shape this call can take that names another principal. A single
          # innocuous-looking property is the entire distance between "reads
          # your decisions" and "reads anyone's".
          mcp_mutation_check "read-tool-grows-an-argument" \
            'properties: {},' \
            'properties: { for_agent: { type: "string", description: "whose inbox" } },' || rc=1

          exit $rc

      # The transport must never grow a path to the provisioner. This is a
      # source-level assertion because it is cheaper than any test and the
      # constraint is absolute: the queue is the only entry point.
      - name: Prove the transport cannot reach the provisioner
        run: |
          set -uo pipefail
          rc=0
          if grep -n "org_provisioner" mcp/org-request-mcp.mjs | grep -qv "never the provisioner"; then
            echo "::error::org-request-mcp.mjs references the provisioner"; rc=1
          fi
          # execFile only, and only with an argv array. A shell would make every
          # argument-hygiene test in the suite meaningless.
          for bad in "execSync" "spawnSync" "shell: true" "eval("; do
            if grep -nF "$bad" mcp/org-request-mcp.mjs; then
              echo "::error::mcp/org-request-mcp.mjs uses $bad; this transport shells out only via execFile with an argv array"; rc=1
            fi
          done
          [ $rc -eq 0 ] && echo "transport surface: clean"
          exit $rc
