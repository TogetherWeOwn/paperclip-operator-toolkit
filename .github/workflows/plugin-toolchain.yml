name: Plugin toolchain qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Plugin toolchain (Node ${{ matrix.node }}, ${{ matrix.plugin }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        plugin: [model-selection, cliproxy-insight]
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    env:
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/package-lock.json
      # Runs on drafts too: qualification is evidence for readiness, not a deploy.
      # Explicit script refusal is retained even if npm's version changes.
      - name: Clean install without lifecycle scripts
        run: |
          node --version
          npm --version
          npm config get ignore-scripts
          npm ci --include=dev --ignore-scripts
      - name: Qualify native forks and threads with the mutation worker cap
        run: node ../../scripts/qualify-vitest-pools.mjs .
      - name: Typecheck
        run: npm run typecheck
      - name: Plugin suite and retained security regressions
        run: npm test -- --pool=forks --maxWorkers=2
      - name: Qualify mutation JSON reporting and alias controls
        if: matrix.plugin == 'model-selection'
        run: node scripts/admission-simulator-alias-oracle.mjs
      - name: Build without lifecycle exceptions
        run: npm run build
