name: SDK isolated candidate qualification

on:
  pull_request:
    paths:
      - '.github/workflows/sdk-candidate.yml'
      - 'verification/sdk-qualification/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sdk-candidate.yml'
      - 'verification/sdk-qualification/**'

permissions:
  contents: read

concurrency:
  group: sdk-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stock-source-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.2'
      # Source/receipt controls only. No stock image pull, install or driver run:
      # the separate age/install/Security holds are not cleared by this job.
      - name: Check prepared stock driver syntax without executing it
        run: node --check verification/sdk-qualification/stock-driver.mjs
      - name: Refuse manual, historical and incomplete scheduling receipts
        run: node --test verification/sdk-qualification/stock-contract.test.mjs

  prepare-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.2'
      # This Node distribution supplies npm 11.19.1. Refuse any other version
      # rather than upgrading tools or silently losing native release-age policy.
      - name: Inventory exact published artifacts without importing them
        run: node verification/sdk-qualification/prepare-candidate.mjs inventory verification/sdk-qualification/candidate
      - name: Require reviewed closure and matching artifact identities
        run: node verification/sdk-qualification/prepare-candidate.mjs lock verification/sdk-qualification/candidate
      - name: Prove native age filtering and script refusal with first-party controls
        run: node verification/sdk-qualification/native-policy.mjs verification/sdk-qualification/candidate
      - name: Retain the exact npm CLI for the Node22 negative control
        run: printf 'NPM_CLI=%s\n' "$(readlink -f "$(command -v npm)")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
      - name: Require native Node22 engine refusal before installation
        run: node verification/sdk-qualification/engine-refusal.mjs verification/sdk-qualification/candidate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.2'
      - name: Clean-install only the reviewed isolated candidate lock
        working-directory: verification/sdk-qualification/candidate
        run: npm ci --ignore-scripts
      - name: Exercise isolated candidate exports and tiny array counters
        run: node --experimental-import-meta-resolve verification/sdk-qualification/candidate-contract.mjs verification/sdk-qualification/candidate
      - name: Require unchanged candidate source and lock
        run: git diff --exit-code -- verification/sdk-qualification/candidate/package.json verification/sdk-qualification/candidate/package-lock.json verification/sdk-qualification/candidate/.npmrc
      # Synthetic candidate evidence only: actual built consumers and stock
      # services remain separate gates. No production dependency is changed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-isolated-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            verification/sdk-qualification/candidate/package.json
            verification/sdk-qualification/candidate/package-lock.json
            verification/sdk-qualification/candidate/inventory.json
            verification/sdk-qualification/candidate/native-policy.json
            verification/sdk-qualification/candidate/candidate-contract.json
          if-no-files-found: error
          retention-days: 7
