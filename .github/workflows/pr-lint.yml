name: PR lint

# Convention for every change that lands on main:
#   * PR title = Conventional Commits header: `type(scope): summary`, <= 100 chars, no trailing period.
#     Types: feat fix perf refactor test docs build ci chore revert style security.
#   * PR body follows the PR template (Thinking Path, Linked Issues or Issue Description, What
#     Changed, Verification, Risks, Model Used, Checklist). The checks live in
#     .github/scripts/pr_standards.py with their tests next to it; this job runs both. This repo is
#     public: no internal ticket ids, instance links, private hostnames or branch names carrying a
#     card id in a title, body, commit or branch name.
#   * CI change-gating policy: heavy jobs without job-level gating, and workflow-level `paths:` on
#     required-check producers, warn here (fail once the mode is flipped). The code is
#     .github/scripts/ci_policy.py with its tests next to it.
#   * The repo is squash-merge only and the squash commit title is the PR title, so history on
#     main is one conventional commit per PR. The push run flags any commit that bypasses it
#     (for example a merge call that passes its own commit_title).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # A public repo never asks for an internal card reference.
  REQUIRE_CARD_REF: "false"
  # "error": a title, an empty body, an unfilled template and an internal reference all fail.
  PR_STANDARDS_MODE: "error"
  # "warn" until the change-gating policy is confirmed for this repo, then "error".
  CI_POLICY_MODE: "warn"

jobs:
  pr-lint:
    name: pr-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github
          sparse-checkout-cone-mode: true

      - name: Unit-test the lint
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_pr_standards.py'
          python3 -m unittest discover -s .github/scripts -p 'test_ci_policy.py'

      - name: Check title, body and commits
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: python3 .github/scripts/pr_standards.py

      - name: Check CI change-gating policy
        run: python3 .github/scripts/ci_policy.py
