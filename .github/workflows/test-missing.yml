name: test-missing

# TogetherWeOwn SDLC standard caller for the org test-missing gate (TOG-24380).
# Warn mode: reports but never fails. Do NOT add this check to any ruleset
# until the repo flips to enforce. The pin below is the staged placeholder
# SHA from the source change: it does not yet name a commit that contains
# the reusable workflow in the org repo. After an Operator applies the
# staged gate to the org repo, repin this caller to that merge SHA (and
# repin the same way on later updates) — never a moving tag. Until the
# repin lands, the test-missing job reports "workflow not found"; it is in
# no required set, so nothing is blocked, but treat that repin as the
# immediate follow-up to the org application.
#
# CI change-gating (TOG-14912, error mode): `timeout-minutes` is rejected on
# `uses:` jobs by GitHub schema, so the caller cannot carry its own bound —
# the bound lives inside the gate (every gate job: `timeout-minutes: 5`).
# The caller instead carries change detection: `detect` (light, 5 min,
# publishes `outputs:`) feeds `test-missing` via `needs:` + `if:` on its
# outputs, so docs-only PRs skip the gate instead of burning a runner.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: test-missing-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed code or test files
    # This repo runs GitHub-hosted only (its runner-label contract rejects
    # new self-hosted labels), so the detect job uses the pinned hosted
    # label instead of the private fleet label the source caller used.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute whether code or test files changed
        id: diff
        env:
          GATE_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${GATE_PR_BASE:-}" ]; then
            git diff --name-only "${GATE_PR_BASE}" HEAD > changed.txt
          else
            git diff --name-only HEAD~1 HEAD > changed.txt || true
          fi
          relevant=$(python3 - <<'PY'
          suffixes = (".py", ".sh", ".js", ".ts", ".mjs")
          test_dirs = ("test", "tests", "__tests__")
          def is_test(p):
              parts = p.replace("\\", "/").split("/")
              name = parts[-1]
              stem = name.rsplit(".", 1)[0] if "." in name else name
              if name.startswith("test_") or stem.endswith("_test"):
                  return True
              return any(d in test_dirs for d in parts[:-1])
          def is_src(p):
              return not is_test(p) and p.lower().endswith(suffixes)
          try:
              with open("changed.txt") as h:
                  files = [l.strip() for l in h if l.strip()]
          except OSError:
              files = []
          print("true" if any(is_src(f) or is_test(f) for f in files) else "false")
          PY
          )
          echo "relevant=${relevant}" >> "${GITHUB_OUTPUT}"

  # Keep id and name byte-identical: a future org ruleset requires `test-missing`.
  test-missing:
    name: test-missing
    needs: [detect]
    if: needs.detect.outputs.relevant == 'true'
    uses: TogetherWeOwn/.github/.github/workflows/test-missing-gate.yml@866275517a9875f02110f946411401db8907ec8a
    with:
      mode: warn
    permissions:
      contents: read
