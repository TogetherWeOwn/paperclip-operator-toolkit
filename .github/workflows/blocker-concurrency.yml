name: blocker-concurrency (warn-only)

# TogetherWeOwn SDLC standard, thin caller for the org blocker-ledger gate
# Calls the org reusable by pinned SHA, never a moving tag.
# Lands in warn mode: it reports but never fails. Do NOT add this check to
# any ruleset until the repo flips to enforce.
# Repin to the org adoption SHA when the Operator lands the gate.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:

permissions:
  contents: read

concurrency:
  group: blocker-concurrency-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  concurrency:
    name: concurrency
    uses: TogetherWeOwn/.github/.github/workflows/blocker-concurrency-gate.yml@11bd71901bbe5b1630ceea73d27597364c9af683 # adoption pin
    with:
      mode: warn
    permissions:
      contents: read
