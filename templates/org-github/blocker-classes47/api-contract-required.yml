# Blocker-ledger api-contract required wrapper (staged for TogetherWeOwn/.github).
#
# Thin wrapper so an org ruleset can require the WORKFLOW: it re-exports the
# bare `api-contract` check from the reusable gate. Stays in warn mode until the
# Operator flips the gate after measuring the false-positive rate. Never
# hand-edit this file: fix upstream, then re-copy.

name: Blocker api-contract required wrapper

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  api-contract:
    name: api-contract
    uses: TogetherWeOwn/.github/.github/workflows/blocker-api-contract-gate.yml@11bd71901bbe5b1630ceea73d27597364c9af683 # repin to the adoption SHA
    with:
      mode: warn
    permissions:
      contents: read
