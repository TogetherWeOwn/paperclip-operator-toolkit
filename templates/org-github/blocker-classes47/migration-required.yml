# Blocker-ledger migration required wrapper (staged for TogetherWeOwn/.github).
#
# Thin wrapper so an org ruleset can require the WORKFLOW: it re-exports the
# bare `migration` check from the reusable gate. Stays in warn mode until the
# Operator flips the gate after measuring the false-positive rate. Never
# hand-edit this file: fix upstream, then re-copy.

name: Blocker migration required wrapper

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  migration:
    name: migration
    uses: TogetherWeOwn/.github/.github/workflows/blocker-migration-gate.yml@3e82c42a1151f1fb333ffb59650a05bae1a7bec5 # repin to the adoption SHA
    with:
      mode: warn
    permissions:
      contents: read
