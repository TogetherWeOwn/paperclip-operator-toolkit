# Blocker-ledger migration gate (staged for TogetherWeOwn/.github).
#
# Staged source: this whole `blocker-classes47/` directory lands in the org
# `.github` repo (`migration-gate.yml` at `.github/workflows/`). An Operator
# applies it there after the source PR merges; repin callers to the adoption
# SHA at that point. Never hand-edit this file: fix upstream, then re-copy.
#
# WHAT THIS IS. One reusable workflow every TogetherWeOwn repo opts into with
# a single caller (`uses`) line (see ADOPTION.md next to this file). It runs the
# deterministic migration checks (blocker-ledger class 4) BEFORE any review
# model is involved: destructive DDL without a safety ack, non-concurrent
# index builds, lossy column-type changes, and migrations with no down path.
#
# REPORT-ONLY FIRST: `mode: warn` (the default) never fails the run for its
# own findings — the job sets `continue-on-error` in warn mode and writes
# findings to the step summary. Flip to `mode: enforce` once the
# false-positive rate over the last 20 PRs measures under 5%.

name: Blocker migration gate

on:
  workflow_call:
    inputs:
      mode:
        description: "warn (advisory, never fails) or enforce (findings fail the run)"
        required: false
        default: "warn"
        type: string
      dialect:
        description: "auto (default: sqlite iff a wrangler config declares d1_databases with a migrations_dir covering the changed paths) or an explicit postgres|sqlite pin (explicit always wins)"
        required: false
        default: "auto"
        type: string

permissions:
  contents: read

jobs:
  migration:
    name: migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.mode == 'warn' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the org gate logic (single source of truth)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TogetherWeOwn/.github
          # Org HEAD at staging time (resolves today); repin to the adoption
          # SHA when the Operator lands the gate files there.
          ref: 3e82c42a1151f1fb333ffb59650a05bae1a7bec5
          path: .org-gate-logic
          persist-credentials: false
      - name: Run migration checks on the PR diff
        env:
          GATE_MODE: ${{ inputs.mode }}
          GATE_DIALECT: ${{ inputs.dialect }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          GATE_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GATE_EVENT" == "pull_request" ]]; then
            base="$GATE_PR_BASE"
          elif [[ -n "${GATE_BEFORE:-}" && "$GATE_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            base="$GATE_BEFORE"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          if [[ -n "$base" ]]; then
            git cat-file -e "$base" || { echo "base not in local history; failing closed"; exit 1; }
            changed="$(git diff --name-only --no-renames --diff-filter=d "$base" HEAD --)"
          else
            changed="$(git ls-files)"
          fi
          printf '%s\n' "$changed" > /tmp/blocker-changed.txt
          # Dialect: `auto` (default) resolves via the tested lib helper
          # `detect_migration_dialect` below; an explicit `postgres`/`sqlite`
          # input is final and never auto-switched, so a mixed repo can pin
          # Postgres. Detection reads wrangler config FILES (comment-aware),
          # never the PR diff, and requires the wrangler `migrations_dir` to
          # cover a changed migration path -- a bare `d1_databases` string in
          # a PR or a commented config line never flips the result.
          # -I: ignore cwd so a PR-root module (re.py, json.py, glob.py)
          # can never shadow stdlib inside the gate.
          GATE_CHANGED=/tmp/blocker-changed.txt GATE_DIALECT="${GATE_DIALECT:-auto}" GATE_LOGIC="${GITHUB_WORKSPACE}/.org-gate-logic/blocker-classes47" python3 -I - <<'PY'
          import glob
          import os
          import sys
          sys.path.insert(0, os.environ.get("GATE_LOGIC", "blocker-classes47"))
          from blocker_migration_checks import (
              check_migration_down,
              check_migration_safety,
              detect_migration_dialect,
              is_migration_path,
          )
          changed = [
              line.strip()
              for line in open(os.environ["GATE_CHANGED"], encoding="utf-8")
              if line.strip()
          ]
          changed_set = set(changed)
          wrangler_texts = []
          for pattern in ("wrangler.toml", "wrangler.json", "wrangler.jsonc"):
              for hit in glob.glob(
                  os.path.join(os.environ.get("GITHUB_WORKSPACE", "."), "**", pattern),
                  recursive=True,
              ):
                  try:
                      with open(hit, encoding="utf-8") as f:
                          wrangler_texts.append(f.read())
                  except OSError:
                      pass
          dialect = detect_migration_dialect(
              os.environ.get("GATE_DIALECT", "auto") or "auto",
              changed_paths=[p for p in changed if p in changed_set],
              wrangler_texts=wrangler_texts,
          )
          print("blocker-migration: dialect=%s" % dialect)
          contents = {}
          for path in changed:
              if not (is_migration_path(path) and path.endswith(".sql")):
                  continue
              try:
                  with open(path, encoding="utf-8") as f:
                      contents[path] = f.read()
              except OSError:
                  pass
          findings = check_migration_safety(contents, dialect=dialect) + check_migration_down(
              [p for p in changed if p in changed_set], contents, dialect=dialect
          )
          if findings:
              print("::warning::blocker-migration findings:")
              for finding in findings:
                  print("::warning::%s" % finding)
          else:
              print("blocker-migration: clean")
          if findings and os.environ.get("GATE_MODE") == "enforce":
              raise SystemExit(1)
          PY
      - name: Summarise findings
        if: always()
        env:
          GATE_STATUS: ${{ job.status }}
          GATE_MODE: ${{ inputs.mode }}
        run: 'echo "### blocker-migration: $GATE_STATUS (mode $GATE_MODE)" >> "$GITHUB_STEP_SUMMARY"'
