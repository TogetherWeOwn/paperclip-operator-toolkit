# Blocker-ledger lockfile gate (staged for TogetherWeOwn/.github).
#
# Staged source: this whole `blocker-classes47/` directory lands in the org
# `.github` repo (`lockfile-gate.yml` at `.github/workflows/`). An Operator
# applies it there after the source PR merges; repin callers to the adoption
# SHA at that point. Never hand-edit this file: fix upstream, then re-copy.
#
# WHAT THIS IS. One reusable workflow every TogetherWeOwn repo opts into with
# a single caller (`uses`) line (see ADOPTION.md next to this file). It runs the
# deterministic lockfile checks (blocker-ledger class 7) BEFORE any review
# model is involved: manifests changed without their lockfile, and
# empty or corrupt lockfiles.
#
# REPORT-ONLY FIRST: `mode: warn` (the default) never fails the run for its
# own findings — the job sets `continue-on-error` in warn mode and writes
# findings to the step summary. Flip to `mode: enforce` once the
# false-positive rate over the last 20 PRs measures under 5%.

name: Blocker lockfile gate

on:
  workflow_call:
    inputs:
      mode:
        description: "warn (advisory, never fails) or enforce (findings fail the run)"
        required: false
        default: "warn"
        type: string
      ignore_manifests:
        description: "comma- or space-separated manifest basenames to exempt (e.g. 'package.json, Cargo.toml'); repos may also set the BLOCKER_LOCKFILE_IGNORE repo variable (read by this gate with an explicit with: winning when present)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.mode == 'warn' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the org gate logic (single source of truth)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TogetherWeOwn/.github
          # Org HEAD at staging time (resolves today); repin to the adoption
          # SHA when the Operator lands the gate files there.
          ref: 3e82c42a1151f1fb333ffb59650a05bae1a7bec5
          path: .org-gate-logic
          persist-credentials: false
      - name: Run lockfile checks on the PR diff
        env:
          GATE_MODE: ${{ inputs.mode }}
          GATE_IGNORE_MANIFESTS: ${{ inputs.ignore_manifests || vars.BLOCKER_LOCKFILE_IGNORE || '' }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          GATE_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GATE_EVENT" == "pull_request" ]]; then
            base="$GATE_PR_BASE"
          elif [[ -n "${GATE_BEFORE:-}" && "$GATE_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            base="$GATE_BEFORE"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          if [[ -n "$base" ]]; then
            git cat-file -e "$base" || { echo "base not in local history; failing closed"; exit 1; }
            changed="$(git diff --name-only --no-renames --diff-filter=d "$base" HEAD --)"
          else
            changed="$(git ls-files)"
          fi
          printf '%s\n' "$changed" > /tmp/blocker-changed.txt
          git ls-files > /tmp/blocker-present.txt
          # -I: ignore cwd so a PR-root module can never shadow stdlib.
          # Binary lockfiles (`bun.lockb`) are never opened as UTF-8 text
          # and `requirements*.txt` never reaches the emptiness check (see
          # `is_parseable_lockfile`). Manifest contents are read from the
          # PR checkout so tool-only `pyproject.toml`, the library-crate
          # hint, and the stdlib-only `go.mod` exemption work in the
          # delivered workflow — not just in library unit tests. The
          # `lockfile: none` marker is read from the BASE commit instead
          # (`git show "$base:$path"`): an opt-out must be merged first,
          # so a PR that adds the marker in the same diff still fails in
          # enforce mode (same shape as the PR-added wrangler bypass).
          GATE_CHANGED=/tmp/blocker-changed.txt GATE_PRESENT=/tmp/blocker-present.txt GATE_BASE="$base" GATE_LOGIC="${GITHUB_WORKSPACE}/.org-gate-logic/blocker-classes47" python3 -I - <<'PY'
          import os
          import re
          import subprocess
          import sys
          sys.path.insert(0, os.environ.get("GATE_LOGIC", ".org-gate-logic/blocker-classes47"))
          from blocker_lockfile_checks import (
              check_lockfile_parseable,
              check_lockfile_present,
              is_manifest,
              is_parseable_lockfile,
          )
          import os as _os
          changed = [
              line.strip()
              for line in open(os.environ["GATE_CHANGED"], encoding="utf-8")
              if line.strip()
          ]
          present = [
              line.strip()
              for line in open(os.environ["GATE_PRESENT"], encoding="utf-8")
              if line.strip()
          ]
          manifest_contents = {}
          for path in changed:
              if not is_manifest(path):
                  continue
              try:
                  with open(path, encoding="utf-8", errors="replace") as f:
                      manifest_contents[path] = f.read()
              except (OSError, UnicodeDecodeError, ValueError):
                  pass
          marker_contents = {}
          base = os.environ.get("GATE_BASE", "")
          if base:
              for path in changed:
                  if not is_manifest(path):
                      continue
                  read = subprocess.run(
                      ["git", "show", "%s:%s" % (base, path)],
                      capture_output=True, text=True,
                  )
                  if read.returncode == 0:
                      marker_contents[path] = read.stdout
          raw_ignore = os.environ.get("GATE_IGNORE_MANIFESTS", "") or ""
          ignore_manifests = tuple(
              piece for piece in re.split(r"[,\s]+", raw_ignore) if piece
          )
          lock_contents = {}
          for path in changed:
              if not is_parseable_lockfile(path):
                  continue
              try:
                  with open(path, encoding="utf-8", errors="replace") as f:
                      lock_contents[path] = f.read()
              except (OSError, UnicodeDecodeError, ValueError):
                  pass
          findings = check_lockfile_present(
              changed, present, manifest_contents, ignore_manifests,
              marker_contents,
          ) + check_lockfile_parseable(lock_contents)
          if findings:
              print("::warning::blocker-lockfile findings:")
              for finding in findings:
                  print("::warning::%s" % finding)
          else:
              print("blocker-lockfile: clean")
          if findings and os.environ.get("GATE_MODE") == "enforce":
              raise SystemExit(1)
          PY
      - name: Summarise findings
        if: always()
        env:
          GATE_STATUS: ${{ job.status }}
          GATE_MODE: ${{ inputs.mode }}
        run: 'echo "### blocker-lockfile: $GATE_STATUS (mode $GATE_MODE)" >> "$GITHUB_STEP_SUMMARY"'
