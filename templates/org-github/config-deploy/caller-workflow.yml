# Caller template — copy this ONE file into a consumer repo as
# .github/workflows/config-deploy.yml. It is the only per-repo file.
# The rules live in the reusable workflow; never copy them per repo.
# Before adoption, replace both CONFIG_DEPLOY_ORG_GITHUB_SHA markers with the
# same 40-character commit SHA after the workflow and checker have merged to
# TogetherWeOwn/.github. The placement gate intentionally rejects other pins.
name: config-deploy
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  config-deploy:
    # No mode input: the reusable workflow always runs in error mode, so a
    # PR cannot weaken this required check by editing the caller.
    uses: TogetherWeOwn/.github/.github/workflows/config-deploy.yml@CONFIG_DEPLOY_ORG_GITHUB_SHA
    with:
      checker_ref: CONFIG_DEPLOY_ORG_GITHUB_SHA
