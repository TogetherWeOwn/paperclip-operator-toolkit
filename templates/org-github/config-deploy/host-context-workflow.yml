name: config-deploy
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  config-deploy:
    name: config-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run shared config/deploy checks
        working-directory: .github/scripts
        run: python3 config_deploy_check.py --root "${{ github.workspace }}" --mode error
