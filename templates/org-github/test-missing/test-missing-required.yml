# Test-missing required wrapper (TOG-24380, staged for TogetherWeOwn/.github).
#
# Thin `pull_request` + `merge_group` wrapper so an org ruleset can require
# the WORKFLOW via `required_workflows`. Applies at
# `.github/workflows/test-missing-required.yml` in TogetherWeOwn/.github.
# Warn mode here: the wrapper never fails the run; repos flip to enforcing
# through the reusable gate input once the FP rate is measured under 5%.
#
# Always-run justification (TOG-14912): this wrapper is the required check
# itself, so it runs on every PR by definition — there is no narrower
# trigger to gate on. `timeout-minutes` is rejected on `uses:` jobs by
# GitHub schema; the bound lives inside the gate (every gate job carries
# `timeout-minutes: 5`). Per-repo callers add a `detect` + `needs:`/`if:`
# front (see ADOPTION.md) so docs-only PRs skip before the gate runs.

name: test-missing-required

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test-missing:
    name: test-missing
    uses: ./.github/workflows/test-missing-gate.yml
    with:
      mode: warn
    permissions:
      contents: read
